<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financeiro - MinuT&Ra</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script>
const SENHA_FIN="minutera2026";
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera",storageBucket:"placar-minutera.firebasestorage.app",messagingSenderId:"689991648080",appId:"1:689991648080:web:9deeb958183eae23e255"};
firebase.initializeApp(firebaseConfig);
</script>
</head>
<body class="bg-black text-white min-h-screen font-sans">
<div id="login" class="flex flex-col items-center justify-center min-h-screen p-4">
  <h1 class="text-3xl font-black text-yellow-400 mb-1">💰 FINANCEIRO</h1>
  <p class="text-zinc-600 text-xs mb-8 tracking-widest">MINUT&RA</p>
  <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 w-full max-w-sm">
    <input id="senha" type="password" placeholder="••••••••" class="w-full p-4 rounded-xl bg-zinc-800 border border-zinc-700 mb-3 text-center text-lg tracking-[0.3em]">
    <button onclick="entrar()" class="w-full bg-green-600 hover:bg-green-500 py-4 rounded-xl font-black">DESBLOQUEAR</button>
    <p id="erro" class="text-red-500 text-xs mt-3 hidden text-center">Senha incorreta!</p>
  </div>
</div>

<div id="app" class="hidden w-full max-w-7xl mx-auto p-4">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-black text-yellow-400">💰 FINANCEIRO MINUT&RA</h1>
    <div class="flex gap-2 items-center">
      <span class="text-xs text-zinc-500">SALDO:</span><span id="saldoTop" class="text-xl font-black">R$ 0,00</span>
      <button onclick="location.reload()" class="ml-3 text-xs bg-zinc-800 px-3 py-1 rounded-full">Sair</button>
    </div>
  </div>

  <!-- LADO A LADO -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">

    <!-- ESQUERDA: FORM -->
    <div class="bg-zinc-900 border-2 border-green-600 rounded-2xl p-5 sticky top-4">
      <h2 id="tituloForm" class="font-bold mb-4 text-green-400 text-lg">+ Novo Lançamento</h2>
      <input id="desc" placeholder="Descrição (ex: Aluguel quadra, Inscrições)" class="w-full p-3 rounded-xl bg-zinc-800 border border-zinc-700 mb-2">
      <div class="grid grid-cols-2 gap-2 mb-2">
        <input id="valor" type="number" step="0.01" placeholder="Valor R$" class="p-3 rounded-xl bg-zinc-800 border border-zinc-700">
        <input id="data" type="date" class="p-3 rounded-xl bg-zinc-800 border border-zinc-700">
      </div>
      <select id="tipo" class="w-full p-3 rounded-xl bg-zinc-800 border border-zinc-700 mb-3">
        <option value="despesa">🔴 Despesa</option>
        <option value="receita">🟢 Receita</option>
      </select>
      <label class="text-xs text-yellow-400">📎 Comprovante (PDF/Foto do Pix)</label>
      <input id="file" type="file" accept=".pdf,image/*" class="w-full p-2 rounded-xl bg-zinc-800 border border-zinc-700 mb-2">
      <p id="status" class="text-xs text-zinc-500 mb-2"></p>
      <button id="btn" onclick="salvar()" class="w-full bg-green-600 py-4 rounded-xl font-black text-lg">💾 SALVAR COM COMPROVANTE</button>
      <button id="btnCancelar" onclick="cancelarEdicao()" class="w-full bg-zinc-700 mt-2 py-3 rounded-xl font-bold text-sm hidden">CANCELAR EDIÇÃO</button>
    </div>

    <!-- DIREITA: HISTÓRICO -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold">Histórico (<span id="totalCount">0</span>)</h2>
        <span class="text-[10px] text-zinc-500">↑ Novos no topo</span>
      </div>
      <div id="lista" class="space-y-2 max-h-[80vh] overflow-y-auto pr-2"></div>
      <div class="mt-4 pt-4 border-t border-zinc-800 flex justify-between text-xl font-black">
        <span>SALDO TOTAL:</span><span id="saldo">R$ 0,00</span>
      </div>
    </div>

  </div>
</div>

<script>
const db=firebase.database(); const storage=firebase.storage();
let editandoId=null; let editandoPath=null; let cacheDados=[];
document.getElementById('data').valueAsDate=new Date();
function entrar(){
  if(document.getElementById('senha').value===SENHA_FIN){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    carregar();
  } else document.getElementById('erro').classList.remove('hidden');
}
document.getElementById('senha').addEventListener('keydown',e=>{if(e.key==='Enter') entrar();});
async function salvar(){
  const desc=document.getElementById('desc').value.trim();
  const valor=parseFloat(document.getElementById('valor').value);
  const data=document.getElementById('data').value;
  const tipo=document.getElementById('tipo').value;
  const file=document.getElementById('file').files[0];
  if(!desc||isNaN(valor)||!data){alert('Preencha descrição, valor e data');return;}
  const btn=document.getElementById('btn'); btn.innerText='⏳ ENVIANDO...'; btn.disabled=true;
  let url=''; let nomeArq='';
  try{
    let dadoExistente = editandoId? cacheDados.find(x=>x.id===editandoId) : null;
    url = dadoExistente? dadoExistente.urlComprovante || '' : '';
    nomeArq = dadoExistente? dadoExistente.nomeArquivo || '' : '';
    if(file){
      document.getElementById('status').innerText='📤 Enviando '+file.name+'...';
      if(nomeArq){ try{ await storage.ref('comprovantes/'+nomeArq).delete(); }catch(e){} }
      nomeArq=Date.now()+'_'+file.name.replace(/[^a-z0-9._-]/gi,'_');
      const ref=storage.ref('comprovantes/'+nomeArq);
      await ref.put(file);
      url=await ref.getDownloadURL();
    }
    const obj={desc,valor:Math.abs(valor),data,tipo,urlComprovante:url,nomeArquivo:nomeArq,timestamp: dadoExistente? dadoExistente.timestamp : Date.now()};
    if(editandoPath){ await db.ref(editandoPath).set(obj); }
    else { await db.ref('FINANCEIRO').push(obj); }
    cancelarEdicao();
    document.getElementById('status').innerText='✅ Salvo!';
  }catch(e){alert('Erro: '+e.message);}
  btn.innerText='💾 SALVAR COM COMPROVANTE'; btn.disabled=false;
}
function carregar(){
  db.ref('/').on('value',snapRoot=>{
    let arr=[];
    if(snapRoot.child('FINANCEIRO').exists()){
      snapRoot.child('FINANCEIRO').forEach(c=>{
        let v=c.val(); if(!v) return;
        arr.push({id:c.key, path:'FINANCEIRO/'+c.key, desc:v.desc||'Sem desc', valor:parseFloat(v.valor)||0, data:v.data||'', tipo:v.tipo||'receita', urlComprovante:v.urlComprovante||'', nomeArquivo:v.nomeArquivo||'', timestamp:v.timestamp||0});
      });
    }
    snapRoot.forEach(c=>{
      let v=c.val();
      if(v && v.valor!==undefined && v.desc && c.key.startsWith('-')){
        if(!arr.find(x=>x.id===c.key)){
          arr.push({id:c.key, path:c.key, desc:v.desc, valor:parseFloat(v.valor)||0, data:v.data||'', tipo:v.tipo||'receita', urlComprovante:v.urlComprovante||'', nomeArquivo:v.nomeArquivo||'', timestamp:v.timestamp||0});
        }
      }
    });
    cacheDados=arr;
    // MAIS NOVOS NO TOPO
    arr.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
    let html=''; let saldo=0;
    arr.forEach(l=>{
      let v = Math.abs(l.valor);
      saldo+= l.tipo==='despesa'? -v : v;
      html+=`<div class="flex justify-between items-center bg-zinc-800 p-3 rounded-xl border-l-4 ${l.tipo==='receita'?'border-green-500':'border-red-500'}">
        <div class="text-left text-sm flex-1">
          <b class="uppercase">${l.desc}</b> <span class="text-[10px] text-zinc-500">${l.data}</span><br>
          <span class="${l.tipo==='receita'?'text-green-400':'text-red-400'} font-bold">${l.tipo==='despesa'?'-':'+'} R$ ${v.toFixed(2)}</span>
          ${l.urlComprovante?` | <a href="${l.urlComprovante}" target="_blank" class="text-cyan-400 underline text-xs">📎 Ver</a>`:''}
        </div>
        <div class="flex gap-1 ml-2">
          <button onclick="editar('${l.id}')" class="bg-zinc-700 hover:bg-zinc-600 px-2 py-1 rounded text-xs">✏️</button>
          <button onclick="apagarPorPath('${l.path}','${l.nomeArquivo||''}')" class="bg-red-900/50 px-2 py-1 rounded text-xs">🗑️</button>
        </div>
      </div>`;
    });
    document.getElementById('lista').innerHTML=html||'<p class="text-zinc-600 text-sm">Nenhum lançamento</p>';
    document.getElementById('totalCount').innerText=arr.length;
    const txt='R$ '+saldo.toFixed(2);
    document.getElementById('saldo').innerText=txt;
    document.getElementById('saldoTop').innerText=txt;
    const sEl=document.getElementById('saldo'); sEl.className=saldo>=0?'text-green-400 font-black text-xl':'text-red-400 font-black text-xl';
    document.getElementById('saldoTop').className=saldo>=0?'text-green-400 font-black text-xl':'text-red-400 font-black text-xl';
  });
}
function editar(id){
  const l=cacheDados.find(x=>x.id===id); if(!l) return;
  editandoId=id; editandoPath=l.path;
  document.getElementById('desc').value=l.desc;
  document.getElementById('valor').value=l.valor;
  document.getElementById('data').value=l.data;
  document.getElementById('tipo').value=l.tipo;
  document.getElementById('tituloForm').innerText='✏️ Editando Lançamento';
  document.getElementById('btn').innerText='💾 ATUALIZAR';
  document.getElementById('btn').classList.replace('bg-green-600','bg-yellow-500');
  document.getElementById('btnCancelar').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}
function cancelarEdicao(){
  editandoId=null; editandoPath=null;
  document.getElementById('desc').value='';document.getElementById('valor').value='';document.getElementById('file').value='';
  document.getElementById('data').valueAsDate=new Date();
  document.getElementById('tituloForm').innerText='+ Novo Lançamento';
  document.getElementById('btn').innerText='💾 SALVAR COM COMPROVANTE';
  document.getElementById('btn').classList.replace('bg-yellow-500','bg-green-600');
  document.getElementById('btnCancelar').classList.add('hidden');
  document.getElementById('status').innerText='';
}
function apagarPorPath(path,nome){if(!confirm('Apagar este lançamento?'))return; db.ref(path).remove().then(()=>{if(nome) storage.ref('comprovantes/'+nome).delete().catch(()=>{});});}
</script>
</body>
</html>
