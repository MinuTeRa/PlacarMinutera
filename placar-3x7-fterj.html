<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DESAFIO DA MinuT&Ra - PLACAR</title>

<script>
// ========================================
// CONFIGURAÇÕES - MUDE SÓ AQUI
// ========================================
const NOME_BANCO = "FTERJ";
const NOME_CLUBE = "FTERJ";
const NOME_CAMPEONATO = "3x7 MinuT&Ra";

// QUANTAS LOGOS USAR: 1, 2 ou 3
const QTD_LOGOS = 2;

// COLOQUE AQUI SUAS 3 LOGOS
const LOGOS = [
  "logo1.png", // Logo 1 - Esquerda
  "logo2.png", // Logo 2 - Direita
  "logo3.png" // Logo 3 - Direita Extra
];

// NOVA: LOGO MARCA DAGUA
const LOGO_MARCA_DAGUA = "logo-minutera.png"; // <- COLOQUE O NOME DA SUA LOGO GRANDE AQUI
// ========================================
</script>

<style>
  body { background: #000; color: #fff; font-family: 'Arial Black', Arial; text-align: center; margin: 0; overflow: hidden; }

/* NOVA: MARCA DAGUA NO FUNDO */
#marca-dagua {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 60vw; /* Tamanho da logo. Aumenta pra ficar maior */
  opacity: 0.07; /* Transparencia. 0.05 = bem fraquinha */
  z-index: 0; /* Fica atras de tudo */
  pointer-events: none; /* Nao atrapalha clique */
}

/* TOPO COM 1 A 3 LOGOS */
.topo {
  background: linear-gradient(90deg, #FF8C00, #FF4500);
  padding: 10px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 5px solid #FFD700;
  position: relative;
  z-index: 2; /* Fica na frente da marca dagua */
}
.topo img {
  height: 75px;
  border-radius: 10px;
  background: white;
  padding: 5px;
  object-fit: contain;
}
.topo h1 {
  font-size: 2.2vw;
  margin: 0;
  color: #000;
  text-shadow: 2px 2px #FFD700;
  letter-spacing: 1px;
  flex: 1;
  text-align: center;
}
.logos-lado { display: flex; gap: 15px; align-items: center; }

/* TV PLACAR */
#lista { padding: 10px 10px 120px 10px; position: relative; z-index: 2; } /* z-index pra ficar na frente */
.placar { display: flex; justify-content: space-around; align-items: center; font-size: 1.8vw; margin: 5px 10px; padding: 8px; background: rgba(26,26,26,0.85); border-left: 8px solid #555; border-radius: 10px; transition: 0.3s; color: #fff; backdrop-filter: blur(2px); } /* fundo semi transparente */
.placar.empate { border-left: 8px solid #FFD700; background: rgba(42,42,0,0.85); color: #FFD700; }
.placar.p1 { background: linear-gradient(90deg, rgba(255,215,0,0.95), rgba(255,165,0,0.95)); color: #000; border-left: 8px solid #FFD700; font-size: 2.2vw; font-weight: bold; box-shadow: 0 0 20px #FFD700; }
.placar.p2 { background: linear-gradient(90deg, rgba(192,192,192,0.95), rgba(169,169,169,0.95)); color: #000; border-left: 8px solid #C0C0C0; font-size: 2.0vw; font-weight: bold; }
.placar.p3 { background: linear-gradient(90deg, rgba(205,127,50,0.95), rgba(139,69,19,0.95)); color: #000; border-left: 8px solid #CD7F32; font-size: 1.9vw; font-weight: bold; }
.placar.p1 span,.placar.p2 span,.placar.p3 span { color: #000; }
.placar.p1.prova,.placar.p2.prova,.placar.p3.prova { color: #000; }
.placar.p1.detalhe,.placar.p2.detalhe,.placar.p3.detalhe { color: #000; }
.placar.p1.total,.placar.p2.total,.placar.p3.total { color: #000; font-size: 2.1vw; text-shadow: 1px 1px 2px #fff; }

.pos { font-weight: bold; width: 6%; }.nome { width: 32%; text-align: left; padding-left: 10px; }
.prova { width: 10%; color: #00FFFF; font-size: 1.5vw; }
.total { color: #FFD700; width: 14%; font-weight: bold; }
.detalhe { font-size: 1.2vw; color: #ccc; width: 38%; }

/* TELA OPERADOR */
.container-operador { display: flex; gap: 15px; padding: 15px 15px 80px 15px; height: calc(100vh - 80px); background: #0f0f0f; position: relative; z-index: 2; }
.coluna-lancamento { width: 40%; background: #1a1a1a; padding: 15px 15px 40px 15px; border-radius: 10px; overflow-y: auto; border: 1px solid #333; }
.coluna-lista { width: 60%; background: #1a1a1a; padding: 15px 15px 40px 15px; border-radius: 10px; overflow-y: auto; border: 1px solid #333; }

.cabecalho { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; }
.cabecalho input {
  font-size: 18px; padding: 10px; border-radius: 8px;
  border: 2px solid #444; font-weight: bold;
  background: #222; color: #e0e0e0;
}
.cabecalho input:focus { border: 2px solid #FFA500; outline: none; background: #2a2a2a; }
#nome { width: 65%; }
#prova { width: 30%; background: #3a3a3a; color: #FFD700; }

.tabela-tiros { width: 100%; margin: 10px auto; border-collapse: collapse; }
.tabela-tiros th { background: #2a2a2a; color: #FFA500; padding: 6px; font-size: 16px; border-radius: 5px; }
.tabela-tiros td { padding: 3px; }
.tabela-tiros input {
  width: 90%; font-size: 18px; padding: 6px; text-align: center;
  border: 2px solid #444; border-radius: 5px; text-transform: uppercase;
  background: #222; color: #fff;
}
.tabela-tiros input:focus { border: 2px solid #FFA500; background: #2a2a2a; outline: none; }

button {
  font-size: 16px; padding: 10px 15px; margin: 5px 3px;
  border-radius: 8px; border: none; cursor: pointer; font-weight: bold;
  transition: 0.2s;
}
button:hover { opacity: 0.8; transform: scale(1.02); }

.btn-lancar { background: #D2691E; color: #fff; }
.btn-excel { background: #2E8B57; color: #fff; }
.btn-editar { background: #B8860B; color: #fff; font-size: 12px; padding: 5px 8px; }
.btn-excluir { background: #B22222; color: #fff; font-size: 12px; padding: 5px 8px; }

.item {
  display: flex; justify-content: space-between; align-items: center; padding: 6px;
  border-bottom: 1px solid #2a2a2a; font-size: 15px; color: #ddd;
}
.item-header {
  background: #2a2a2a; color: #FFA500; font-weight: bold;
  padding: 8px; border-radius: 5px; margin-bottom: 5px; font-size: 14px;
}

.legenda { font-size: 12px; color: #888; margin-bottom: 8px; }
.total-parcial { font-size: 20px; color: #4FC3F7; margin: 8px; font-weight: bold; }
.status { font-size: 12px; color: #81C784; }
#ultimo { color: #FFA500; }
</style>
</head>
<body>

<img id="marca-dagua" src="" alt="Marca Dagua"> <!-- NOVA LINHA: LOGO DE FUNDO -->

<div id="tela-placar" style="display:none;">
  <div class="topo" id="topo-tv"></div>
  <div id="lista"></div>
</div>

<div id="tela-lancamento">
  <div class="topo" id="topo-operador"></div>
  <div class="container-operador">
    <div class="coluna-lancamento">
      <div class="legenda">X = 12.01 | 10 = 10.0 | F2 Salvar | F3 Nova</div>
      <div class="status" id="status">Conectando Firebase...</div>
      <div class="cabecalho">
        <input type="text" id="nome" placeholder="NOME DO ATLETA" autofocus>
        <input type="text" id="prova" placeholder="Nº PROVA">
      </div>
      <table class="tabela-tiros">
        <thead><tr><th>TIRO</th><th>VALOR</th></tr></thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
      <div class="total-parcial" id="parcial">TOTAL: 0.00</div>
      <button class="btn-lancar" id="btnSalvar" onclick="lancar()">SALVAR [F2]</button>
      <button class="btn-lancar" onclick="novaSerie()">NOVA [F3]</button>
      <button class="btn-excel" onclick="exportarExcel()">EXCEL</button>
      <button class="btn-lancar" onclick="limparTudo()" style="background:#B22222; color:white;">ZERAR</button>
      <div id="ultimo" style="font-size:16px; margin-top:8px;"></div>
    </div>
    <div class="coluna-lista">
      <h3 style="color:#FFA500; margin-top:0;">HISTÓRICO DE LANÇAMENTOS</h3>
      <div id="lista-admin"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",
  authDomain: "placar-minutera.firebaseapp.com",
  databaseURL: "https://placar-minutera-default-rtdb.firebaseio.com",
  projectId: "placar-minutera",
  storageBucket: "placar-minutera.firebasestorage.app",
  messagingSenderId: "689991648080",
  appId: "1:689991648080:web:9deeb958183eae23e255"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let ranking = [];
let historico = [];
let editandoId = null;

document.getElementById('marca-dagua').src = LOGO_MARCA_DAGUA; // COLOCA A LOGO NA MARCA DAGUA

function montarTopo(idElemento) {
  let logosEsq = '<div class="logos-lado">';
  let logosDir = '<div class="logos-lado">';
  if(QTD_LOGOS >= 1) logosEsq += `<img src="${LOGOS[0]}" alt="Logo1">`;
  if(QTD_LOGOS >= 2) logosDir += `<img src="${LOGOS[1]}" alt="Logo2">`;
  if(QTD_LOGOS >= 3) logosDir += `<img src="${LOGOS[2]}" alt="Logo3">`;
  logosEsq += '</div>'; logosDir += '</div>';
  let html = `${logosEsq} <h1>${NOME_CAMPEONATO} - ${NOME_CLUBE}</h1> ${logosDir}`;
  document.getElementById(idElemento).innerHTML = html;
}
montarTopo('topo-tv'); montarTopo('topo-operador');

db.ref('.info/connected').on('value', snap => {
  const statusEl = document.getElementById('status');
  if(snap.val() === true){
    statusEl.innerText = `Online: ${new Date().toLocaleTimeString()}`;
    statusEl.style.color = '#81C784';
  } else {
    statusEl.innerText = 'Conectando...';
    statusEl.style.color = '#B22222';
  }
});

const urlParams = new URLSearchParams(window.location.search);
const modo = urlParams.get('modo');
if(modo === 'tv') {
  document.getElementById('tela-placar').style.display = 'block';
  document.getElementById('tela-lancamento').style.display = 'none';
} else { montarTabela(); }

db.ref(NOME_BANCO).on('value', snap => {
  ranking = []; historico = [];
  snap.forEach(child => {
    let val = child.val();
    if(val && val.contagem && val.contagem.x12_01!== undefined){
        ranking.push(val); historico.push(val);
    }
  });
  ranking.sort((a,b) => {
    if(b.pontos!== a.pontos) return b.pontos - a.pontos;
    if(b.contagem.x12_01!== a.contagem.x12_01) return b.contagem.x12_01 - a.contagem.x12_01;
    for(let i=10; i>=0; i--){ let k = i===10? 'x10' : i; if(b.contagem[k]!== a.contagem[k]) return b.contagem[k] - a.contagem[k]; }
    return 0;
  });
  if(modo === 'tv') atualizarTela(); else atualizarListaAdmin();
});

function montarTabela() {
  let html = "";
  for(let i=1; i<=10; i++){
    html += `<tr><td>${i}º</td><td><input type="text" id="t${i}" onkeyup="proximoTiro(event, ${i})" oninput="calcularParcial()"></td></tr>`;
  }
  document.getElementById('corpo-tabela').innerHTML = html;
}

function proximoTiro(e, num) {
  if(e.key === 'Enter' || e.key === 'Tab'){
    e.preventDefault();
    if(num < 10) document.getElementById('t'+(num+1)).focus();
    else document.getElementById('btnSalvar').focus();
  }
}

function calcularParcial() {
  let total = 0;
  for(let i=1; i<=10; i++) { total += valorTiro(document.getElementById('t'+i).value); }
  document.getElementById('parcial').innerText = `TOTAL: ${total.toFixed(2)}`;
}

function valorTiro(tiro) {
  tiro = tiro.toUpperCase();
  if(tiro === 'X') return 12.01;
  let v = parseFloat(tiro);
  return isNaN(v)? 0 : v;
}

function contarTiros(tiros) {
  let contagem = {x12_01:0, x10:0, x9:0, x8:0, x7:0, x6:0, x5:0, x4:0, x3:0, x2:0, x1:0, x0:0};
  tiros.forEach(t => {
    let v = valorTiro(t);
    if(v === 12.01) contagem.x12_01++;
    else contagem['x'+Math.floor(v)]++;
  });
  return contagem;
}

function gerarID() { return 'serie_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5); }

function lancar() {
  let nome = document.getElementById('nome').value.toUpperCase();
  let prova = document.getElementById('prova').value.toUpperCase();
  if(nome == "" || prova == "") { alert("Preencha Nome e Nº da Prova!"); return; }
  let tiros = []; let pontos = 0;
  for(let i=1; i<=10; i++) {
    let t = document.getElementById('t'+i).value;
    tiros.push(t); pontos += valorTiro(t);
  }
  let contagem = contarTiros(tiros);
  let id = editandoId? editandoId : gerarID();
  let atirador = {id: id, nome: nome, prova: prova, pontos: pontos, tiros: tiros, contagem: contagem, timestamp: Date.now(), data: new Date().toLocaleString()};

  db.ref(NOME_BANCO + '/' + id).set(atirador).then(()=>{
    document.getElementById('ultimo').innerText = editandoId? `ATUALIZADO: ${nome}` : `LANÇADO: ${nome} - P${prova} - ${pontos.toFixed(2)}`;
    editandoId = null;
    document.getElementById('btnSalvar').innerText = "SALVAR [F2]";
    cancelarEdicao();
  });
}

function novaSerie() { cancelarEdicao(); }
function cancelarEdicao() {
  editandoId = null;
  document.getElementById('btnSalvar').innerText = "SALVAR [F2]";
  document.getElementById('nome').value = "";
  document.getElementById('prova').value = "";
  for(let i=1; i<=10; i++) { document.getElementById('t'+i).value = ""; }
  document.getElementById('parcial').innerText = `TOTAL: 0.00`;
  document.getElementById('nome').focus();
}

function editar(id) {
  editandoId = id;
  let a = historico.find(x => x.id === id);
  if(!a) return;

  document.getElementById('nome').value = a.nome;
  document.getElementById('prova').value = a.prova;
  for(let i=1; i<=10; i++) {
    document.getElementById('t'+i).value = a.tiros[i-1] || "";
  }
  calcularParcial();
  document.getElementById('btnSalvar').innerText = "ATUALIZAR [F2]";
  document.getElementById('status').innerText = `Editando: ${a.nome}`;
  window.scrollTo(0,0);
}

function excluir(id) {
  if(confirm("EXCLUIR ESSE LANÇAMENTO?")) {
    db.ref(NOME_BANCO + '/' + id).remove();
    document.getElementById('status').innerText = "Excluído com sucesso!";
  }
}

function exportarExcel() {
  if(ranking.length === 0) { alert("Nenhum dado para exportar!"); return; }
  let csv = "POS,ATLETA,PROVA,TOTAL PTS,X12.01,10,9\n";
  let posicao = 1;
  for(let i=0; i<ranking.length; i++) {
    let a = ranking[i];
    let empatado = i > 0 && saoIguais(a, ranking[i-1]);
    if(!empatado) posicao = i + 1;
    csv += `${posicao},${a.nome},${a.prova},${a.pontos.toFixed(2)},${a.contagem.x12_01},${a.contagem.x10},${a.contagem.x9}\n`;
  }
  let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  let link = document.createElement("a");
  let url = URL.createObjectURL(blob);
  link.setAttribute("href", url);
  link.setAttribute("download", `Relatorio_${NOME_CAMPEONATO.replace(/ /g,'_')}.csv`);
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  alert("Relatório exportado!");
}

function saoIguais(a,b) {
  if(a.pontos!== b.pontos) return false;
  if(a.contagem.x12_01!== b.contagem.x12_01) return false;
  for(let i=10; i>=0; i--){ let k = i===10? 'x10' : i; if(a.contagem[k]!== b.contagem[k]) return false; }
  return true;
}

function atualizarTela() {
  let html = ""; let posicao = 1;
  for(let i = 0; i < 10 && i < ranking.length; i++) {
    let a = ranking[i];
    let empatado = i > 0 && saoIguais(a, ranking[i-1]);
    if(!empatado) posicao = i + 1;
    let classe = '';
    if(posicao === 1) classe = 'p1';
    else if(posicao === 2) classe = 'p2';
    else if(posicao === 3) classe = 'p3';
    else if(empatado) classe = 'empate';
    let detalhe = `X:${a.contagem.x12_01} | 10:${a.contagem.x10} | 9:${a.contagem.x9}`;
    html += `<div class="placar ${classe}">
      <span class="pos">${posicao}º</span>
      <span class="nome">${a.nome}</span>
      <span class="prova">P:${a.prova}</span>
      <span class="total">${a.pontos.toFixed(2)}</span>
      <span class="detalhe">${detalhe}</span>
    </div>`;
  }
  document.getElementById('lista').innerHTML = html || `<div class="placar"><span class="pos">1º</span> <span class="nome">AGUARDANDO 1º ATLETA</span></div>`;
}

function atualizarListaAdmin() {
  let html = `<div class="item-header"><span># | ATLETA | P | TOTAL | X | 10 | 9</span><span>AÇÕES</span></div>`;
  for(let i = 0; i < historico.length; i++) {
    let a = historico[i];
    let detalhe = `X:${a.contagem.x12_01} | 10:${a.contagem.x10} | 9:${a.contagem.x9}`;
    html += `<div class="item">
      <span>${i+1}º ${a.nome} | P:${a.prova} | ${a.pontos.toFixed(2)} | ${detalhe}</span>
      <span>
        <button class="btn-editar" onclick="editar('${a.id}')">EDITAR</button>
        <button class="btn-excluir" onclick="excluir('${a.id}')">EXCLUIR</button>
      </span>
    </div>`;
  }
  document.getElementById('lista-admin').innerHTML = html || "Nenhum lançamento ainda.";
}

function limparTudo() {
  if(confirm("APAGAR TODO O PLACAR?")) {
    db.ref(NOME_BANCO).remove();
    document.getElementById('ultimo').innerText = "PLACAR ZERADO";
    cancelarEdicao();
  }
}

document.addEventListener('keydown', function(e) {
  if(e.key === 'F2') { e.preventDefault(); lancar(); }
  if(e.key === 'F3') { e.preventDefault(); novaSerie(); }
});
</script>
</body>
</html>
