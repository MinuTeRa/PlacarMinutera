<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>CONTROLE V29.4 MULTI</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<style>body{background:#121212;color:#fff;font-family:Arial;padding:16px} .aba{display:inline-block;padding:8px 14px;background:#222;margin-right:6px;cursor:pointer;border-radius:6px} .aba.ativa{background:#FF8C00;color:#000;font-weight:900} .linkBox{background:#1e1e1e;padding:12px;margin:8px 0;border-radius:8px;border-left:4px solid #FF8C00} .link{color:#FF8C00;word-break:break-all}</style></head><body>
<div id="telaLogin" style="position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:999"><div style="background:#1e1e1e;padding:20px;border-radius:10px;border:2px solid #FF8C00;text-align:center"><h3 id="tituloLogin" style="color:#FF8C00">LOGIN</h3><input id="emailLogin" placeholder="email" style="width:100%;padding:8px;margin-top:10px"><input id="senhaLogin" type="password" placeholder="senha" style="width:100%;padding:8px;margin-top:8px"><button onclick="fazerLogin()" style="width:100%;margin-top:10px;padding:10px;background:#FF8C00;border:none;font-weight:900">ENTRAR</button></div></div>

<div style="display:flex;justify-content:space-between"><h2>CONTROLE | <span id="clubeNome">...</span></h2><span><span id="userEmail"></span> <button onclick="firebase.auth().signOut()">SAIR</button></span></div>

<div style="margin-top:12px">
<div class="aba ativa" onclick="aba('tv')">TVs</div>
<div class="aba" onclick="aba('links')">LINKS</div>
</div>

<div id="abaTv" style="margin-top:16px">
<h3 id="qualTv">QUAL TV? - ...</h3>
<div id="botoesTvs"></div>
</div>

<div id="abaLinks" style="display:none;margin-top:16px">
<h3>LINKS DESSE CLUBE</h3>
<div id="listaLinks"></div>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyA6DCLCJ86Qoe2Ph3VuCF6_vYv6EARedKE", authDomain: "placar-minutera.firebaseapp.com", databaseURL: "https://placar-minutera-default-rtdb.firebaseio.com", projectId: "placar-minutera" };
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let clubeAtual=null,isMaster=false;

function fazerLogin(){firebase.auth().signInWithEmailAndPassword(emailLogin.value,senhaLogin.value)}
firebase.auth().onAuthStateChanged(async user=>{
 if(!user){telaLogin.style.display='flex';return}
 telaLogin.style.display='none';userEmail.innerText=user.email;
 const key=user.email.replace(/\./g,',');
 const snap=await db.ref('USUARIOS_PERMISSOES/'+key).once('value');
 let perm=snap.val()||{clube:'FTERJ',master:false};
 clubeAtual=(perm.clube||'FTERJ').toUpperCase();
 isMaster=(perm.master===true);
 // TRAVA TOTAL: só master pode trocar pela URL
 const urlClube=new URLSearchParams(window.location.search).get('clube');
 if(isMaster && urlClube && ['FTERJ','SGC','CFTE','CTEC'].includes(urlClube.toUpperCase())){
   clubeAtual=urlClube.toUpperCase();
 }
 // se não é master, ignora tudo e fica no dele
 document.getElementById('clubeNome').innerText=clubeAtual;
 document.getElementById('tituloLogin').innerText=clubeAtual+' - LOGIN';
 document.getElementById('qualTv').innerText='QUAL TV? - '+clubeAtual;
 gerarTvs();
});
function aba(t){document.getElementById('abaTv').style.display=t=='tv'?'block':'none';document.getElementById('abaLinks').style.display=t=='links'?'block':'none';}

function getLink(clube,tv){
  if(tv=='TV') return `https://minutera.com.br/placar/tv.html?${clube}`;
  return `https://minutera.com.br/placar/tv.html?${clube}&tv=${tv.toLowerCase()}`;
}

function gerarTvs(){
  // SÓ TVs desse clube - não lista do outro
  const tvs=['TV','TV1','TV2','TV3'];
  let htmlBtn='';
  let htmlLinks='';
  tvs.forEach(tv=>{
    const link=getLink(clubeAtual,tv);
    htmlBtn+=`<div class="linkBox"><b>${tv} - ${clubeAtual}</b><br><a class="link" href="${link}" target="_blank">${link}</a> <button onclick="navigator.clipboard.writeText('${link}')">COPIAR</button></div>`;
    htmlLinks+=`<div class="linkBox"><b>${tv}</b><br><span class="link">${link}</span></div>`;
  });
  // celular também só do clube dele
  const linkCel=`https://minutera.com.br/placar/celular.html?${clubeAtual}`;
  htmlLinks+=`<div class="linkBox"><b>CELULAR - ${clubeAtual}</b><br><span class="link">${linkCel}</span></div>`;
  
  document.getElementById('botoesTvs').innerHTML=htmlBtn;
  document.getElementById('listaLinks').innerHTML=htmlLinks;
}
</script></body></html>
