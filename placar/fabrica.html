<!DOCTYPE html><html><head><meta charset="UTF-8"><title>FABRICA FIX</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;padding:20px}.card{background:#1e1e1e;border-radius:16px;padding:20px;max-width:600px;margin:20px auto;border:2px solid #FF8C00}input{width:100%;padding:12px;background:#000;color:#fff;border:1px solid #444;border-radius:8px;margin-top:6px}label{font-size:12px;color:#FF8C00;font-weight:800;margin-top:14px;display:block}.btn{width:100%;padding:14px;background:#FF8C00;color:#000;font-weight:900;border:none;border-radius:10px;margin-top:14px;cursor:pointer}.links{background:#000;border:1px dashed #FF8C00;border-radius:10px;padding:12px;margin-top:16px;font-size:13px;word-break:break-all;display:none}</style></head><body>
<div id="boxLogin" class="card"><h2 style="color:#FF8C00">LOGIN MASTER</h2><input id="emailL" placeholder="seu email master"><input id="senhaL" type="password" placeholder="senha"><button class="btn" onclick="login()">Entrar</button><div id="msg"></div></div>
<div id="boxFabrica" style="display:none">
<div style="text-align:center"><h1 style="color:#FF8C00">🏭 FABRICA DE CLIENTE</h1><div id="lblMaster" style="font-size:11px;color:#aaa"></div></div>
<div class="card">
<label>SIGLA (ex: SGC)</label><input id="sigla" style="text-transform:uppercase">
<label>NOME COMPLETO</label><input id="nome" placeholder="Shooter Guns Club">
<label>E-MAIL DO CLIENTE</label><input id="email" placeholder="ruam@kelly.com.br">
<label>SENHA PROVISÓRIA</label><input id="senha" value="minutera2025">
<label>LOGO DO CLUBE</label><input type="file" id="fileLogo" accept="image/*">
<button class="btn" onclick="criar()">🚀 CRIAR CLIENTE NOVO</button>
<div id="status" style="text-align:center;margin-top:10px;font-size:13px"></div>
<div id="linksBox" class="links"></div>
</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyA6DCLCJ86Qoe2Ph3VuCF6_vYv6EARedKE",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera",storageBucket:"placar-minutera.firebasestorage.app",messagingSenderId:"689991648080",appId:"1:689991648080:web:9deeb958183eaeaa23e255"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const storage=firebase.storage();
function login(){firebase.auth().signInWithEmailAndPassword(emailL.value,senhaL.value).catch(e=>msg.innerText=e.message);}
firebase.auth().onAuthStateChanged(u=>{if(u){boxLogin.style.display='none';boxFabrica.style.display='block';lblMaster.innerText="Logado: "+u.email;}});
async function criar(){
 let sigla=document.getElementById('sigla').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
 let nome=document.getElementById('nome').value.trim();
 let email=document.getElementById('email').value.trim().toLowerCase();
 let senha=document.getElementById('senha').value.trim();
 if(!sigla||!nome||!email){alert("Preencha sigla, nome e email");return;}
 status.innerText="Criando "+sigla+"...";
 try{
   let logoUrl="";let f=document.getElementById('fileLogo').files[0];
   if(f){let ref=storage.ref("logos_clientes/"+sigla+"/"+Date.now()+"_"+f.name);let snap=await ref.put(f);logoUrl=await snap.ref.getDownloadURL();}
   await db.ref(`CLUBES/${sigla}/_meta`).set({clube:sigla,nome:nome,criadoEm:Date.now(),logo:logoUrl});
   await db.ref(`CLUBES/${sigla}/config`).set({headerH:11,linhaH:6.1,logoH:6.5,rodapeH:5.5,fontNome:2.3,fontTotal:3,fontProva:2.8,fontDetalhe:2.05,fontRelogio:2.1,escala:100,propPx:35,contPx:35,tempoRodape:7,tempoFull:11,intervaloFull:90,logoClube:logoUrl,logoMinu:"",clube:sigla,nomeClube:nome});
   await db.ref(`CLUBES/${sigla}/config_TV1`).set({clube:sigla});await db.ref(`CLUBES/${sigla}/config_TV2`).set({clube:sigla});
   await db.ref(`CLUBES/${sigla}/atletas/_init`).set({aviso:"ok"});await db.ref(`CLUBES/${sigla}/atletas/_init`).remove();
   await db.ref(`PATROCINADORES_GLOBAIS/full/_meta`).set({criadoEm:Date.now()});await db.ref(`PATROCINADORES_GLOBAIS/rodape/_meta`).set({criadoEm:Date.now()});
   let emailKey=email.replace(/\./g,',');
   await db.ref("USUARIOS_PERMISSOES/"+emailKey).set({clube:sigla,master:false,pode:["prova"],email:email,nomeClube:nome,criadoEm:Date.now()});
   try{let secondApp=firebase.initializeApp(firebaseConfig,"second");await secondApp.auth().createUserWithEmailAndPassword(email,senha);secondApp.delete();}catch(e){console.log("Auth ja existe: "+e.message);}
   let baseUrl=location.href.substring(0,location.href.lastIndexOf('/')+1);
   linksBox.innerHTML=`✅ ${sigla} CRIADO!<br><br>📂 CLUBES/${sigla}/<br><br>TV: ${baseUrl}tv.html?clube=${sigla}<br>CEL: ${baseUrl}celular.html?clube=${sigla}<br>LANÇ: ${baseUrl}lancamento.html?clube=${sigla}<br>CONTROLE: ${baseUrl}controle.html (login: ${email})`;
   linksBox.style.display='block';status.innerText="✅ Pronto!";
 }catch(err){status.innerText="Erro: "+err.message;alert(err.message);}
}
</script></body></html>
