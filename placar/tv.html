<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>TV - Placar</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;overflow:hidden}
#header{background:linear-gradient(90deg,#FF8C00,#FF6A00);color:#000;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:900}
#lista{padding:10px}
.item{display:grid;grid-template-columns:60px 80px 1fr 100px 300px;gap:10px;background:#1a1a1a;padding:12px;margin-bottom:6px;border-radius:6px;border-left:5px solid #FF8C00;font-size:18px}
#erro{height:100vh;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Arial}
</style></head><body>
<div id="app"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA6DCLCJ86Qoe2Ph3VuCF6_vYv6EARedKE",
  authDomain: "placar-minutera.firebaseapp.com",
  databaseURL: "https://placar-minutera-default-rtdb.firebaseio.com",
  projectId: "placar-minutera",
  storageBucket: "placar-minutera.firebasestorage.app",
  messagingSenderId: "689991648080",
  appId: "1:689991648080:web:9deeb958183eaeaa23e255"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// --- IDENTIFICA CLUBE?FTERJ?SGC?clube=SGC ---
let clubeAtual = null;
const params = new URLSearchParams(window.location.search);
if(params.get('clube')) clubeAtual = params.get('clube').toUpperCase();
else {
  const raw = window.location.search.replace('?','').toUpperCase().trim();
  if(raw) clubeAtual = raw.split('=')[0].split('&')[0];
}
const CLUBES_VALIDOS = ['FTERJ','SGC','CFTE','CTEC'];

if(!clubeAtual ||!CLUBES_VALIDOS.includes(clubeAtual)){
  document.getElementById('app').innerHTML = `
    <div id="erro">
      <h1 style="color:#FF8C00;font-size:52px">CLUBE NÃO DEFINIDO</h1>
      <p style="margin-top:20px;font-size:18px;color:#aaa">Use um dos links abaixo:</p>
      <div style="margin-top:25px;background:#222;padding:20px 30px;border-radius:12px;text-align:left;line-height:2;font-size:18px">
        <div><b style="color:#FF8C00">FTERJ:</b> tv.html?FTERJ</div>
        <div><b style="color:#FF8C00">SGC:</b> tv.html?SGC</div>
        <div><b style="color:#FF8C00">CFTE:</b> tv.html?CFTE</div>
        <div><b style="color:#FF8C00">CTEC:</b> tv.html?CTEC</div>
      </div>
      <p style="margin-top:25px;font-size:13px;color:#555">minutera.com.br/placar/tv.html?SGC</p>
    </div>`;
  throw new Error('Clube nao definido');
}

// --- SE PASSOU, MOSTRA PLACAR ---
document.getElementById('app').innerHTML = `
<div id="header"><span id="nomeClube">${clubeAtual} - AO VIVO</span><span id="hora"></span></div>
<div id="lista">Carregando...</div>
`;

setInterval(()=>{ document.getElementById('hora').innerText = new Date().toLocaleTimeString(); },1000);

function render(dados){
  const lista = Object.keys(dados||{}).filter(k=>k.startsWith('serie_')).map(k=>({key:k,...dados[k]}));
  lista.sort((a,b)=>(b.pontos||0)-(a.pontos||0));
  let html='';
  lista.forEach((it,i)=>{
    html+=`<div class="item"><div>${i+1}º</div><div><b>${it.prova||''}</b></div><div>${it.nome||''}</div><div>${(it.pontos||0).toFixed(2)}</div><div style="color:#aaa;font-size:14px">${(it.tiros||[]).join(' | ')}</div></div>`;
  });
  document.getElementById('lista').innerHTML = html || '<div style="padding:20px;color:#666">Nenhum lançamento</div>';
}

// tenta novo, se não tiver cai no antigo pra FTERJ
db.ref('CLUBES/'+clubeAtual).on('value', snap=>{
  const val = snap.val();
  if(val && Object.keys(val).some(k=>k.startsWith('serie_'))){
    render(val);
  } else if(clubeAtual=='FTERJ'){
    // fallback banco antigo
    db.ref('FTERJ').once('value', s2=> render(s2.val()));
  } else {
    render(val);
  }
});
</script></body></html>
