<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celular - Placar</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0e0e0e;color:#fff;font-family:Arial}
#header{background:linear-gradient(90deg,#FF8C00,#FF6A00);color:#000;padding:12px 16px;font-weight:900;display:flex;justify-content:space-between}
.item{display:grid;grid-template-columns:35px 50px 1fr 60px;gap:8px;background:#1e1e1e;padding:10px 12px;margin:6px;border-radius:8px;font-size:14px;align-items:center}
.tiros{grid-column:1/5;color:#888;font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#erro{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
</style></head><body>
<div id="app"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA6DCLCJ86Qoe2Ph3VuCF6_vYv6EARedKE",
  authDomain: "placar-minutera.firebaseapp.com",
  databaseURL: "https://placar-minutera-default-rtdb.firebaseio.com",
  projectId: "placar-minutera",
  storageBucket: "placar-minutera.firebasestorage.app",
  messagingSenderId: "689991648080",
  appId: "1:689991648080:web:9deeb958183eaeaa23e255"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let clubeAtual=null;
const params=new URLSearchParams(window.location.search);
if(params.get('clube')) clubeAtual=params.get('clube').toUpperCase();
else{ const raw=window.location.search.replace('?','').toUpperCase().trim(); if(raw) clubeAtual=raw.split('=')[0].split('&')[0]; }
const VALIDOS=['FTERJ','SGC','CFTE','CTEC'];

if(!clubeAtual ||!VALIDOS.includes(clubeAtual)){
  document.getElementById('app').innerHTML=`<div id="erro"><h1 style="color:#FF8C00;font-size:32px">CLUBE NÃO DEFINIDO</h1><p style="margin-top:15px;color:#aaa">Use:</p><div style="margin-top:20px;background:#1e1e1e;padding:16px 20px;border-radius:10px;text-align:left;line-height:2"><div>celular.html?FTERJ</div><div>celular.html?SGC</div><div>celular.html?CFTE</div></div></div>`;
  throw new Error('sem clube');
}

document.getElementById('app').innerHTML=`<div id="header"><span>${clubeAtual}</span><span id="hora"></span></div><div id="lista">Carregando...</div>`;
setInterval(()=>{let el=document.getElementById('hora');if(el) el.innerText=new Date().toLocaleTimeString();},1000);

function render(dados){
  const lista=Object.keys(dados||{}).filter(k=>k.startsWith('serie_')).map(k=>({key:k,...dados[k]}));
  lista.sort((a,b)=>(b.pontos||0)-(a.pontos||0));
  let html='';
  lista.forEach((it,i)=>{
    html+=`<div class="item"><div>${i+1}º</div><div><b>${it.prova||''}</b></div><div>${it.nome||''}</div><div>${(it.pontos||0).toFixed(2)}</div><div class="tiros">${(it.tiros||[]).join(' | ')}</div></div>`;
  });
  document.getElementById('lista').innerHTML=html||'<div style="padding:20px;color:#666">Nenhum lançamento</div>';
}

db.ref('CLUBES/'+clubeAtual).on('value',snap=>{
  const v=snap.val();
  if(v && Object.keys(v).some(k=>k.startsWith('serie_'))) render(v);
  else if(clubeAtual=='FTERJ') db.ref('FTERJ').once('value',s2=>render(s2.val()));
  else render(v);
});
</script></body></html>
