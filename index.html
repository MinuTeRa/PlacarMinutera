<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera",storageBucket:"placar-minutera.firebasestorage.app",messagingSenderId:"689991648080",appId:"1:689991648080:web:9deeb958183eae23e255"};firebase.initializeApp(firebaseConfig);const db=firebase.database();let ranking=[];let historico=[];let editandoId=null;let senhaOk=false;let offsetServidor=0;let anunciosLigados=true;
async function sincronizarHoraBrasilia(){try{let r=await fetch('https://worldtimeapi.org/api/timezone/America/Sao_Paulo');let d=await r.json();offsetServidor=new Date(d.datetime).getTime()-Date.now();}catch(e){offsetServidor=0;}}function atualizarRelogio(){let agora=new Date(Date.now()+offsetServidor);let txt=agora.toLocaleDateString('pt-BR')+' | '+agora.toLocaleTimeString('pt-BR');let el=document.getElementById('relogio-tv');if(el) el.innerText=txt;}sincronizarHoraBrasilia();setInterval(atualizarRelogio,1000);
function montarTopo(id){let e='<div class="logos-lado">',d='<div class="logos-lado">';if(QTD_LOGOS>=1) e+=`<img src="${LOGOS[0]}">`;if(QTD_LOGOS>=2) d+=`<img src="${LOGOS[1]}">`;e+='</div>';d+='</div>';let el=document.getElementById(id);if(el) el.innerHTML=`${e}<h1>${NOME_CAMPEONATO} - ${NOME_CLUBE}</h1>${d}`;}montarTopo('topo-tv');montarTopo('topo-operador');
let indiceRodape=0;function rotacionarRodape(){const r=document.getElementById('rodape-conteudo');if(!r) return;r.style.opacity=0;setTimeout(()=>{let p=PATROCINADORES_RODAPE[indiceRodape];r.innerHTML=`<div class="rodape-prop">${p.prop}</div><div class="rodape-contato">${p.contato}</div>`;r.style.opacity=1;indiceRodape=(indiceRodape+1)%PATROCINADORES_RODAPE.length;},300);}
let mostrando=false;function mostrarInsercaoFull(){if(!FULL_ATIVO||!anunciosLigados||mostrando) return;mostrando=true;let lista=PATROCINADORES_FULL.slice(0,FULL_QTD_PATROCINADORES);if(!lista.length){mostrando=false;return;}let total=lista.length*FULL_TEMPO_EXIBICAO_SEG;let resto=total;let idx=0;document.getElementById('insercao-full').style.display='flex';document.getElementById('contato-gigante').innerHTML=`VOLTAMOS EM <b style="color:#FFD700;">${resto}s</b>`;let timer=setInterval(()=>{resto--;let el=document.getElementById('contato-gigante');if(el) el.innerHTML=`VOLTAMOS EM <b style="color:#FFD700;">${resto}s</b>`;if(resto<=0) clearInterval(timer);},1000);function prox(){if(idx>=lista.length){clearInterval(timer);document.getElementById('insercao-full').style.display='none';mostrando=false;return;}let p=lista[idx];let el=document.getElementById('prop-gigante');if(p.arte) el.innerHTML=`<img src="${p.arte}" style="max-width:95vw;max-height:85vh;border-radius:15px;box-shadow:0 0 50px #FFD700;object-fit:contain;">`;else el.innerHTML=`<div style='font-size:4.5vw;color:#FFD700;font-weight:bold'>${p.prop}</div>`;setTimeout(()=>{idx++;prox();},FULL_TEMPO_EXIBICAO_SEG*1000);}prox();}
const urlParams=new URLSearchParams(window.location.search);const modo=(urlParams.get('modo')||'').toLowerCase();let inputComErro=null;function mostrarErro(msg,i){document.getElementById('modal-erro-msg').innerHTML=msg;document.getElementById('modal-erro').style.display='flex';if(i){let el=document.getElementById('t'+i);if(el){el.classList.add('erro');inputComErro=el;}}}function fecharErro(){document.getElementById('modal-erro').style.display='none';if(inputComErro){inputComErro.focus();inputComErro.select();}}
function validarTiros(){for(let i=1;i<=10;i++){let el=document.getElementById('t'+i);if(!el) continue;let v=el.value.toString().trim();if(v==='') continue;let up=v.toUpperCase();if(up==='X') continue;let num=parseFloat(v.replace(',','.'));if(isNaN(num)||num<0||num>10){mostrarErro(`No <b>${i}º TIRO</b> você digitou <b style="color:#ff0000;font-size:18px">"${v}"</b><br><br>Valor inválido! Só permitido <b>X</b> ou <b>0 até 10</b>!`,i);return false;}}return true;}
function iniciarFirebase(){db.ref('.info/connected').on('value',snap=>{let el=document.getElementById('status');let el2=document.getElementById('statusADM');let txt=snap.val()?'Online: '+new Date().toLocaleTimeString():'Conectando...';if(el) el.innerText=txt;if(el2) el2.innerText=txt;});db.ref(NOME_BANCO).on('value',snap=>{ranking=[];historico=[];snap.forEach(c=>{let v=c.val();if(v&&v.contagem){ranking.push(v);historico.push(v);}});ranking.sort((a,b)=>b.pontos-a.pontos);if(modo==='tv'||modo==='celular') atualizarTela();else if(modo!=='adm') atualizarListaAdmin();});db.ref('CONFIG_ANUNCIOS').on('value',snap=>{let val=snap.val();if(val===null) val=true;anunciosLigados=val;let toggle=document.getElementById('toggleAnuncio');let status=document.getElementById('statusAnuncio');if(toggle) toggle.checked=val;if(status){status.innerText=val?'ANUNCIOS LIGADOS':'ANUNCIOS DESLIGADOS';status.style.color=val?'#00FF00':'#ff4444';}});}
function alternarAnuncios(){let toggle=document.getElementById('toggleAnuncio');db.ref('CONFIG_ANUNCIOS').set(toggle.checked);}
if(modo==='tv'||modo==='celular'){document.getElementById('tela-placar').style.display='block';document.getElementById('rodape-tv').style.display='block';rotacionarRodape();setInterval(rotacionarRodape,RODAPE_TEMPO_EXIBICAO_SEG*1000);if(FULL_ATIVO) setInterval(mostrarInsercaoFull,FULL_TEMPO_ESPERA_SEG*1000);iniciarFirebase();}else if(modo==='adm'){document.getElementById('tela-senha').style.display='flex';window.modoADMpendente=true;}else{document.getElementById('tela-senha').style.display='flex';}
function verificarSenha(){let s=document.getElementById('inputSenha').value;if(s!==SENHA){document.getElementById('erroSenha').innerText="SENHA INCORRETA!";return;}senhaOk=true;document.getElementById('tela-senha').style.display='none';if(window.modoADMpendente||modo==='adm'){document.getElementById('tela-adm').style.display='block';montarLinksADM();iniciarFirebase();iniciarListaAtletasADM();}else{document.getElementById('tela-lancamento').style.display='block';montarTabela();iniciarFirebase();iniciarListaAtletas();}}
function montarLinksADM(){let base=window.location.href.split('?')[0];document.getElementById('links-adm').innerHTML=`<a class="link-adm" href="${base}?modo=tv" target="_blank">📺 TELÃO -> ${base}?modo=tv</a><a class="link-adm" href="${base}?modo=celular" target="_blank">📱 CELULAR -> ${base}?modo=celular</a><a class="link-adm" href="${base}" target="_blank">🎯 LANÇAMENTO -> ${base}</a><a class="link-adm" href="${base}?modo=adm" target="_blank">⚙️ ADM -> ${base}?modo=adm</a>`;}
function montarTabela(){let h="";for(let i=1;i<=10;i++) h+=`<tr><td>${i}º</td><td><input type="text" id="t${i}" onkeyup="proximoTiro(event,${i})" oninput="calcularParcial();this.classList.remove('erro')"></td></tr>`;document.getElementById('corpo-tabela').innerHTML=h;}
function proximoTiro(e,n){if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();if(n<10) document.getElementById('t'+(n+1)).focus();else document.getElementById('btnSalvar').focus();}}
function calcularParcial(){let t=0;for(let i=1;i<=10;i++){let el=document.getElementById('t'+i);if(el) t+=valorTiro(el.value);}document.getElementById('parcial').innerText=`TOTAL: ${t.toFixed(2)}`;}
function valorTiro(v){if(!v) return 0;v=v.toString().toUpperCase().trim();if(v==='X') return 12.01;let n=parseFloat(v.replace(',','.'));return isNaN(n)?0:n;}
function contarTiros(tiros){let c={x12_01:0,x10:0,x9:0,x8:0,x7:0,x6:0,x5:0,x4:0,x3:0,x2:0,x1:0,x0:0};tiros.forEach(t=>{let v=valorTiro(t);if(v===12.01) c.x12_01++;else c['x'+Math.floor(v)]++;});return c;}
function gerarID(){return 'serie_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);}
function lancarBase(){let nome=document.getElementById('nome').value.toUpperCase().trim();let prova=document.getElementById('prova').value.toUpperCase().trim();if(!nome||!prova) return alert("Preencha Nome e Prova");if(!validarTiros()) return;let tiros=[];let pts=0;for(let i=1;i<=10;i++){let v=document.getElementById('t'+i).value;tiros.push(v);pts+=valorTiro(v);}let cont=contarTiros(tiros);let id=editandoId?editandoId:gerarID();db.ref(NOME_BANCO+'/'+id).set({id,nome,prova,pontos:pts,tiros,contagem:cont,timestamp:Date.now()}).then(()=>{editandoId=null;novaSerie();});}
function atualizarListaAdmin(){let h="";let lista=[...historico].sort((a,b)=>b.timestamp-a.timestamp);if(lista.length==0){document.getElementById('lista-admin').innerHTML="<div style='color:#888;font-size:12px'>Nenhum lançamento</div>";return;}lista.forEach((a)=>{let cor=a.prova==='C'?'#00FF00':'#FFD700';let c=a.contagem;let txt=`X:${c.x12_01} | 10:${c.x10} | 9:${c.x9}`;h+=`<div class="item-admin"><div class="linha-principal"><span><b style="color:${cor};">${a.prova}</b> - ${a.nome} <b style="color:#FFD700;">${a.pontos.toFixed(2)}</b> <span style="font-size:10px;color:#ccc;margin-left:6px">${txt}</span></span><span><button class="btn-mini btn-editar" onclick="editarSerie('${a.id}')">EDITAR</button><button class="btn-mini btn-excluir" onclick="excluirSerie('${a.id}')">EXCLUIR</button></span></div></div>`;});document.getElementById('lista-admin').innerHTML=h;}
function editarSerie(id){let s=historico.find(x=>x.id===id);if(!s) return;editandoId=id;document.getElementById('nome').value=s.nome;document.getElementById('prova').value=s.prova;for(let i=0;i<10;i++){document.getElementById('t'+(i+1)).value=s.tiros[i]||'';}calcularParcial();document.getElementById('btnSalvar').innerText='ATUALIZAR';document.getElementById('btnSalvar').style.background='#FFD700';document.getElementById('btnSalvar').style.color='#000';document.getElementById('btnCancelar').style.display='inline-block';document.getElementById('nome').focus();}
function cancelarEdicao(){editandoId=null;novaSerie();}
function novaSerie(){editandoId=null;document.getElementById('nome').value="";document.getElementById('prova').value="";for(let i=1;i<=10;i++){let el=document.getElementById('t'+i);if(el){el.value="";el.classList.remove('erro');}}document.getElementById('parcial').innerText="TOTAL: 0.00";let s=document.getElementById('sugestoes');if(s) s.innerHTML='';let b=document.getElementById('btnSalvar');if(b){b.innerText='SALVAR [F2]';b.style.background='#D2691E';b.style.color='#fff';}let c=document.getElementById('btnCancelar');if(c) c.style.display='none';document.getElementById('nome').focus();}
function excluirSerie(id){if(!confirm('Excluir essa série?')) return;db.ref(NOME_BANCO+'/'+id).remove();}
function apagarPlacar(){if(!confirm('APAGAR TODO O PLACAR?')) return;if(!confirm('Confirmar?')) return;db.ref(NOME_BANCO).remove().then(()=>{CONTADOR_ATLETAS={};localStorage.setItem('contador_atletas',JSON.stringify(CONTADOR_ATLETAS));alert('Placar apagado!');});}
function apagarListaAtletas(){if(!confirm('Apagar lista do navegador E Firebase?')) return;localStorage.removeItem('lista_atletas');db.ref('LISTA_ATLETAS_GLOBAL').remove();LISTA_ATLETAS=[];atualizarInfoListaADM();atualizarInfoLista();alert('Lista apagada');}
function limparContadores(){if(confirm('Zerar C/R?')){CONTADOR_ATLETAS={};localStorage.setItem('contador_atletas',JSON.stringify(CONTADOR_ATLETAS));alert('Zerado!');}}
document.addEventListener('keydown',function(e){if(e.key==='F2'&&senhaOk){e.preventDefault();lancar();}if(e.key==='F3'&&senhaOk){e.preventDefault();novaSerie();}if(e.key==='F8'){e.preventDefault();mostrarInsercaoFull();}if(e.key==='Escape'){fecharErro();}});
function atualizarTela(){let html="";let max=(modo==='celular'?25:10);for(let i=0;i<max&&i<ranking.length;i++){let a=ranking[i];html+=`<div class="placar ${i==0?'p1':i==1?'p2':i==2?'p3':''}"><span class="pos">${i+1}º</span><span class="nome">${a.nome}</span><span class="prova">P:${a.prova}</span><span class="total">${a.pontos.toFixed(2)}</span><span class="detalhe">X:${a.contagem.x12_01} | 10:${a.contagem.x10} | 9:${a.contagem.x9}</span></div>`;}document.getElementById('lista').innerHTML=html||"<div class='placar'>AGUARDANDO</div>";}
let LISTA_ATLETAS=null;let CONTADOR_ATLETAS=JSON.parse(localStorage.getItem('contador_atletas')||'{}');
function atualizarInfoLista(){const el=document.getElementById('infoLista');if(!el) return;if(LISTA_ATLETAS&&LISTA_ATLETAS.length) el.innerHTML=`✅ ${LISTA_ATLETAS.length} atletas`;else el.innerHTML='';}
function atualizarInfoListaADM(){const el=document.getElementById('infoListaADM');const prev=document.getElementById('previewLista');if(!el) return;if(LISTA_ATLETAS&&LISTA_ATLETAS.length){el.innerHTML=`✅ ${LISTA_ATLETAS.length} atletas`;if(prev) prev.innerHTML=LISTA_ATLETAS.slice(0,80).join('<br>')+(LISTA_ATLETAS.length>80?`<br>... e mais ${LISTA_ATLETAS.length-80}`:'');}else{el.innerHTML='❌ Nenhuma lista';if(prev) prev.innerHTML='';}atualizarInfoLista();}
function obterProvaAuto(nome){nome=nome.toUpperCase().trim();let cont=CONTADOR_ATLETAS[nome]||0;if(cont===0) return "C";if(cont>=17) return "R17+";return "R"+cont;}
function iniciarListaAtletas(){let local=JSON.parse(localStorage.getItem('lista_atletas')||'null');if(local&&local.length>0){LISTA_ATLETAS=local;atualizarInfoLista();db.ref('LISTA_ATLETAS_GLOBAL').once('value',snap=>{if(snap.val()&&snap.val().length>0){let fb=snap.val();if(fb.length>LISTA_ATLETAS.length){LISTA_ATLETAS=fb;localStorage.setItem('lista_atletas',JSON.stringify(LISTA_ATLETAS));atualizarInfoLista();}}});}else{db.ref('LISTA_ATLETAS_GLOBAL').once('value',snap=>{if(snap.val()&&snap.val().length>0){LISTA_ATLETAS=snap.val();localStorage.setItem('lista_atletas',JSON.stringify(LISTA_ATLETAS));}else{LISTA_ATLETAS=LISTA_TESTE;localStorage.setItem('lista_atletas',JSON.stringify(LISTA_ATLETAS));}atualizarInfoLista();});}}
function iniciarListaAtletasADM(){let local=JSON.parse(localStorage.getItem('lista_atletas')||'null');if(local&&local.length>0) LISTA_ATLETAS=local;db.ref('LISTA_ATLETAS_GLOBAL').once('value',snap=>{if(snap.val()&&snap.val().length>0){LISTA_ATLETAS=snap.val();localStorage.setItem('lista_atletas',JSON.stringify(LISTA_ATLETAS));}if(!LISTA_ATLETAS) LISTA_ATLETAS=LISTA_TESTE;atualizarInfoListaADM();});}
function setupUpload(id){let el=document.getElementById(id);if(!el) return;el.addEventListener('change',function(e){const file=e.target.files[0];if(!file) return;const reader=new FileReader();reader.onload=function(ev){let lista=ev.target.result.split(/\r?\n/).map(l=>l.trim().toUpperCase()).filter(Boolean);lista=[...new Set(lista)];LISTA_ATLETAS=lista;localStorage.setItem('lista_atletas',JSON.stringify(LISTA_ATLETAS));db.ref('LISTA_ATLETAS_GLOBAL').set(LISTA_ATLETAS);atualizarInfoListaADM();atualizarInfoLista();alert(`✅ Salvo: ${LISTA_ATLETAS.length} nomes`);};reader.readAsText(file,'UTF-8');});}setupUpload('carregarListaADM');
const inputNome=document.getElementById('nome');const divSugestoes=document.getElementById('sugestoes');if(inputNome){inputNome.addEventListener('input',function(){const termo=this.value.toUpperCase().trim();divSugestoes.innerHTML='';if(termo.length<2||!LISTA_ATLETAS) return;const filtrados=LISTA_ATLETAS.filter(n=>n.includes(termo)).slice(0,12);filtrados.forEach(nome=>{const cont=CONTADOR_ATLETAS[nome]||0;let label=cont==0?'C':(cont>=17?`R17+ (${cont})`:`R${cont}`);let cor=cont==0?'#00FF00':(cont>=3?'#FF4444':'#FFD700');const d=document.createElement('div');d.style.cssText='padding:6px 8px;cursor:pointer;border-bottom:1px solid #444;font-size:12px;color:#fff;display:flex;justify-content:space-between;';d.innerHTML=`<span>${nome}</span><span style="color:${cor};font-weight:bold">[${label}]</span>`;d.onclick=()=>{inputNome.value=nome;divSugestoes.innerHTML='';document.getElementById('prova').value=obterProvaAuto(nome);document.getElementById('t1').focus();};divSugestoes.appendChild(d);});});inputNome.addEventListener('blur',function(){setTimeout(()=>{let nome=this.value.toUpperCase().trim();if(nome.length>2&&!document.getElementById('prova').value){document.getElementById('prova').value=obterProvaAuto(nome);}},200);});document.addEventListener('click',(e)=>{if(!divSugestoes.contains(e.target)&&e.target!==inputNome) divSugestoes.innerHTML='';});}
function lancar(){let nomeEl=document.getElementById('nome');let provaEl=document.getElementById('prova');let nome=nomeEl.value.toUpperCase().trim();if(!nome) return alert("Preencha Nome");if(!provaEl.value.trim()) provaEl.value=obterProvaAuto(nome);let prova=provaEl.value.toUpperCase().trim();if(!prova) return alert("Preencha Prova");if(!validarTiros()) return;CONTADOR_ATLETAS[nome]=(CONTADOR_ATLETAS[nome]||0)+1;localStorage.setItem('contador_atletas',JSON.stringify(CONTADOR_ATLETAS));lancarBase();}
</script></body></html>
