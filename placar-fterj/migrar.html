<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MIGRAR - FTERJ</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>body{background:#111;color:#fff;font-family:Arial;padding:15px}#log{background:#222;padding:15px;border-radius:8px;white-space:pre-wrap;font-size:13px;min-height:300px;border:1px solid #FF8C00}button{padding:12px 20px;background:#4CAF50;color:#fff;border:none;border-radius:8px;font-weight:bold;margin:5px;cursor:pointer}</style>
</head><body>
<h2 style="color:#FFD700">🔄 MIGRADOR DE ANÚNCIOS ANTIGOS - FTERJ</h2>
<div id="log">Iniciando busca...\n</div>
<br>
<button onclick="location.reload()" style="background:#2196F3">🔄 TENTAR DE NOVO</button>
<button id="btnMigrar" onclick="migrar()" style="display:none;background:#FF8C00">📦 MIGRAR PARA O NOVO</button>

<script>
const NOME_BANCO="FTERJ";
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera",storageBucket:"placar-minutera.firebasestorage.app",messagingSenderId:"689991648080",appId:"1:689991648080:web:9deeb958183eae23e255"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const logEl=document.getElementById('log');
function log(t){ logEl.innerHTML+=t+"\n"; console.log(t); }

let dadosAntigos=null;
let chaveAntiga="";

log("Conectando no banco placar-minutera...\n");

db.ref().once('value').then(s=>{
  log("=== CHAVES ENCONTRADAS NO FIREBASE ===");
  let todas=[];
  s.forEach(c=>{ todas.push(c.key); });
  log(todas.join(", ")+"\n");

  let possiveis=[
    "PATROCINADORES_RODAPE_FTERJ",
    "PATROCINADORES_FULL_FTERJ",
    "CONFIG_ANUNCIOS_FTERJ",
    "ANUNCIOS_FTERJ",
    "ANUNCIOS",
    "RODAPE_FTERJ",
    "FTERJ_ANUNCIOS",
    "FTERJ"
  ];

  log("=== VERIFICANDO ANUNCIOS ANTIGOS ===");
  let promises=possiveis.map(chave=>{
    return db.ref(chave).once('value').then(snap=>{
      let v=snap.val();
      if(v){
        log("\n✅ ACHOU DADOS EM: "+chave);
        log(JSON.stringify(v).substring(0,800));
        if(!dadosAntigos && (Array.isArray(v) || v.rodapes || v.length>0)){
          dadosAntigos=v;
          chaveAntiga=chave;
          document.getElementById('btnMigrar').style.display='inline-block';
        }
      }
    });
  });

  Promise.all(promises).then(()=>{
    log("\n--- LocalStorage deste navegador ---");
    let achouLS=false;
    for(let i=0;i<localStorage.length;i++){
      let k=localStorage.key(i);
      if(k.toUpperCase().includes("RODAPE")||k.toUpperCase().includes("ANUNCIO")||k.toUpperCase().includes("PATROC")){
        log(k+" => "+localStorage.getItem(k).substring(0,400));
        achouLS=true;
      }
    }
    if(!achouLS) log("Nenhum dado no localStorage");
    if(!dadosAntigos) log("\n❌ Nenhum anúncio antigo encontrado. Pode criar novos no anuncios.html V17 que já salva certo.");
  });

}).catch(e=>{
  log("ERRO: "+e.message);
});

function migrar(){
  if(!dadosAntigos) return;
  let rodapes=dadosAntigos.rodapes || dadosAntigos;
  if(!Array.isArray(rodapes)) rodapes=[rodapes];
  db.ref("PATROCINADORES_RODAPE_FTERJ").set(rodapes).then(()=>{
    log("\n✅ MIGRADO COM SUCESSO de "+chaveAntiga+" para PATROCINADORES_RODAPE_FTERJ");
    alert("MIGRADO! Agora abre a tv.html que vai aparecer.");
  });
}
</script></body></html>
