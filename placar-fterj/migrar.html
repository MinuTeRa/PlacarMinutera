<!DOCTYPE html><html><head><meta charset="UTF-8"><title>MIGRAR FINAL</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>body{background:#111;color:#fff;font-family:Arial;padding:15px}#log{background:#222;padding:12px;border-radius:8px;white-space:pre-wrap}button{padding:12px 20px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px}</style>
</head><body>
<h2 style="color:#FFD700">🔄 MIGRADOR GLOBAL -> FTERJ</h2>
<div id="log">Buscando anúncios em CONFIG_RODAPE_GLOBAL e CONFIG_FULL_GLOBAL...</div><br>
<button onclick="fazerMigracao()" style="background:#4CAF50;color:#fff;display:none" id="btn">✅ MIGRAR AGORA PARA FTERJ</button>
<button onclick="location.reload()" style="background:#2196F3;color:#fff">🔄 ATUALIZAR</button>
<script>
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera",storageBucket:"placar-minutera.firebasestorage.app",messagingSenderId:"689991648080",appId:"1:689991648080:web:9deeb958183eae23e255"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const logEl=document.getElementById('log');function log(t){logEl.innerHTML+=t+"\n"}
let rodapesGlobal=null, fullGlobal=null, configAnuncios=null;

db.ref("CONFIG_RODAPE_GLOBAL").once('value').then(s=>{
  if(s.val()){ rodapesGlobal=s.val(); log("✅ ACHOU RODAPES GLOBAL: "+JSON.stringify(rodapesGlobal).substring(0,1000)); document.getElementById('btn').style.display='inline-block'; }
  else log("❌ CONFIG_RODAPE_GLOBAL vazio");
});
db.ref("CONFIG_FULL_GLOBAL").once('value').then(s=>{
  if(s.val()){ fullGlobal=s.val(); log("\n✅ ACHOU FULL GLOBAL: "+JSON.stringify(fullGlobal).substring(0,1000)); document.getElementById('btn').style.display='inline-block'; }
  else log("\n❌ CONFIG_FULL_GLOBAL vazio");
});
db.ref("CONFIG_ANUNCIOS").once('value').then(s=>{
  if(s.val()){ configAnuncios=s.val(); log("\n✅ ACHOU CONFIG_ANUNCIOS: "+JSON.stringify(configAnuncios).substring(0,800)); }
});

function fazerMigracao(){
  if(rodapesGlobal){
    db.ref("PATROCINADORES_RODAPE_FTERJ").set(rodapesGlobal).then(()=>log("\n✅ Rodapés migrados para PATROCINADORES_RODAPE_FTERJ"));
    // Também salva no global pra compatibilidade
    db.ref("CONFIG_RODAPE_GLOBAL").set(rodapesGlobal);
  }
  if(fullGlobal){
    db.ref("PATROCINADORES_FULL_FTERJ").set(fullGlobal).then(()=>log("\n✅ Full migrado para PATROCINADORES_FULL_FTERJ"));
  }
  if(configAnuncios){
    db.ref("CONFIG_ANUNCIOS_FTERJ").set(configAnuncios).then(()=>log("\n✅ Config migrada para CONFIG_ANUNCIOS_FTERJ"));
  }
  setTimeout(()=>{ log("\n🎉 PRONTO! Agora abre minutera.com.br/placar-fterj/tv.html e anuncios.html"); alert("MIGRADO!"); },1500);
}
</script></body></html>
