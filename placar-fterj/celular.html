<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinuT&Ra Mobile</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
 body{background:#000;color:#fff;font-family:Arial Black;margin:0}
 .topo{background:#FF8C00;color:#000;padding:12px;text-align:center;font-size:5vw;position:sticky;top:0;z-index:10}
 .atleta{display:flex;justify-content:space-between;padding:11px 8px;border-bottom:1px solid #222;font-size:4.1vw}
 .atleta.p1{background:gold;color:#000}
 .atleta.p2{background:silver;color:#000}
 .atleta.p3{background:#CD7F32;color:#000}
</style>
</head>
<body>
<div class="topo" id="topo">GERAL</div>
<div id="lista">Carregando...</div>

<script>
const BANCO = "FTERJ";
firebase.initializeApp({databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com"});
const db = firebase.database();
const provaFiltro = new URLSearchParams(window.location.search).get('prova');

db.ref(BANCO).on('value', snap=>{
  let lista=[];
  snap.forEach(c=>{ let v=c.val(); if(v && v.contagem) lista.push(v); });
  lista.sort((a,b)=> b.pontos - a.pontos || b.contagem.x12_01 - a.contagem.x12_01);

  if(provaFiltro) lista = lista.filter(a=>a.prova.toString() == provaFiltro);

  // REGRA DA TV - 1 ATLETA SÓ 1 VEZ, VAI DESCENDO
  let rankingUnico = [];
  let nomesVistos = new Set();
  for(let atirador of lista){
    let nomeNorm = atirador.nome.trim().toUpperCase();
    if(!nomesVistos.has(nomeNorm)){
      rankingUnico.push(atirador);
      nomesVistos.add(nomeNorm);
    }
  }

  document.getElementById('topo').innerText = provaFiltro ? `PROVA ${provaFiltro} - ${rankingUnico.length} ATIRADORES` : `GERAL - ${rankingUnico.length} ATIRADORES`;

  let html="";
  rankingUnico.forEach((a,i)=>{
    let classe = i==0?'p1':i==1?'p2':i==2?'p3':'';
    html+=`<div class="atleta ${classe}"><span>${i+1}º ${a.nome} (P:${a.prova})</span><span>${a.pontos.toFixed(2)} | X:${a.contagem.x12_01}</span></div>`;
  });
  document.getElementById('lista').innerHTML = html || "Nenhum atirador";
});
</script>
</body>
</html>
