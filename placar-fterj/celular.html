<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CELULAR - FINAL</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial Black,Arial;height:100vh;overflow:hidden}
.header{height:56px;background:#000;border-bottom:4px solid #FF8C00;display:flex;align-items:center;padding:0 12px;gap:10px}
.header img{height:28px}
.header span{font-size:14px;text-transform:uppercase;white-space:nowrap;font-weight:900}
.header.sep{width:2px;height:22px;background:#333}
.placar{height:calc(100vh - 56px);overflow:auto;padding:6px}
.linha{display:flex;align-items:center;justify-content:space-between;background:#111;border:2px solid #222;border-left:6px solid #333;padding:12px;margin-bottom:6px;border-radius:4px}
.linha.pos1{border-color:#FFD700;background:#1a1500}.pos1.pos{color:#FFD700}
.linha.pos4,.linha.pos5{border-left-color:#FF8C00}
.pos{font-size:26px;min-width:44px;color:#333;text-align:center}
.pts{font-size:24px;color:#fff;font-weight:900}
#full{position:fixed;inset:0;background:#000;z-index:999;display:none;justify-content:center;align-items:center}
#full img{width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>

<script>
// ============= EDITA AQUI =============
const TEXTO_MINUTERA_FIXO = "MinuT&Ra"; // fixo
// ======================================
</script>

<div class="header">
  <img id="logoMinu" src="" style="display:none">
  <span id="txtMinu">MinuT&Ra</span>
  <div class="sep"></div>
  <img id="logoClube" src="" style="display:none">
  <span id="txtClube" style="color:#fff">FTERJ</span>
  <div style="margin-left:auto;color:#FF8C00;font-size:9px;font-family:Arial">PLACAR AO VIVO</div>
</div>

<div class="placar" id="lista">CARREGANDO...</div>
<div id="full" onclick="this.style.display='none'"><img id="fullImg"></div>

<script>
document.getElementById('txtMinu').innerText = TEXTO_MINUTERA_FIXO;

const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let fulls=[],fIdx=0,tempoFull=10,intervaloFull=20;

db.ref("CONFIG_ANUNCIOS_FTERJ").on('value',s=>{
  let c=s.val()||{}; tempoFull=c.tempoFull||10; intervaloFull=c.intervaloFull||20;
  if(c.logoClube){logoClube.src=c.logoClube;logoClube.style.display='block';}
  if(c.logoMinu){logoMinu.src=c.logoMinu;logoMinu.style.display='block';}
  // NOME DO CLUBE VEM DO BANCO COMO ANTES
  let raw=c.nomeClube||c.clube||c.banco||c.nomeBanco||"FTERJ";
  if(raw){
    let nome=String(raw).split(" - ").pop().split("-").pop().split("_").pop().trim().toUpperCase();
    // tira a palavra CLUBE se vier junto
    nome=nome.replace("CLUBE","").trim();
    if(nome) document.getElementById('txtClube').innerText=nome;
  }
});

db.ref("FTERJ").on('value',s=>{render(s.val()||{});});
db.ref("PATROCINADORES_FULL_FTERJ").on('value',s=>{fulls=Object.values(s.val()||{}).filter(x=>x.ativo!==false);});

function fmt(p){return (Math.round((parseFloat(p)||0)*100)/100).toFixed(2)}
function render(dados){
  let ks=Object.keys(dados).filter(k=>k.startsWith("serie_"));
  ks.sort((a,b)=>(parseFloat(dados[b].pontos)||0)-(parseFloat(dados[a].pontos)||0));
  let top5=[], usadosNome=new Set(), usadosKey=new Set();
  for(let k of ks){
    if(top5.length>=5) break;
    let nk=(dados[k].nome||'').trim().toUpperCase();
    if(!nk) continue;
    if(!usadosNome.has(nk)){usadosNome.add(nk);usadosKey.add(k);top5.push(k);}
  }
  let resto=ks.filter(k=>!usadosKey.has(k));
  let lista=[...top5,...resto];
  let h="";
  lista.forEach((k,i)=>{
    let at=dados[k]; if(!at.nome) return;
    let pts=fmt(at.pontos); let tiros=(at.tiros||[]).join('/').toUpperCase();
    let cls=i==0?'pos1':i==1?'pos2':i==2?'pos3':i==3?'pos4':i==4?'pos5':'';
    h+=`<div class="linha ${cls}"><div class="pos ${cls}">${i+1}º</div><div style="flex:1;overflow:hidden"><b style="font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${at.nome}</b><div style="font-size:10px;color:#888;font-family:Arial">${at.prova||''} • ${tiros}</div></div><div class="pts">${pts} <small style="font-size:10px">pts</small></div></div>`;
  });
  document.getElementById('lista').innerHTML=h;
}
function loopFull(){
  if(fulls.length==0){setTimeout(loopFull,intervaloFull*1000);return;}
  if(fIdx>=fulls.length){fIdx=0;setTimeout(loopFull,intervaloFull*1000);return;}
  fullImg.src=fulls[fIdx].arte; full.style.display='flex';
  setTimeout(()=>{full.style.display='none';fIdx++;loopFull();},tempoFull*1000);
}
setTimeout(loopFull,5000);
</script>
</body>
</html>
