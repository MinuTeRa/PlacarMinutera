<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>body{background:#000;color:#fff;font-family:Arial;padding:10px}#full{position:fixed;top:0;left:0;width:100%;height:100%;background:red;z-index:9999;display:none;justify-content:center;align-items:center}#full img{width:100%;height:100%;object-fit:contain}</style>
</head><body>
<div id="debug">Procurando anúncios...</div>
<div id="full"><img id="imgFull"></div>
<script>
firebase.initializeApp({databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com"});
const db=firebase.database();
const debug = document.getElementById('debug');

function testa(caminho){
  db.ref(caminho).once('value', s=>{
    debug.innerHTML += `<br>Testando ${caminho}: ${s.numChildren()} encontrados`;
    s.forEach(c=>{
      let v=c.val();
      debug.innerHTML += `<br> - ${caminho} -> ${JSON.stringify(v).substring(0,100)}`;
      // se achar qualquer imagem, já mostra
      if(v.imagem || v.url){
        let img = v.imagem || v.url;
        document.getElementById('imgFull').src = img;
        document.getElementById('full').style.display='flex';
        setTimeout(()=>{document.getElementById('full').style.display='none'},7000);
      }
    });
  });
}

testa("FTERJ_TELA_CHEIA");
testa("FTERJ/TELA_CHEIA");
testa("FTERJ_CONFIG");
testa("FTERJ_ANUNCIOS");
testa("ANUNCIOS_TELA_CHEIA");
testa("FTERJ");
</script></body></html>
