<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CELULAR FINAL</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial Black,Arial;height:100vh;overflow:hidden}
.header{height:56px;background:#0a0a0a;border-bottom:3px solid #FF8C00;display:flex;align-items:center;padding:0 10px;gap:8px}
.header img{height:28px}.header b{font-size:9px;color:#FFD700;display:block;font-family:Arial}.header span{font-size:13px;text-transform:uppercase}
.placar{height:calc(100vh - 56px);overflow:auto;padding:6px}
.row{display:flex;justify-content:space-between;align-items:center;background:#111;border-left:6px solid #333;padding:12px;margin-bottom:6px;border-radius:6px}
.row.top1{border-color:#FFD700;background:#1a1500}.row.top2{border-left-color:#C0C0C0}.row.top3{border-left-color:#CD7F32}.row.top4,.row.top5{border-left-color:#FF8C00}
.pos{font-size:24px;min-width:40px;color:#555}.top1.pos{color:#FFD700}.pts{color:#fff;font-size:22px;font-weight:900}.pts small{font-size:10px}
.det{font-size:10px;color:#888;font-family:Arial;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#full{position:fixed;inset:0;background:#000;z-index:999;display:none;justify-content:center;align-items:center}
#full img{width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div class="header">
  <img id="logoMinu" src="" style="display:none">
  <div><b>MinuT&Ra</b><span id="marcaMinu">MinuT&Ra</span></div>
  <div style="width:2px;height:20px;background:#333;margin:0 6px"></div>
  <img id="logoClube" src="" style="display:none">
  <div><b id="labelClube">CLUBE</b><span id="nomeClube">CARREGANDO...</span></div>
</div>
<div class="placar" id="lista"></div>
<div id="full" onclick="this.style.display='none'"><img id="fullImg"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let fulls=[],fIdx=0;

db.ref("CONFIG_ANUNCIOS_FTERJ").on('value',s=>{
  let c=s.val()||{};
  if(c.logoClube){logoClube.src=c.logoClube;logoClube.style.display='block';}
  if(c.logoMinu){logoMinu.src=c.logoMinu;logoMinu.style.display='block';}
  // AQUI PEGA O NOME DO CLUBE JUNTO DO BANCO
  let raw = c.nomeClube || c.clube || c.banco || c.nomeBanco || "FTERJ";
  let nome = String(raw).split(" - ").pop().split("-").pop().split("_").pop().trim().toUpperCase();
  if(nome) document.getElementById('nomeClube').innerText = nome;
});
db.ref("FTERJ").on('value',s=>{render(s.val()||{});});
db.ref("PATROCINADORES_FULL_FTERJ").on('value',s=>{fulls=Object.values(s.val()||{}).filter(x=>x.ativo!==false);});

function render(dados){
  let ks=Object.keys(dados).filter(k=>k.startsWith("serie_"));
  let mapa={};
  ks.forEach(k=>{
    let at=dados[k]; if(!at.nome) return;
    let key=at.nome.trim().toUpperCase();
    let pts=parseFloat(at.pontos)||0;
    if(!mapa[key] || pts > mapa[key].pts) mapa[key]={at:at,pts:pts};
  });
  let final=Object.values(mapa).sort((a,b)=>b.pts-a.pts);
  let html="";
  final.forEach((item,i)=>{
    let at=item.at; let pts=(Math.round(item.pts*100)/100).toFixed(2);
    let tiros=(at.tiros||[]).join('/').toUpperCase();
    let topClass=i==0?'top1':i==1?'top2':i==2?'top3':i==3?'top4':i==4?'top5':'';
    html+=`<div class="row ${topClass}"><div class="pos">${i+1}º</div><div style="flex:1;overflow:hidden"><b style="font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${at.nome}</b><div class="det">${at.prova||''} • ${tiros}</div></div><div class="pts">${pts} <small>pts</small></div></div>`;
  });
  document.getElementById('lista').innerHTML=html||"AGUARDANDO...";
}
function loopFull(){
  if(fulls.length==0){setTimeout(loopFull,20000);return;}
  if(fIdx>=fulls.length){fIdx=0;setTimeout(loopFull,20000);return;}
  fullImg.src=fulls[fIdx].arte; full.style.display='flex';
  setTimeout(()=>{full.style.display='none';fIdx++;loopFull();},10000);
}
setTimeout(loopFull,4000);
</script>
</body>
</html>
