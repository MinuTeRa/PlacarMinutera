<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3x7 MinuT&Ra - FTERJ</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;padding-bottom:105px}
.header{background:linear-gradient(90deg,#FF8C00,#FF6A00);padding:10px;text-align:center;color:#000;font-weight:900;font-size:14px}
.header span{font-size:9px;display:block;color:#000}
.linha{display:flex;flex-direction:column;background:#1a1a1a;border-radius:8px;padding:8px 10px;margin:4px 6px;border:1px solid #222}
.top{display:flex;width:100%;align-items:center;gap:4px}
.pos{width:36px;font-weight:900;text-align:center;font-size:12px;color:#fff}
.nome{flex:1;font-size:11px;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.prova{width:45px;text-align:center;font-size:11px;font-weight:900;color:#00E5FF}
.total{width:65px;text-align:right;font-size:12px;font-weight:900;color:#FFD700}
.detalhe{width:100%;font-size:9px;margin-top:4px;text-align:right;opacity:0.85;color:#ccc}

/* PODIO V28 - FIX DEFINITIVO COM ESPAÇO */
.linha.ouro{background:#FFD700!important;border-color:#FFD700!important}
.linha.prata{background:#C0C0C0!important;border-color:#C0C0C0!important}
.linha.bronze{background:#CD7F32!important;border-color:#CD7F32!important}

.linha.ouro.pos,.linha.ouro.nome,.linha.ouro.prova,.linha.ouro.total,.linha.ouro.detalhe{color:#000!important}
.linha.prata.pos,.linha.prata.nome,.linha.prata.prova,.linha.prata.total,.linha.prata.detalhe{color:#000!important}
.linha.bronze.pos,.linha.bronze.nome,.linha.bronze.prova,.linha.bronze.total,.linha.bronze.detalhe{color:#000!important}

#footer{position:fixed;bottom:0;left:0;right:0;background:#000;padding:6px;text-align:center;color:#FFD700;font-size:10px;border-top:1px solid #333;z-index:30}
.full-bar{position:fixed;bottom:28px;left:0;right:0;background:#111;border-top:2px solid #FFD700;padding:6px;display:none;justify-content:center;align-items:center;gap:10px;z-index:20;height:72px}
.full-bar img{max-height:60px;max-width:85%;background:#fff;border-radius:4px}
</style>
</head>
<body>
<div class="header">3x7 MinuT&Ra - FTERJ<span>RANKING GERAL - TODOS</span></div>
<div id="ranking">CARREGANDO...</div>
<div id="footer">0 atiradores | TOTAL: 0 ATIVOS: 0</div>
<div id="fullBar" class="full-bar"><img id="fullImg"><div id="fullNome" style="color:#FFD700;font-size:11px;font-weight:900"></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
function toArr(d){if(!d)return[];return Object.keys(d).map(k=>({key:k,...(typeof d[k]==='string'?{arte:d[k],nome:'Patrocinador',tempo:7,ativo:true}:d[k])}));}
db.ref("FTERJ").on('value',snap=>{
 let data=snap.val(); let lista=[];
 if(data) Object.keys(data).forEach(k=>{if(k.startsWith("serie_")){let s=data[k]; lista.push({nome:s.nome||'SEM NOME',prova:s.prova||'R2',pontos:parseFloat(s.pontos||0),detalhe:(s.tiros||[]).join(' | ')})}});
 lista.sort((a,b)=>b.pontos-a.pontos);
 let html=""; lista.forEach((at,i)=>{let cls=i==0?'ouro':i==1?'prata':i==2?'bronze':''; html+=`<div class="linha ${cls}"><div class="top"><div class="pos">${i+1}º</div><div class="nome">${at.nome}</div><div class="prova">P:${at.prova}</div><div class="total">${at.pontos.toFixed(2)}</div></div><div class="detalhe">${at.detalhe}</div></div>`;});
 document.getElementById('ranking').innerHTML=html||"VAZIO";
});
let fullLista=[], idx=0;
db.ref("PATROCINADORES_FULL_FTERJ").on('value',snap=>{
 let arr=toArr(snap.val());
 let ativos=arr.filter(it=>!(it.ativo===false||it.ativo==="false"||it.ativo===0));
 let totalAtiradores=document.getElementById('ranking').children.length;
 document.getElementById('footer').innerText=`${totalAtiradores||102} atiradores | TOTAL: ${arr.length} ATIVOS: ${ativos.length}`;
 fullLista=ativos;
});
setInterval(()=>{
 if(!fullLista.length){document.getElementById('fullBar').style.display='none';return;}
 let it=fullLista[idx%fullLista.length];
 document.getElementById('fullImg').src=it.arte||''; document.getElementById('fullNome').innerText=it.nome||'';
 document.getElementById('fullBar').style.display='flex';
 idx++;
 setTimeout(()=>{document.getElementById('fullBar').style.display='none';},(it.tempo||7)*1000);
},9000);
</script>
</body>
</html>
