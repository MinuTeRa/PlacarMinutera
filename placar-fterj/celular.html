<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinuT&Ra Mobile</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
 body{background:#000;color:#fff;font-family:Arial Black;margin:0}
 .topo{background:orange;color:#000;padding:10px;text-align:center;position:sticky;top:0;z-index:10}
 .top5{background:#111;border:2px solid gold;margin:5px;border-radius:10px;overflow:hidden}
 .top5-titulo{background:gold;color:#000;text-align:center;padding:5px;font-size:4vw}
 .atleta{display:flex;justify-content:space-between;padding:10px 8px;border-bottom:1px solid #222;font-size:4vw}
 .atleta.p1{background:gold;color:#000}
 .atleta.p2{background:silver;color:#000}
 .atleta.p3{background:#CD7F32;color:#000}
</style>
</head>
<body>
<div class="topo" id="topo">CARREGANDO...</div>

<div class="top5">
  <div class="top5-titulo">TOP 5</div>
  <div id="top5-lista"></div>
</div>

<div id="lista"></div>

<script>
const BANCO = "FTERJ";
firebase.initializeApp({databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com"});
const db = firebase.database();
const prova = new URLSearchParams(window.location.search).get('prova');

db.ref(BANCO).on('value', snap=>{
  let lista=[];
  snap.forEach(c=>{ let v=c.val(); if(v && v.contagem) lista.push(v); });
  lista.sort((a,b)=>b.pontos-a.pontos || b.contagem.x12_01-a.contagem.x12_01);
  
  if(prova) lista = lista.filter(a=>a.prova.toString() == prova);

  document.getElementById('topo').innerText = prova ? `PROVA ${prova} - ${lista.length} ATIRADORES` : `GERAL - ${lista.length} ATIRADORES`;

  // TOP 5 COM NOMES REPETIDOS - desce normal
  let top5 = lista.slice(0,5);
  let htmlTop5="";
  top5.forEach((a,i)=>{
    let c = i==0?'p1':i==1?'p2':i==2?'p3':'';
    htmlTop5+=`<div class="atleta ${c}"><span>${i+1}º ${a.nome}</span><span>${a.pontos.toFixed(2)}</span></div>`;
  });
  document.getElementById('top5-lista').innerHTML = htmlTop5 || "Sem dados";

  // TODOS COM ROLAGEM - com nomes repetidos também
  let htmlTodos="";
  lista.forEach((a,i)=>{
    let c = i<3 ? (i==0?'p1':i==1?'p2':'p3') : '';
    htmlTodos+=`<div class="atleta ${c}"><span>${i+1}º ${a.nome} (P:${a.prova})</span><span>${a.pontos.toFixed(2)} | X:${a.contagem.x12_01}</span></div>`;
  });
  document.getElementById('lista').innerHTML = htmlTodos;
});
</script>
</body>
</html>
