<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera",storageBucket:"placar-minutera.firebasestorage.app",messagingSenderId:"689991648080",appId:"1:689991648080:web:9deeb958183eae23e255"};firebase.initializeApp(firebaseConfig);const db=firebase.database();const storage=firebase.storage();
let ranking=[];let historico=[];let editandoId=null;let senhaOk=false;
function montarTopo(id){let e='<div class="logos-lado">',d='<div class="logos-lado">';if(QTD_LOGOS>=1) e+=`<img src="${LOGOS[0]}">`;if(QTD_LOGOS>=2) d+=`<img src="${LOGOS[1]}">`;e+='</div>';d+='</div>';let el=document.getElementById(id);if(el){el.innerHTML=`${e}<h1>${NOME_CAMPEONATO}</h1>${d}${id==='topo-tv'?'<div class="relogio" id="relogio-tv"></div>':''}`;}}montarTopo('topo-tv');montarTopo('topo-operador');
const urlParams=new URLSearchParams(window.location.search);const modo=(urlParams.get('modo')||'').toLowerCase();
if(modo==='tv'){document.documentElement.classList.add('modo-tv');document.body.classList.add('modo-tv');}
else if(modo==='anuncios'||modo==='adm'){document.documentElement.classList.add('modo-adm-scroll');document.body.classList.add('modo-adm-scroll');}
let indiceRodape=0;function rotacionarRodape(){const r=document.getElementById('rodape-conteudo');if(!r||!PATROCINADORES_RODAPE.length) return;r.style.opacity=0;setTimeout(()=>{let p=PATROCINADORES_RODAPE[indiceRodape];if(p){r.innerHTML=`<div class="rodape-prop">${p.prop}</div><div class="rodape-contato">${p.contato}</div>`;aplicarFontesRodape();}r.style.opacity=1;indiceRodape=(indiceRodape+1)%PATROCINADORES_RODAPE.length;},300);}
function aplicarFontesRodape(){document.documentElement.style.setProperty('--fonte-prop',RODAPE_FONTE_PROP+'px');document.documentElement.style.setProperty('--fonte-cont',RODAPE_FONTE_CONTATO+'px');document.querySelectorAll('.rodape-prop').forEach(e=>{e.style.setProperty('font-size',RODAPE_FONTE_PROP+'px','important');e.style.setProperty('color','#000','important');});document.querySelectorAll('.rodape-contato').forEach(e=>e.style.setProperty('font-size',RODAPE_FONTE_CONTATO+'px','important'));}
function renderTelaCriarSenha(){document.getElementById('tituloSenha').innerText='🔑 PRIMEIRO ACESSO';document.getElementById('areaSenha').innerHTML=`<input type="password" id="novaSenha" placeholder="CRIAR SENHA" style="padding:12px;background:#222;color:#fff"><br><input type="password" id="confirmaSenha" placeholder="CONFIRMAR" style="padding:12px;background:#222;color:#fff;margin-top:8px"><br><button onclick="salvarSenhaFirebase()" style="margin-top:12px;background:#FFD700;color:#000;padding:12px 30px">SALVAR</button>`;}
function renderTelaLogin(){document.getElementById('tituloSenha').innerText='🔒 ACESSO RESTRITO';document.getElementById('areaSenha').innerHTML=`<input type="password" id="inputSenha" placeholder="SENHA" style="padding:12px;background:#222;color:#fff"><br><button onclick="verificarSenha()" style="margin-top:12px;background:#FF8C00;color:#000;padding:10px 25px">ENTRAR</button>`;}
function salvarSenhaFirebase(){let s1=document.getElementById('novaSenha').value.trim();let s2=document.getElementById('confirmaSenha').value.trim();if(s1!==s2){document.getElementById('erroSenha').innerText='Não conferem';return;}db.ref(CHAVE_SENHA_FIREBASE).set(s1).then(()=>{SENHA_MESTRA=s1;renderTelaLogin();});}
function verificarSenha(){let d=document.getElementById('inputSenha').value;if(d===SENHA_MESTRA){senhaOk=true;document.getElementById('tela-senha').style.display='none';if(window.modoADMpendente){document.getElementById('tela-adm').style.display='block';montarLinksADM();}else if(modo==='anuncios'){document.getElementById('tela-anuncios').style.display='block';carregarAnunciosTela();}else{document.getElementById('tela-lancamento').style.display='block';montarTabela();}iniciarFirebase();}else{document.getElementById('erroSenha').innerText='INCORRETA';}}
function checarSenhaFirebase(){let el=document.getElementById('labelBanco'); if(el) el.innerText=NOME_BANCO;if(modo==='tv'||modo==='celular'){document.getElementById('tela-senha').style.display='none';document.getElementById('tela-placar').style.display='block';rotacionarRodape();setInterval(rotacionarRodape,RODAPE_TEMPO_EXIBICAO_SEG*1000);iniciarFirebase();return;}db.ref(CHAVE_SENHA_FIREBASE).once('value',snap=>{if(snap.val()){SENHA_MESTRA=snap.val();if(modo==='adm') window.modoADMpendente=true;renderTelaLogin();}else{renderTelaCriarSenha();}});}
checarSenhaFirebase();
let listaRodapeTemp=[];let listaFullTemp=[];
function carregarAnunciosTela(){db.ref(CHAVE_TEMPOS).once('value',s=>{if(s.val()){let t=s.val();document.getElementById('segRodape').value=t.segRodape||5;document.getElementById('esperaFull').value=t.esperaFull||60;document.getElementById('escalaFull').value=t.escalaFull||1;document.getElementById('valEscala').innerText=Math.round((t.escalaFull||1)*100)+'%';document.getElementById('fonteProp').value=t.fonteProp||52;document.getElementById('fonteCont').value=t.fonteCont||36;RODAPE_FONTE_PROP=t.fonteProp||52;RODAPE_FONTE_CONTATO=t.fonteCont||36;}});db.ref(CHAVE_RODAPE).once('value',s=>{listaRodapeTemp=s.val()||[];renderRodapes();});db.ref(CHAVE_FULL).once('value',s=>{listaFullTemp=s.val()||[];renderFulls();});}
function renderRodapes(){let c=document.getElementById('containerRodapes');c.innerHTML='';listaRodapeTemp.forEach((d,i)=>{c.innerHTML+=`<div class="box-anuncio"><b>#${i+1}</b><input type="text" id="rod_prop_${i}" value="${d.prop||''}"><input type="text" id="rod_cont_${i}" value="${d.contato||''}"><button class="btn-mini btn-excluir" onclick="listaRodapeTemp.splice(${i},1);renderRodapes();">X</button></div>`;});}
function adicionarRodape(){listaRodapeTemp.push({prop:'',contato:''});renderRodapes();}
function salvarRodapes(){let lista=[];listaRodapeTemp.forEach((_,i)=>{let p=document.getElementById('rod_prop_'+i)?.value||'';let co=document.getElementById('rod_cont_'+i)?.value||'';if(p||co) lista.push({prop:p,contato:co});});db.ref(CHAVE_RODAPE).set(lista).then(()=>{document.getElementById('statusAnuncioSave').innerText='✅ Rodapés';});}
function renderFulls(){let c=document.getElementById('containerFull');c.innerHTML='';listaFullTemp.forEach((d,i)=>{c.innerHTML+=`<div class="box-anuncio"><b>#${i+1}</b><input type="text" id="full_prop_${i}" value="${d.prop||''}"><input type="file" onchange="uploadArte(${i},this)"><img id="full_prev_${i}" class="preview-arte" src="${d.arte||''}"><input type="hidden" id="full_arte_${i}" value="${d.arte||''}"><input type="number" class="tempo" id="full_tempo_${i}" value="${d.tempo||7}"><button class="btn-mini btn-excluir" onclick="listaFullTemp.splice(${i},1);renderFulls();">X</button></div>`;});}
function adicionarFull(){listaFullTemp.push({prop:'',arte:'',tempo:7});renderFulls();}
function salvarFulls(){let lista=[];listaFullTemp.forEach((_,i)=>{let p=document.getElementById('full_prop_'+i)?.value||'';let a=document.getElementById('full_arte_'+i)?.value||'';let t=parseInt(document.getElementById('full_tempo_'+i)?.value)||7;if(p||a) lista.push({prop:p,arte:a,tempo:t});});db.ref(CHAVE_FULL).set(lista).then(()=>{document.getElementById('statusAnuncioSave').innerText='✅ Full';});}
async function uploadArte(idx,input){let file=input.files[0];if(!file) return;let ref=storage.ref(`anuncios/global/${Date.now()}_${file.name}`);let snap=await ref.put(file);let url=await snap.ref.getDownloadURL();document.getElementById('full_arte_'+idx).value=url;document.getElementById('full_prev_'+idx).src=url;listaFullTemp[idx].arte=url;}
function salvarTempos(){let tempos={segRodape:parseInt(document.getElementById('segRodape').value)||5,esperaFull:parseInt(document.getElementById('esperaFull').value)||60,escalaFull:parseFloat(document.getElementById('escalaFull').value)||1,fonteProp:parseInt(document.getElementById('fonteProp').value)||52,fonteCont:parseInt(document.getElementById('fonteCont').value)||36};db.ref(CHAVE_TEMPOS).set(tempos).then(()=>{document.getElementById('statusAnuncioSave').innerText='✅ PROP '+tempos.fonteProp+'px CONT '+tempos.fonteCont+'px';RODAPE_FONTE_PROP=tempos.fonteProp;RODAPE_FONTE_CONTATO=tempos.fonteCont;aplicarFontesRodape();});}
function iniciarFirebase(){db.ref(NOME_BANCO).on('value',snap=>{ranking=[];historico=[];snap.forEach(c=>{let v=c.val();if(v){ranking.push(v);historico.push(v);}});ranking.sort((a,b)=>b.pontos-a.pontos);if(modo==='tv'||modo==='celular') atualizarTela();else atualizarListaAdmin();});db.ref(CHAVE_RODAPE).on('value',snap=>{if(snap.val()) PATROCINADORES_RODAPE=snap.val();});db.ref(CHAVE_FULL).on('value',snap=>{if(snap.val()) PATROCINADORES_FULL=snap.val();});db.ref(CHAVE_TEMPOS).on('value',snap=>{if(snap.val()){let t=snap.val();RODAPE_FONTE_PROP=t.fonteProp||52;RODAPE_FONTE_CONTATO=t.fonteCont||36;aplicarFontesRodape();}});}

function montarTabela(){let h="";for(let i=1;i<=10;i++) h+=`<tr><td>${i}º</td><td><input type="text" id="t${i}" oninput="calcularParcial()"></td></tr>`;document.getElementById('corpo-tabela').innerHTML=h;}

function valorTiro(v){if(!v) return 0;v=v.toString().toUpperCase().trim();if(v==='X') return 12.01;let n=parseFloat(v.replace(',','.'));return isNaN(n)?0:n;}
function gerarID(){return 'serie_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);}
function lancar(){let nome=document.getElementById('nome').value.toUpperCase().trim();let prova=document.getElementById('prova').value.toUpperCase().trim()||'C';if(!nome) return;let tiros=[];let pts=0;for(let i=1;i<=10;i++){let v=document.getElementById('t'+i).value;tiros.push(v);pts+=valorTiro(v);}let id=editandoId||gerarID();db.ref(NOME_BANCO+'/'+id).set({id,nome,prova,pontos:pts,tiros,timestamp:Date.now(),contagem:{}}).then(()=>novaSerie());}
function novaSerie(){editandoId=null;document.getElementById('nome').value="";document.getElementById('prova').value="";for(let i=1;i<=10;i++) document.getElementById('t'+i).value="";document.getElementById('parcial').innerText="TOTAL: 0.00";document.getElementById('btnSalvar').innerText='SALVAR [F2]';document.getElementById('btnCancelar').style.display='none';}
function editarSerie(id){let s=historico.find(x=>x.id===id);if(!s) return;editandoId=id;document.getElementById('nome').value=s.nome;document.getElementById('prova').value=s.prova;for(let i=0;i<10;i++) document.getElementById('t'+(i+1)).value=s.tiros[i]||'';calcularParcial();document.getElementById('btnSalvar').innerText='ATUALIZAR';document.getElementById('btnCancelar').style.display='inline-block';}
function cancelarEdicao(){novaSerie();}
function atualizarListaAdmin(){let h="";[...historico].sort((a,b)=>b.timestamp-a.timestamp).forEach(a=>{h+=`<div class="item-admin"><div class="linha-principal"><span><b>${a.prova}</b> - ${a.nome} <b style="color:#FFD700">${a.pontos.toFixed(2)}</b> <span style="font-size:9px;color:#aaa">${(a.tiros||[]).join(' | ')}</span></span><span><button class="btn-mini btn-editar" onclick="editarSerie('${a.id}')">EDITAR</button><button class="btn-mini btn-excluir" onclick="db.ref(NOME_BANCO+'/${a.id}').remove()">X</button></span></div></div>`;});document.getElementById('lista-admin').innerHTML=h;}
function atualizarTela(){
  let html="";for(let i=0;i<10&&i<ranking.length;i++){let a=ranking[i];let todos=(a.tiros||[]).join(' | ');html+=`<div class="placar ${i==0?'p1':i==1?'p2':i==2?'p3':''}"><span class="pos">${i+1}º</span><span class="nome">${a.nome}</span><span class="prova">P:${a.prova}</span><span class="total">${a.pontos.toFixed(2)}</span><span class="detalhe">${todos}</span></div>`;}
  document.getElementById('lista').innerHTML=html||"<div class='placar'>AGUARDANDO</div>";
  if(modo==='tv'){
    document.querySelectorAll('.topo img').forEach(img=>{img.style.setProperty('height','95px','important');img.style.setProperty('width','95px','important');});
    document.querySelectorAll('.placar.pos,.placar.nome,.placar.prova,.placar.total,.placar.detalhe').forEach(s=>{
      s.style.setProperty('font-size','26px','important');
      s.style.setProperty('font-weight','900','important');
    });
    document.querySelectorAll('.placar.p1.pos,.placar.p1.nome,.placar.p1.prova,.placar.p1.total,.placar.p1.detalhe,.placar.p2.pos,.placar.p2.nome,.placar.p2.prova,.placar.p2.total,.placar.p2.detalhe,.placar.p3.pos,.placar.p3.nome,.placar.p3.prova,.placar.p3.total,.placar.p3.detalhe').forEach(s=>s.style.setProperty('color','#000','important'));
    aplicarFontesRodape();
    let rel=document.getElementById('relogio-tv');if(rel) rel.style.display='block';
  }
}
if(modo==='adm') window.modoADMpendente=true;
setInterval(()=>{let el=document.getElementById('relogio-tv');if(el) el.innerText=new Date().toLocaleString('pt-BR');},1000);
// força TV a cada 500ms
setInterval(()=>{if(modo==='tv'){aplicarFontesRodape();}},500);
</script></body></html>
