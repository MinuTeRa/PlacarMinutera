<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>V15 FINAL</title><script>
const NOME_BANCO="FTERJ";const NOME_CLUBE="FTERJ";const NOME_CAMPEONATO="3x7 MinuT&Ra";const QTD_LOGOS=2;const LOGOS=["logo1.png","logo2.png"];const FULL_ATIVO=true;
let FULL_TEMPO_ESPERA_SEG=60;let FULL_TEMPO_EXIBICAO_SEG=7;let RODAPE_TEMPO_EXIBICAO_SEG=5;let FULL_ESCALA=1;
let PATROCINADORES_RODAPE=[];let PATROCINADORES_FULL=[];let SENHA_MESTRA=null;
const CHAVE_SENHA_FIREBASE='CONFIG_SENHA_OPERADOR_'+NOME_BANCO;const CHAVE_RODAPE='CONFIG_RODAPE_GLOBAL';const CHAVE_FULL='CONFIG_FULL_GLOBAL';const CHAVE_TEMPOS='CONFIG_TEMPOS_GLOBAL';
const MOSTRAR_VOLTAMOS_EM=false;const ESCALA_PLACAR=1.30;const LISTA_TESTE=["THIAGO BORGES","RUAM CAMPOS"];
</script><style>
html,body{background:#000;color:#fff;font-family:'Arial Black',Arial;margin:0;text-align:center}
button{font-size:13px;padding:6px 10px;margin:3px 2px;border-radius:6px;border:none;cursor:pointer;font-weight:bold}
.btn-lancar{background:#D2691E;color:#fff}
.topo{background:linear-gradient(90deg,#FF8C00,#FF4500);padding:5px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid #FFD700;position:relative}
.topo img{height:50px;border-radius:8px;background:#fff;padding:3px}
.topo h1{font-size:1.8vw;margin:0;color:#000;flex:1}
.logos-lado{display:flex;gap:10px}
.relogio{position:absolute;top:10px;right:20px;background:rgba(0,0,0,0.85);color:#FFD700;font-size:14px;padding:6px 16px;border-radius:20px;border:1px solid #FF8C00;z-index:90;font-family:monospace}
#lista{padding:8px;display:flex;flex-direction:column;gap:6px}
.placar{display:flex;align-items:center;padding:12px 8px;background:#1a1a1a;border-left:6px solid #555;border-radius:8px;margin:0 8px}

.pos{width:8%}.nome{width:30%;text-align:left;padding-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prova{width:10%}.total{width:12%}.detalhe{width:40%;text-align:right}
.rodape{background:linear-gradient(90deg,#FF8C00,#FF4500);border-top:4px solid #FFD700;padding:12px;width:100%;box-sizing:border-box;height:85px}
.rodape-conteudo{display:flex;justify-content:center;align-items:center;gap:20px;height:100%;flex-wrap:wrap}
.rodape-prop{color:#000;font-size:18px;font-weight:900}.rodape-contato{color:#fff;font-size:15px;background:#000;padding:5px 12px;border-radius:20px}
#insercao-full{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center}
#prop-gigante{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
#prop-gigante img{width:100vw;height:100vh;object-fit:cover}
.tela-senha{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0f0f0f}
#modal-erro{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);z-index:99999;display:none;align-items:center;justify-content:center}
#modal-erro-conteudo{background:#1a1a1a;border:3px solid #f00;border-radius:12px;padding:25px;max-width:400px}
.container-operador{display:flex;gap:8px;padding:8px;height:calc(100vh - 62px);background:#0f0f0f}
.coluna-lancamento{width:38%;background:#1a1a1a;padding:8px;border-radius:8px;overflow-y:auto;border:1px solid #333}
.coluna-lista{width:62%;background:#1a1a1a;padding:8px;border-radius:8px;overflow-y:auto;border:1px solid #333}
.cabecalho{display:flex;gap:6px;margin-bottom:6px}.cabecalho input{padding:6px;border-radius:6px;background:#222;color:#fff;border:1px solid #444}
.tabela-tiros{width:100%;border-collapse:collapse}.tabela-tiros input{width:90%;padding:4px;text-align:center;background:#222;color:#fff}
#parcial{color:#4FC3F7;margin:5px 0}

/* MODO TV V15 */
body.modo-tv{height:100vh!important;overflow:hidden!important}
body.modo-tv #tela-placar{position:fixed!important;top:0!important;left:0!important;width:100vw!important;height:100vh!important;display:flex!important;flex-direction:column!important}
body.modo-tv.topo{height:115px!important;min-height:115px!important}
body.modo-tv.topo img{height:95px!important;width:95px!important;min-width:95px!important;background:#fff!important;padding:6px!important;border-radius:10px!important}
body.modo-tv.topo h1{font-size:30px!important}
body.modo-tv #lista{flex:1!important;justify-content:space-around!important}
body.modo-tv.placar{padding:14px 12px!important}
body.modo-tv.relogio{display:block!important;font-size:22px!important;top:12px!important;right:20px!important}

/* RODAPÉ CORRIGIDO COM ESPAÇO */
body.modo-tv.rodape{height:140px!important;min-height:140px!important;padding:15px!important;display:flex!important;align-items:center!important;justify-content:center!important}
body.modo-tv.rodape.rodape-conteudo{gap:30px!important}
body.modo-tv.rodape.rodape-prop{font-size:52px!important;line-height:1.1!important}
body.modo-tv.rodape.rodape-contato{font-size:36px!important;padding:10px 22px!important}
</style></head><body>
<div id="modal-erro"><div id="modal-erro-conteudo"><p id="modal-erro-msg"></p><button onclick="document.getElementById('modal-erro').style.display='none'">OK</button></div></div>
<div id="tela-senha" class="tela-senha"><h2 id="tituloSenha">CARREGANDO...</h2><div id="areaSenha"></div><div id="erroSenha"></div></div>
<div id="tela-placar" style="display:none;"><div class="topo" id="topo-tv"><div class="relogio" id="relogio-tv"></div></div><div id="lista"></div><div id="insercao-full"><div id="prop-gigante"></div></div><div class="rodape" id="rodape-tv"><div class="rodape-conteudo" id="rodape-conteudo"></div></div></div>
<div id="tela-lancamento" style="display:none;"><div class="topo" id="topo-operador"></div><div class="container-operador"><div class="coluna-lancamento"><input type="text" id="nome" placeholder="NOME"><input type="text" id="prova" placeholder="C"><table class="tabela-tiros"><tbody id="corpo-tabela"></tbody></table><div id="parcial">TOTAL: 0.00</div><button class="btn-lancar" id="btnSalvar" onclick="lancar()">SALVAR [F2]</button><button class="btn-lancar" onclick="novaSerie()">NOVA [F3]</button></div><div class="coluna-lista"><div id="lista-admin"></div></div></div></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera",storageBucket:"placar-minutera.firebasestorage.app",messagingSenderId:"689991648080",appId:"1:689991648080:web:9deeb958183eae23e255"};firebase.initializeApp(firebaseConfig);const db=firebase.database();
let ranking=[];let historico=[];let editandoId=null;let senhaOk=false;
function montarTopo(id){let e='<div class="logos-lado">',d='<div class="logos-lado">';if(QTD_LOGOS>=1) e+=`<img src="${LOGOS[0]}">`;if(QTD_LOGOS>=2) d+=`<img src="${LOGOS[1]}">`;e+='</div>';d+='</div>';let el=document.getElementById(id);if(el){let rel=(id==='topo-tv')?`<div class="relogio" id="relogio-tv"></div>`:'';el.innerHTML=`${e}<h1>${NOME_CAMPEONATO} - ${NOME_CLUBE}</h1>${d}${rel}`;}}montarTopo('topo-tv');montarTopo('topo-operador');
const urlParams=new URLSearchParams(window.location.search);const modo=(urlParams.get('modo')||'').toLowerCase();
if(modo==='tv'){document.body.classList.add('modo-tv');document.documentElement.classList.add('modo-tv');}
let indiceRodape=0;function rotacionarRodape(){const r=document.getElementById('rodape-conteudo');if(!r||!PATROCINADORES_RODAPE.length) return;let p=PATROCINADORES_RODAPE[indiceRodape];if(p){r.innerHTML=`<div class="rodape-prop">${p.prop}</div><div class="rodape-contato">${p.contato}</div>`;}indiceRodape=(indiceRodape+1)%PATROCINADORES_RODAPE.length;}
function iniciarFirebase(){db.ref(NOME_BANCO).on('value',snap=>{ranking=[];snap.forEach(c=>{let v=c.val();if(v) ranking.push(v);});ranking.sort((a,b)=>b.pontos-a.pontos);if(modo==='tv') atualizarTela();});db.ref(CHAVE_RODAPE).on('value',snap=>{if(snap.val()) PATROCINADORES_RODAPE=snap.val();});db.ref(CHAVE_FULL).on('value',snap=>{if(snap.val()) PATROCINADORES_FULL=snap.val();});db.ref(CHAVE_TEMPOS).on('value',snap=>{});db.ref(CHAVE_SENHA_FIREBASE).once('value',snap=>{if(snap.val()) SENHA_MESTRA=snap.val();checar();});}
let listaFullTemp=[];function checar(){if(modo==='tv'){document.getElementById('tela-senha').style.display='none';document.getElementById('tela-placar').style.display='block';setInterval(rotacionarRodape,5000);rotacionarRodape();iniciarTimerFull();}else{document.getElementById('tela-senha').style.display='none';document.getElementById('tela-lancamento').style.display='block';montarTabela();}}
function montarTabela(){let h="";for(let i=1;i<=10;i++) h+=`<tr><td>${i}º</td><td><input type="text" id="t${i}" oninput="calcularParcial()"></td></tr>`;document.getElementById('corpo-tabela').innerHTML=h;}
function calcularParcial(){let t=0;for(let i=1;i<=10;i++){let el=document.getElementById('t'+i);if(el) t+=valorTiro(el.value);}document.getElementById('parcial').innerText=`TOTAL: ${t.toFixed(2)}`;}
function valorTiro(v){if(!v) return 0;v=v.toString().toUpperCase().trim();if(v==='X') return 12.01;let n=parseFloat(v.replace(',','.'));return isNaN(n)?0:n;}
function gerarID(){return 'serie_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);}
function lancar(){let nome=document.getElementById('nome').value.toUpperCase().trim();let prova=document.getElementById('prova').value.toUpperCase().trim()||'C';if(!nome) return;let tiros=[];let pts=0;for(let i=1;i<=10;i++){let v=document.getElementById('t'+i).value;tiros.push(v);pts+=valorTiro(v);}let id=gerarID();db.ref(NOME_BANCO+'/'+id).set({id,nome,prova,pontos:pts,tiros,timestamp:Date.now(),contagem:{}}).then(()=>novaSerie());}
function novaSerie(){document.getElementById('nome').value="";document.getElementById('prova').value="";for(let i=1;i<=10;i++) document.getElementById('t'+i).value="";document.getElementById('parcial').innerText="TOTAL: 0.00";}
let mostrando=false;let timerFullInterval=null;function iniciarTimerFull(){if(timerFullInterval) clearInterval(timerFullInterval);timerFullInterval=setInterval(()=>{if(PATROCINADORES_FULL.length) mostrarFull();},FULL_TEMPO_ESPERA_SEG*1000);}
function mostrarFull(){if(mostrando) return;mostrando=true;document.getElementById('insercao-full').style.display='flex';let el=document.getElementById('prop-gigante');let p=PATROCINADORES_FULL[0];if(p&&p.arte) el.innerHTML=`<img src="${p.arte}">`;else el.innerHTML=`<div style="color:#FFD700;font-size:5vw">${p? p.prop : ''}</div>`;setTimeout(()=>{document.getElementById('insercao-full').style.display='none';mostrando=false;},FULL_TEMPO_EXIBICAO_SEG*1000);}
function atualizarTela(){
  let html="";for(let i=0;i<10&&i<ranking.length;i++){let a=ranking[i];let todos=(a.tiros||[]).join(' | ');html+=`<div class="placar ${i==0?'p1':i==1?'p2':i==2?'p3':''}"><span class="pos">${i+1}º</span><span class="nome">${a.nome}</span><span class="prova">P:${a.prova}</span><span class="total">${a.pontos.toFixed(2)}</span><span class="detalhe">${todos}</span></div>`;}
  document.getElementById('lista').innerHTML=html||"<div class='placar'>AGUARDANDO</div>";
  if(modo==='tv'){
    document.querySelectorAll('.topo img').forEach(img=>{img.style.setProperty('height','95px','important');img.style.setProperty('width','95px','important');});
    document.querySelectorAll('.placar').forEach((el,i)=>{
      el.querySelectorAll('.pos,.nome,.prova,.total,.detalhe').forEach(s=>{
        s.style.setProperty('font-size','26px','important');
        s.style.setProperty('font-weight','900','important');
        if(i<3) s.style.setProperty('color','#000','important');
      });
    });
    let rp=document.querySelector('.rodape-prop');if(rp) rp.style.setProperty('font-size','52px','important');
    let rc=document.querySelector('.rodape-contato');if(rc) rc.style.setProperty('font-size','36px','important');
  }
}
iniciarFirebase();
setInterval(()=>{let el=document.getElementById('relogio-tv');if(el){el.innerText=new Date().toLocaleString('pt-BR');}},1000);
// FORÇA RODAPÉ A CADA 500ms
setInterval(()=>{
  if(modo==='tv'){
    let rp=document.querySelector('.rodape-prop');if(rp){rp.style.setProperty('font-size','52px','important');rp.style.setProperty('color','#000','important');}
    let rc=document.querySelector('.rodape-contato');if(rc) rc.style.setProperty('font-size','36px','important');
    let rodape=document.querySelector('.rodape');if(rodape){rodape.style.setProperty('height','140px','important');}
    let rel=document.querySelector('.relogio');if(rel) rel.style.display='block';
  }
},500);
</script></body></html>
