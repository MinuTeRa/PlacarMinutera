<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LANCAMENTO - FTERJ</title>
<style>
html,body{background:#000;color:#fff;font-family:'Arial Black',Arial;margin:0}
button{font-size:13px;padding:6px 10px;margin:3px 2px;border-radius:6px;border:none;cursor:pointer;font-weight:bold}
.btn-lancar{background:#D2691E;color:#fff}.btn-mini{padding:3px 7px;font-size:10px;margin-left:3px;border-radius:4px}.btn-editar{background:#FFD700;color:#000}.btn-excluir{background:#c00;color:#fff}
.tela-senha{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0f0f0f}
.topo{background:linear-gradient(90deg,#FF8C00,#FF4500);padding:5px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid #FFD700}
.topo img{height:50px;border-radius:8px;background:#fff;padding:3px}.topo h1{font-size:1.8vw;margin:0;color:#000;flex:1}.logos-lado{display:flex;gap:10px}
.container-operador{display:flex;gap:8px;padding:8px;height:calc(100vh - 62px);background:#0f0f0f}
.coluna-lancamento{width:38%;background:#1a1a1a;padding:8px;border-radius:8px;overflow-y:auto;border:1px solid #333}
.coluna-lista{width:62%;background:#0f0f0f;padding:8px;border-radius:8px;overflow-y:auto;border:1px solid #333}
.cabecalho{display:flex;gap:6px;margin-bottom:6px}.cabecalho input{padding:8px;border-radius:6px;border:2px solid #444;background:#222;color:#e0e0e0}
#nome{width:70%}#prova{width:25%}.tabela-tiros{width:100%;border-collapse:collapse}.tabela-tiros th{background:#2a2a2a;color:#FFA500;padding:5px;font-size:13px}.tabela-tiros td{padding:3px}.tabela-tiros input{width:94%;padding:6px;text-align:center;background:#222;color:#fff;border:2px solid #444;border-radius:4px}
#parcial{color:#4FC3F7;margin:8px 0;font-weight:bold}.item-admin{background:#222;margin:6px 0;padding:8px 10px;border-radius:8px;border-left:4px solid #FF8C00;text-align:left}.linha-principal{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:5px}
</style></head><body>
<div id="tela-senha" class="tela-senha"><h2 id="tituloSenha">🔒 CARREGANDO...</h2><div id="areaSenha"></div><div id="erroSenha" style="color:#f55"></div></div>
<div id="tela-lancamento" style="display:none;"><div class="topo" id="topo-operador"></div><div class="container-operador"><div class="coluna-lancamento"><div style="font-size:10px;color:#888">CLUBE: <span id="labelBanco" style="color:#FFD700"></span> | <a href="adm.html" style="color:#FFD700">ADM</a> | <a href="tv.html" target="_blank" style="color:#00FFFF">TV</a></div><div id="status" style="font-size:10px;color:#81C784"></div><div class="cabecalho"><input type="text" id="nome" placeholder="NOME"><input type="text" id="prova" placeholder="C"></div><table class="tabela-tiros"><thead><tr><th>TIRO</th><th>VALOR</th></tr></thead><tbody id="corpo-tabela"></tbody></table><div id="parcial">TOTAL: 0.00</div><button class="btn-lancar" id="btnSalvar" onclick="lancar()">SALVAR [F2]</button><button class="btn-lancar" onclick="novaSerie()">NOVA [F3]</button><button class="btn-lancar" id="btnCancelar" onclick="cancelarEdicao()" style="background:#555;display:none">CANCELAR</button></div><div class="coluna-lista"><div id="lista-admin"></div></div></div></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="./firebase-config.js?v=17"></script>
<script>
let ranking=[],historico=[],editandoId=null,SENHA_MESTRA=null,senhaOk=false;
function montarTopo(id){let e='<div class="logos-lado">',d='<div class="logos-lado">';if(QTD_LOGOS>=1) e+=`<img src="${LOGOS[0]}">`;if(QTD_LOGOS>=2) d+=`<img src="${LOGOS[1]}">`;e+='</div>';d+='</div>';let el=document.getElementById(id);if(el){el.innerHTML=`${e}<h1>${NOME_CAMPEONATO} - ${NOME_CLUBE}</h1>${d}`;}}montarTopo('topo-operador');
firebase.initializeApp(firebaseConfig);const db=firebase.database();
function renderTelaCriarSenha(){document.getElementById('tituloSenha').innerText='🔑 PRIMEIRO ACESSO';document.getElementById('areaSenha').innerHTML=`<input type="password" id="novaSenha" placeholder="CRIAR SENHA" style="padding:12px;background:#222;color:#fff"><br><input type="password" id="confirmaSenha" placeholder="CONFIRMAR" style="padding:12px;background:#222;color:#fff;margin-top:8px"><br><button onclick="salvarSenhaFirebase()" style="margin-top:12px;background:#FFD700;color:#000;padding:12px 30px">SALVAR</button>`;}
function renderTelaLogin(){document.getElementById('tituloSenha').innerText='🔒 ACESSO RESTRITO';document.getElementById('areaSenha').innerHTML=`<input type="password" id="inputSenha" placeholder="SENHA" style="padding:12px;background:#222;color:#fff"><br><button onclick="verificarSenha()" style="margin-top:12px;background:#FF8C00;color:#000;padding:10px 25px">ENTRAR</button>`;}
function salvarSenhaFirebase(){let s1=document.getElementById('novaSenha').value.trim(),s2=document.getElementById('confirmaSenha').value.trim();if(s1!==s2){document.getElementById('erroSenha').innerText='Não conferem';return;}db.ref(CHAVE_SENHA_FIREBASE).set(s1).then(()=>{SENHA_MESTRA=s1;renderTelaLogin();});}
function verificarSenha(){let d=document.getElementById('inputSenha').value;if(d===SENHA_MESTRA){document.getElementById('tela-senha').style.display='none';document.getElementById('tela-lancamento').style.display='block';montarTabela();iniciarFirebase();}else document.getElementById('erroSenha').innerText='INCORRETA';}
function checarSenhaFirebase(){document.getElementById('labelBanco').innerText=NOME_BANCO;db.ref(CHAVE_SENHA_FIREBASE).once('value',s=>{if(s.val()){SENHA_MESTRA=s.val();renderTelaLogin();}else renderTelaCriarSenha();});}checarSenhaFirebase();
function montarTabela(){let h="";for(let i=1;i<=10;i++) h+=`<tr><td>${i}º</td><td><input type="text" id="t${i}" oninput="calcularParcial()"></td></tr>`;document.getElementById('corpo-tabela').innerHTML=h;}
function calcularParcial(){let t=0;for(let i=1;i<=10;i++){let el=document.getElementById('t'+i);if(el) t+=valorTiro(el.value);}document.getElementById('parcial').innerText=`TOTAL: ${t.toFixed(2)}`;}
function valorTiro(v){if(!v) return 0;v=v.toString().toUpperCase().trim();if(v==='X') return 12.01;let n=parseFloat(v.replace(',','.'));return isNaN(n)?0:n;}
function gerarID(){return 'serie_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);}
function lancar(){let nome=document.getElementById('nome').value.toUpperCase().trim();let prova=document.getElementById('prova').value.toUpperCase().trim()||'C';if(!nome) return;let tiros=[],pts=0;for(let i=1;i<=10;i++){let v=document.getElementById('t'+i).value;tiros.push(v);pts+=valorTiro(v);}let id=editandoId||gerarID();db.ref(NOME_BANCO+'/'+id).set({id,nome,prova,pontos:pts,tiros,timestamp:Date.now()}).then(()=>novaSerie());}
function novaSerie(){editandoId=null;document.getElementById('nome').value="";document.getElementById('prova').value="";for(let i=1;i<=10;i++) document.getElementById('t'+i).value="";document.getElementById('parcial').innerText="TOTAL: 0.00";document.getElementById('btnSalvar').innerText='SALVAR [F2]';document.getElementById('btnCancelar').style.display='none';}
function editarSerie(id){let s=historico.find(x=>x.id===id);if(!s) return;editandoId=id;document.getElementById('nome').value=s.nome;document.getElementById('prova').value=s.prova;for(let i=0;i<10;i++) document.getElementById('t'+(i+1)).value=s.tiros[i]||'';calcularParcial();document.getElementById('btnSalvar').innerText='ATUALIZAR';document.getElementById('btnCancelar').style.display='inline-block';}
function cancelarEdicao(){novaSerie();}
function atualizarListaAdmin(){let h="";[...historico].sort((a,b)=>b.timestamp-a.timestamp).forEach(a=>{h+=`<div class="item-admin"><div class="linha-principal"><span><b>${a.prova}</b> - ${a.nome} <b style="color:#FFD700">${a.pontos.toFixed(2)}</b> <span style="font-size:9px;color:#aaa">${(a.tiros||[]).join(' | ')}</span></span><span><button class="btn-mini btn-editar" onclick="editarSerie('${a.id}')">EDITAR</button><button class="btn-mini btn-excluir" onclick="db.ref(NOME_BANCO+'/'+a.id).remove()">X</button></span></div></div>`;});document.getElementById('lista-admin').innerHTML=h;}
function iniciarFirebase(){db.ref(NOME_BANCO).on('value',snap=>{ranking=[];historico=[];snap.forEach(c=>{let v=c.val();if(v){ranking.push(v);historico.push(v);}});ranking.sort((a,b)=>b.pontos-a.pontos);atualizarListaAdmin();});}
</script></body></html>
