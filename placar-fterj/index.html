let ranking=[];let historico=[];let editandoId=null;let senhaOk=false;let offsetServidor=0;let anunciosLigados=true;

let indiceRodape=0;function rotacionarRodape(){const r=document.getElementById('rodape-conteudo');if(!r||!PATROCINADORES_RODAPE.length) return;r.style.opacity=0;setTimeout(()=>{let p=PATROCINADORES_RODAPE[indiceRodape];if(p){r.innerHTML=`<div class="rodape-prop">${p.prop}</div><div class="rodape-contato">${p.contato}</div>`;}r.style.opacity=1;indiceRodape=(indiceRodape+1)%PATROCINADORES_RODAPE.length;},300);}
let mostrando=false;let timerFullInterval=null;function getFullsAtivos(){return PATROCINADORES_FULL.filter(f=>f.ativo!==false);}function iniciarTimerFull(){if(timerFullInterval) clearInterval(timerFullInterval);timerFullInterval=setInterval(mostrarInsercaoFull,FULL_TEMPO_ESPERA_SEG*1000);}

let timer=setInterval(()=>{resto--;if(resto<=0) clearInterval(timer);},1000);function prox(){if(idx>=lista.length){clearInterval(timer);document.getElementById('insercao-full').style.display='none';mostrando=false;return;}let p=lista[idx];let el=document.getElementById('prop-gigante');if(p.arte) el.innerHTML=`<div class="full-escala-wrap"><img src="${p.arte}"></div>`;else el.innerHTML=`<div class="full-escala-wrap"><div style='font-size:4.5vw;color:#FFD700;font-weight:bold'>${p.prop||''}</div></div>`;let tempoAtual=parseInt(p.tempo)||FULL_TEMPO_EXIBICAO_SEG;setTimeout(()=>{idx++;prox();},tempoAtual*1000);}prox();}

function renderTelaCriarSenha(){document.getElementById('tituloSenha').innerText='🔑 PRIMEIRO ACESSO';document.getElementById('areaSenha').innerHTML=`<input type="password" id="novaSenha" placeholder="CRIAR SENHA" style="padding:12px;border-radius:8px;background:#222;color:#fff"><br><input type="password" id="confirmaSenha" placeholder="CONFIRMAR" style="padding:12px;background:#222;color:#fff;margin-top:8px"><br><button onclick="salvarSenhaFirebase()" style="margin-top:12px;background:#FFD700;color:#000;padding:12px 30px">SALVAR</button>`;}

function checarSenhaFirebase(){let el=document.getElementById('labelBanco'); if(el) el.innerText=NOME_BANCO;if(modo==='tv'||modo==='celular'){document.getElementById('tela-senha').style.display='none';document.getElementById('tela-placar').style.display='block';rotacionarRodape();setInterval(rotacionarRodape,RODAPE_TEMPO_EXIBICAO_SEG*1000);iniciarTimerFull();iniciarFirebase();return;}db.ref(CHAVE_SENHA_FIREBASE).once('value',snap=>{if(snap.val()){SENHA_MESTRA=snap.val();if(modo==='adm') window.modoADMpendente=true;renderTelaLogin();}else{renderTelaCriarSenha();}});}checarSenhaFirebase();

function carregarAnunciosTela(){db.ref(CHAVE_TEMPOS).once('value',s=>{if(s.val()){let t=s.val();document.getElementById('segRodape').value=t.segRodape||5;document.getElementById('esperaFull').value=t.esperaFull||60;document.getElementById('escalaFull').value=t.escalaFull||1;}});db.ref(CHAVE_RODAPE).once('value',s=>{listaRodapeTemp=s.val()||[];renderRodapes();});db.ref(CHAVE_FULL).once('value',s=>{listaFullTemp=s.val()||[];renderFulls();});}
function renderRodapes(){let c=document.getElementById('containerRodapes');c.innerHTML='';listaRodapeTemp.forEach((d,i)=>{c.innerHTML+=`<div class="box-anuncio"><b>#${i+1}</b><input type="text" id="rod_prop_${i}" value="${d.prop||''}" placeholder="PROP"><input type="text" id="rod_cont_${i}" value="${d.contato||''}" placeholder="CONTATO"><button class="btn-mini btn-excluir" onclick="removerRodape(${i})">X</button></div>`;});}
function adicionarRodape(){listaRodapeTemp.push({prop:'',contato:''});renderRodapes();}
function removerRodape(i){listaRodapeTemp.splice(i,1);renderRodapes();}
function salvarRodapes(){let lista=[];listaRodapeTemp.forEach((_,i)=>{let prop=document.getElementById('rod_prop_'+i)?.value.trim()||'';let contato=document.getElementById('rod_cont_'+i)?.value.trim()||'';if(prop||contato) lista.push({prop,contato});});listaRodapeTemp=lista;db.ref(CHAVE_RODAPE).set(lista).then(()=>{PATROCINADORES_RODAPE=lista;renderRodapes();});}
function renderFulls(){let c=document.getElementById('containerFull');c.innerHTML='';listaFullTemp.forEach((d,i)=>{let ativo=d.ativo!==false; c.innerHTML+=`<div class="box-anuncio"><b>#${i+1}</b><input type="checkbox" id="full_ativo_${i}" ${ativo?'checked':''} onchange="toggleFullAtivo(${i})"><input type="text" id="full_nome_${i}" value="${d.nome||''}" placeholder="NOME"><input type="text" id="full_prop_${i}" value="${d.prop||''}" placeholder="TEXTO"><input type="file" id="full_file_${i}" accept="image/*" onchange="uploadArte(${i},this)"><img id="full_prev_${i}" class="preview-arte" src="${d.arte||''}"><input type="hidden" id="full_arte_${i}" value="${d.arte||''}"><label>s: <input type="number" class="tempo" id="full_tempo_${i}" value="${d.tempo||7}"></label><button class="btn-mini btn-excluir" onclick="removerFull(${i})">X</button></div>`;});}
function toggleFullAtivo(i){listaFullTemp[i].ativo=document.getElementById('full_ativo_'+i).checked; renderFulls();}
function adicionarFull(){listaFullTemp.push({nome:'',prop:'',arte:'',tempo:7,ativo:true});renderFulls();}
function removerFull(i){listaFullTemp.splice(i,1);renderFulls();}
function salvarFulls(){let lista=[];listaFullTemp.forEach((_,i)=>{let nome=document.getElementById('full_nome_'+i)?.value.trim()||'';let prop=document.getElementById('full_prop_'+i)?.value.trim()||'';let arte=document.getElementById('full_arte_'+i)?.value.trim()||'';let tempo=parseInt(document.getElementById('full_tempo_'+i)?.value)||7;let ativo=document.getElementById('full_ativo_'+i)?.checked;if(nome||prop||arte) lista.push({nome,prop,arte,tempo,ativo});});listaFullTemp=lista;db.ref(CHAVE_FULL).set(lista).then(()=>{PATROCINADORES_FULL=lista;renderFulls();});}
async function uploadArte(idx,input){let file=input.files[0];if(!file) return;try{let ref=storage.ref(`anuncios/global/${Date.now()}_${file.name}`);let snap=await ref.put(file);let url=await snap.ref.getDownloadURL();document.getElementById('full_arte_'+idx).value=url;document.getElementById('full_prev_'+idx).src=url;listaFullTemp[idx].arte=url;}catch(e){alert(e.message);}}
function salvarTempos(){let tempos={segRodape:parseInt(document.getElementById('segRodape').value)||5,esperaFull:parseInt(document.getElementById('esperaFull').value)||60,escalaFull:parseFloat(document.getElementById('escalaFull').value)||1};db.ref(CHAVE_TEMPOS).set(tempos).then(()=>{FULL_ESCALA=tempos.escalaFull;FULL_TEMPO_ESPERA_SEG=tempos.esperaFull;RODAPE_TEMPO_EXIBICAO_SEG=tempos.segRodape;});}
function iniciarFirebase(){db.ref(NOME_BANCO).on('value',snap=>{ranking=[];historico=[];snap.forEach(c=>{let v=c.val();if(v&&v.contagem){ranking.push(v);historico.push(v);}});ranking.sort((a,b)=>b.pontos-a.pontos);if(modo==='tv'||modo==='celular') atualizarTela();else atualizarListaAdmin();});db.ref('CONFIG_ANUNCIOS').on('value',snap=>{let val=snap.val();if(val===null) val=true;anunciosLigados=val;});db.ref(CHAVE_RODAPE).on('value',snap=>{if(snap.val()) PATROCINADORES_RODAPE=snap.val();});db.ref(CHAVE_FULL).on('value',snap=>{if(snap.val()){PATROCINADORES_FULL=snap.val();}});db.ref(CHAVE_TEMPOS).on('value',snap=>{if(snap.val()){let t=snap.val();RODAPE_TEMPO_EXIBICAO_SEG=t.segRodape||5;FULL_TEMPO_ESPERA_SEG=t.esperaFull||60;FULL_ESCALA=t.escalaFull||1;if(modo==='tv'||modo==='celular'){iniciarTimerFull();}}});}
function alternarAnuncios(){let toggle=document.getElementById('toggleAnuncio');db.ref('CONFIG_ANUNCIOS').set(toggle.checked);}
if(modo==='adm'){window.modoADMpendente=true;}
function montarLinksADM(){let base=window.location.href.split('?')[0];document.getElementById('links-adm').innerHTML=`<a class="link-adm" href="${base}?modo=tv" target="_blank">📺 TELÃO</a><a class="link-adm" href="${base}?modo=celular" target="_blank">📱 CELULAR</a>`;}
function montarTabela(){let h="";for(let i=1;i<=10;i++) h+=`<tr><td>${i}º</td><td><input type="text" id="t${i}" onkeyup="proximoTiro(event,${i})" oninput="calcularParcial()"></td></tr>`;document.getElementById('corpo-tabela').innerHTML=h;}
function proximoTiro(e,n){if(e.key==='Enter'){e.preventDefault();if(n<10) document.getElementById('t'+(n+1)).focus();}}
function calcularParcial(){let t=0;for(let i=1;i<=10;i++){let el=document.getElementById('t'+i);if(el) t+=valorTiro(el.value);}document.getElementById('parcial').innerText=`TOTAL: ${t.toFixed(2)}`;}
function valorTiro(v){if(!v) return 0;v=v.toString().toUpperCase().trim();if(v==='X') return 12.01;let n=parseFloat(v.replace(',','.'));return isNaN(n)?0:n;}
function contarTiros(tiros){let c={};tiros.forEach(t=>{let v=valorTiro(t);});return c;}
function gerarID(){return 'serie_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);}
function lancarBase(){let nome=document.getElementById('nome').value.toUpperCase().trim();let prova=document.getElementById('prova').value.toUpperCase().trim();if(!nome||!prova) return alert("Preencha");if(!validarTiros()) return;let tiros=[];let pts=0;for(let i=1;i<=10;i++){let v=document.getElementById('t'+i).value;tiros.push(v);pts+=valorTiro(v);}let cont=contarTiros(tiros);let id=editandoId?editandoId:gerarID();db.ref(NOME_BANCO+'/'+id).set({id,nome,prova,pontos:pts,tiros,contagem:cont,timestamp:Date.now()}).then(()=>{editandoId=null;novaSerie();});}
function atualizarListaAdmin(){let h="";let lista=[...historico].sort((a,b)=>b.timestamp-a.timestamp);lista.forEach((a)=>{h+=`<div class="item-admin">${a.nome} ${a.pontos.toFixed(2)} <button class="btn-mini btn-excluir" onclick="excluirSerie('${a.id}')">X</button></div>`;});document.getElementById('lista-admin').innerHTML=h;}
function novaSerie(){editandoId=null;document.getElementById('nome').value="";document.getElementById('prova').value="";for(let i=1;i<=10;i++){let el=document.getElementById('t'+i);if(el) el.value="";}document.getElementById('parcial').innerText="TOTAL: 0.00";document.getElementById('nome').focus();}
function excluirSerie(id){db.ref(NOME_BANCO+'/'+id).remove();}
function apagarPlacar(){if(confirm('APAGAR?')) db.ref(NOME_BANCO).remove();}
function apagarListaAtletas(){if(confirm('Apagar lista?')){localStorage.removeItem('lista_atletas');db.ref('LISTA_ATLETAS_GLOBAL').remove();LISTA_ATLETAS=[];}}
function limparContadores(){}
function getRankingParaTV(lista){const ordenados=[...lista].sort((a,b)=>b.pontos-a.pontos);const topUnico=[];const vistos=new Set();for(let i=0;i<ordenados.length;i++){const item=ordenados[i];const chave=item.nome.trim().toUpperCase();if(!vistos.has(chave)){vistos.add(chave);topUnico.push(item);}if(topUnico.length===5) break;}const idsTop=new Set(topUnico.map(t=>t.id));const resto=ordenados.filter(o=>!idsTop.has(o.id));return[...topUnico,...resto];}
function atualizarTela(){
  let html="";const rankingTV=getRankingParaTV(ranking);let max=10;
  for(let i=0;i<max&&i<rankingTV.length;i++){
    let a=rankingTV[i];
    let todosTiros=(a.tiros||[]).join(' | ');
    html+=`<div class="placar ${i==0?'p1':i==1?'p2':i==2?'p3':''}"><span class="pos">${i+1}º</span><span class="nome">${a.nome}</span><span class="prova">P:${a.prova}</span><span class="total">${a.pontos.toFixed(2)}</span><span class="detalhe">${todosTiros}</span></div>`;
  }
  document.getElementById('lista').innerHTML=html||"<div class='placar'>AGUARDANDO</div>";
  if(modo==='tv'){
    setTimeout(()=>{
      document.querySelectorAll('.topo img').forEach(img=>{
        img.style.setProperty('height','95px','important');
        img.style.setProperty('width','95px','important');
      });
      document.querySelectorAll('.placar').forEach((el,i)=>{
        el.style.setProperty('padding','14px 12px','important');
        el.querySelectorAll('.pos,.nome,.prova,.total,.detalhe').forEach(s=>{
          s.style.setProperty('font-size','26px','important');
          s.style.setProperty('font-weight','900','important');
          if(i<3){ s.style.setProperty('color','#000','important'); }
        });
      });
      document.querySelectorAll('.rodape-prop').forEach(e=>{
        e.style.setProperty('font-size','46px','important');
        e.style.setProperty('color','#000','important');
      });
      document.querySelectorAll('.rodape-contato').forEach(e=>{
        e.style.setProperty('font-size','32px','important');
      });
    },20);
  }
}
