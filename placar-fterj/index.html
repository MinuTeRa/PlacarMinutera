let indiceRodape=0;function rotacionarRodape(){const r=document.getElementById('rodape-conteudo');if(!r||!PATROCINADORES_RODAPE.length) return;r.style.opacity=0;setTimeout(()=>{let p=PATROCINADORES_RODAPE[indiceRodape];if(p){r.innerHTML=`<div class="rodape-prop">${p.prop}</div><div class="rodape-contato">${p.contato}</div>`;}r.style.opacity=1;indiceRodape=(indiceRodape+1)%PATROCINADORES_RODAPE.length;},300);}
let mostrando=false;let timerFullInterval=null;
function getFullsAtivos(){return PATROCINADORES_FULL.filter(f=>f.ativo!==false);}
function iniciarTimerFull(){if(timerFullInterval) clearInterval(timerFullInterval);timerFullInterval=setInterval(mostrarInsercaoFull,FULL_TEMPO_ESPERA_SEG*1000);}
function mostrarInsercaoFull(){if(!FULL_ATIVO||!anunciosLigados||mostrando) return;let ativos=getFullsAtivos();if(!ativos.length) return;mostrando=true;let lista=ativos;let total=lista.reduce((s,p)=>s+(parseInt(p.tempo)||FULL_TEMPO_EXIBICAO_SEG),0);let resto=total;let idx=0;document.getElementById('insercao-full').style.display='flex';document.documentElement.style.setProperty('--full-scale',FULL_ESCALA);
if(MOSTRAR_VOLTAMOS_EM){document.getElementById('contato-gigante').style.display='block';document.getElementById('contato-gigante').innerHTML=`VOLTAMOS EM <b style="color:#FFD700;">${resto}s</b>`;}else{document.getElementById('contato-gigante').style.display='none';}
let timer=setInterval(()=>{resto--;if(MOSTRAR_VOLTAMOS_EM){let el=document.getElementById('contato-gigante');if(el) el.innerHTML=`VOLTAMOS EM <b style="color:#FFD700;">${resto}s</b>`;}if(resto<=0) clearInterval(timer);},1000);function prox(){if(idx>=lista.length){clearInterval(timer);document.getElementById('insercao-full').style.display='none';mostrando=false;return;}let p=lista[idx];let el=document.getElementById('prop-gigante');if(p.arte) el.innerHTML=`<div class="full-escala-wrap"><img src="${p.arte}"></div>`;else el.innerHTML=`<div class="full-escala-wrap"><div style='font-size:4.5vw;color:#FFD700;font-weight:bold'>${p.prop||p.nome||''}</div></div>`;let tempoAtual=parseInt(p.tempo)||FULL_TEMPO_EXIBICAO_SEG;setTimeout(()=>{idx++;prox();},tempoAtual*1000);}prox();}
let inputComErro=null;function mostrarErro(msg,i){document.getElementById('modal-erro-msg').innerHTML=msg;document.getElementById('modal-erro').style.display='flex';if(i){let el=document.getElementById('t'+i);if(el){el.classList.add('erro');inputComErro=el;}}}function fecharErro(){document.getElementById('modal-erro').style.display='none';if(inputComErro){inputComErro.focus();inputComErro.select();}}
function validarTiros(){for(let i=1;i<=10;i++){let el=document.getElementById('t'+i);if(!el) continue;let v=el.value.toString().trim();if(v==='') continue;let up=v.toUpperCase();if(up==='X') continue;let num=parseFloat(v.replace(',','.'));if(isNaN(num)||num<0||num>10){mostrarErro(`No <b>${i}º TIRO</b> "${v}" inválido!`,i);return false;}}return true;}
function renderTelaCriarSenha(){document.getElementById('tituloSenha').innerText='🔑 PRIMEIRO ACESSO';document.getElementById('areaSenha').innerHTML=`<p style="color:#aaa;font-size:13px">Defina a senha:</p><input type="password" id="novaSenha" placeholder="CRIAR SENHA" style="padding:12px;border-radius:8px;border:2px solid #FFD700;background:#222;color:#fff;text-align:center;width:250px"><br><input type="password" id="confirmaSenha" placeholder="CONFIRMAR" style="padding:12px;border-radius:8px;border:2px solid #444;background:#222;color:#fff;text-align:center;width:250px;margin-top:8px"><br><button onclick="salvarSenhaFirebase()" style="margin-top:12px;background:#FFD700;color:#000;padding:12px 30px">SALVAR</button>`;}
function renderTelaLogin(){document.getElementById('tituloSenha').innerText='🔒 ACESSO RESTRITO';document.getElementById('areaSenha').innerHTML=`<input type="password" id="inputSenha" placeholder="SENHA" style="padding:12px;border-radius:8px;border:2px solid #444;background:#222;color:#fff;text-align:center;width:250px" onkeyup="if(event.key==='Enter') verificarSenha()"><br><button onclick="verificarSenha()" style="margin-top:12px;background:#FF8C00;color:#000;padding:10px 25px">ENTRAR</button>`;}
function salvarSenhaFirebase(){let s1=document.getElementById('novaSenha').value.trim();let s2=document.getElementById('confirmaSenha').value.trim();if(s1.length<4){document.getElementById('erroSenha').innerText='Minimo 4';return;}if(s1!==s2){document.getElementById('erroSenha').innerText='Não conferem';return;}db.ref(CHAVE_SENHA_FIREBASE).set(s1).then(()=>{SENHA_MESTRA=s1;alert('✅ Senha salva!');renderTelaLogin();});}
function trocarSenhaADM(){let ns=document.getElementById('novaSenhaADM').value.trim();if(ns.length<4){document.getElementById('msgSenhaADM').innerText='Minimo 4';return;}db.ref(CHAVE_SENHA_FIREBASE).set(ns).then(()=>{SENHA_MESTRA=ns;document.getElementById('msgSenhaADM').innerText='✅ Atualizada!';});}
function verificarSenha(){let d=document.getElementById('inputSenha').value;if(d===SENHA_MESTRA){senhaOk=true;document.getElementById('tela-senha').style.display='none';if(window.modoADMpendente){document.getElementById('tela-adm').style.display='block';montarLinksADM();iniciarFirebase();iniciarListaAtletasADM();}else if(modo==='anuncios'){document.getElementById('tela-anuncios').style.display='block';carregarAnunciosTela();}else{document.getElementById('tela-lancamento').style.display='block';montarTabela();iniciarFirebase();iniciarListaAtletas();}}else{document.getElementById('erroSenha').innerText='INCORRETA!';}}
function checarSenhaFirebase(){let el=document.getElementById('labelBanco'); if(el) el.innerText=NOME_BANCO;let el2=document.getElementById('nomeBancoADM'); if(el2) el2.innerText=NOME_BANCO;if(modo==='tv'||modo==='celular'){document.getElementById('tela-senha').style.display='none';document.getElementById('tela-placar').style.display='block';document.getElementById('rodape-tv').style.display='block';rotacionarRodape();setInterval(rotacionarRodape,RODAPE_TEMPO_EXIBICAO_SEG*1000);iniciarTimerFull();iniciarFirebase();return;}db.ref(CHAVE_SENHA_FIREBASE).once('value',snap=>{if(snap.val()){SENHA_MESTRA=snap.val();if(modo==='adm') window.modoADMpendente=true;renderTelaLogin();}else{renderTelaCriarSenha();}});}
checarSenhaFirebase();
let listaRodapeTemp=[];let listaFullTemp=[];
function carregarAnunciosTela(){db.ref(CHAVE_TEMPOS).once('value',s=>{if(s.val()){let t=s.val();document.getElementById('segRodape').value=t.segRodape||5;document.getElementById('esperaFull').value=t.esperaFull||60;document.getElementById('escalaFull').value=t.escalaFull||1;document.getElementById('valEscala').innerText=Math.round((t.escalaFull||1)*100)+'%';FULL_ESCALA=t.escalaFull||1;}});db.ref(CHAVE_RODAPE).once('value',s=>{listaRodapeTemp=s.val()||[];renderRodapes();});db.ref(CHAVE_FULL).once('value',s=>{listaFullTemp=s.val()||[];renderFulls();});}
function renderRodapes(){let c=document.getElementById('containerRodapes');c.innerHTML='';document.getElementById('contadorRodape').innerText=`(${listaRodapeTemp.length})`;listaRodapeTemp.forEach((d,i)=>{c.innerHTML+=`<div class="box-anuncio"><b style="color:#FFD700">#${i+1}</b><input type="text" id="rod_prop_${i}" value="${(d.prop||'').replace(/"/g,'&quot;')}" placeholder="PROP"><input type="text" id="rod_cont_${i}" value="${(d.contato||'').replace(/"/g,'&quot;')}" placeholder="CONTATO"><button class="btn-mini btn-excluir" onclick="removerRodape(${i})">X</button></div>`;});}
function adicionarRodape(){listaRodapeTemp.push({prop:'',contato:''});renderRodapes();setTimeout(()=>{let el=document.getElementById('rod_prop_'+(listaRodapeTemp.length-1)); if(el) el.focus();},100);}
function removerRodape(i){if(!confirm('Excluir rodapé #'+(i+1)+'?')) return;listaRodapeTemp.splice(i,1);renderRodapes();}
function salvarRodapes(){let lista=[];listaRodapeTemp.forEach((_,i)=>{let prop=document.getElementById('rod_prop_'+i)?.value.trim()||'';let contato=document.getElementById('rod_cont_'+i)?.value.trim()||'';if(prop||contato) lista.push({prop,contato});});listaRodapeTemp=lista;db.ref(CHAVE_RODAPE).set(lista).then(()=>{document.getElementById('statusAnuncioSave').innerText='✅ '+lista.length+' rodapés salvos!';PATROCINADORES_RODAPE=lista;renderRodapes();});}
function renderFulls(){let c=document.getElementById('containerFull');c.innerHTML='';document.getElementById('contadorFull').innerText=`(${listaFullTemp.length})`;listaFullTemp.forEach((d,i)=>{let ativo=d.ativo!==false; c.innerHTML+=`<div class="box-anuncio" style="opacity:${ativo?1:0.5}"><b style="color:#FFD700">#${i+1}</b><label class="switch" style="scale:0.8"><input type="checkbox" id="full_ativo_${i}" ${ativo?'checked':''} onchange="toggleFullAtivo(${i})"><span class="slider"></span></label><input type="text" id="full_nome_${i}" value="${d.nome||''}" placeholder="NOME" style="max-width:90px"><input type="text" id="full_prop_${i}" value="${d.prop||''}" placeholder="TEXTO"><input type="file" id="full_file_${i}" accept="image/*" onchange="uploadArte(${i},this)"><img id="full_prev_${i}" class="preview-arte" src="${d.arte||''}"><input type="hidden" id="full_arte_${i}" value="${d.arte||''}"><label style="color:#aaa;font-size:11px">s: <input type="number" class="tempo" id="full_tempo_${i}" value="${d.tempo||7}" min="1"></label><button class="btn-mini btn-excluir" onclick="removerFull(${i})">X</button></div>`;});}
function toggleFullAtivo(i){listaFullTemp[i].ativo=document.getElementById('full_ativo_'+i).checked; renderFulls();}
function adicionarFull(){listaFullTemp.push({nome:'',prop:'',arte:'',tempo:7,ativo:true});renderFulls();}
function removerFull(i){if(!confirm('Excluir FULL #'+(i+1)+'?')) return;listaFullTemp.splice(i,1);renderFulls();}
function salvarFulls(){let lista=[];listaFullTemp.forEach((_,i)=>{let nome=document.getElementById('full_nome_'+i)?.value.trim()||'';let prop=document.getElementById('full_prop_'+i)?.value.trim()||'';let arte=document.getElementById('full_arte_'+i)?.value.trim()||'';let tempo=parseInt(document.getElementById('full_tempo_'+i)?.value)||7;let ativo=document.getElementById('full_ativo_'+i)?.checked;if(nome||prop||arte) lista.push({nome,prop,arte,tempo,ativo});});listaFullTemp=lista;db.ref(CHAVE_FULL).set(lista).then(()=>{document.getElementById('statusAnuncioSave').innerText='✅ '+lista.length+' FULL salvos! ('+lista.filter(f=>f.ativo!==false).length+' ativos)';PATROCINADORES_FULL=lista;renderFulls();});}
async function uploadArte(idx,input){let file=input.files[0];if(!file) return;let status=document.getElementById('statusAnuncioSave');status.innerText='⏳ Enviando '+file.name+'...';try{let ref=storage.ref(`anuncios/global/${Date.now()}_${file.name}`);let snap=await ref.put(file);let url=await snap.ref.getDownloadURL();document.getElementById('full_arte_'+idx).value=url;document.getElementById('full_prev_'+idx).src=url;listaFullTemp[idx].arte=url;status.innerText='✅ Arte enviada!';}catch(e){status.innerText='❌ Erro: '+e.message;}}
function salvarTempos(){let tempos={segRodape:parseInt(document.getElementById('segRodape').value)||5,esperaFull:parseInt(document.getElementById('esperaFull').value)||60,escalaFull:parseFloat(document.getElementById('escalaFull').value)||1};db.ref(CHAVE_TEMPOS).set(tempos).then(()=>{document.getElementById('statusAnuncioSave').innerText='✅ Tempos + Escala salvos!';FULL_ESCALA=tempos.escalaFull;FULL_TEMPO_ESPERA_SEG=tempos.esperaFull;RODAPE_TEMPO_EXIBICAO_SEG=tempos.segRodape;});}
function iniciarFirebase(){db.ref('.info/connected').on('value',snap=>{let el=document.getElementById('status');if(el) el.innerText=snap.val()?'Online: '+new Date().toLocaleTimeString():'Conectando...';});db.ref(NOME_BANCO).on('value',snap=>{ranking=[];historico=[];snap.forEach(c=>{let v=c.val();if(v&&v.contagem){ranking.push(v);historico.push(v);}});ranking.sort((a,b)=>b.pontos-a.pontos);if(modo==='tv'||modo==='celular') atualizarTela();else if(modo!=='adm'&&modo!=='anuncios') atualizarListaAdmin();});db.ref('CONFIG_ANUNCIOS').on('value',snap=>{let val=snap.val();if(val===null) val=true;anunciosLigados=val;let toggle=document.getElementById('toggleAnuncio');let status=document.getElementById('statusAnuncio');if(toggle) toggle.checked=val;if(status){status.innerText=val?'LIGADOS':'DESLIGADOS';status.style.color=val?'#00FF00':'#ff4444';}});db.ref(CHAVE_RODAPE).on('value',snap=>{if(snap.val()) PATROCINADORES_RODAPE=snap.val();});db.ref(CHAVE_FULL).on('value',snap=>{if(snap.val()){PATROCINADORES_FULL=snap.val();}});db.ref(CHAVE_TEMPOS).on('value',snap=>{if(snap.val()){let t=snap.val();RODAPE_TEMPO_EXIBICAO_SEG=t.segRodape||5;FULL_TEMPO_ESPERA_SEG=t.esperaFull||60;FULL_ESCALA=t.escalaFull||1;document.documentElement.style.setProperty('--full-scale',FULL_ESCALA);if(modo==='tv'||modo==='celular'){iniciarTimerFull();}}});}
function alternarAnuncios(){let toggle=document.getElementById('toggleAnuncio');db.ref('CONFIG_ANUNCIOS').set(toggle.checked);}
if(modo==='adm'){window.modoADMpendente=true;}
function montarLinksADM(){let base=window.location.href.split('?')[0];document.getElementById('links-adm').innerHTML=`<a class="link-adm" href="${base}?modo=tv" target="_blank">📺 TELÃO</a><a class="link-adm" href="${base}?modo=celular" target="_blank">📱 CELULAR</a><a class="link-adm" href="${base}" target="_blank">🎯 LANÇAMENTO</a><a class="link-adm" href="${base}?modo=adm" target="_blank">⚙️ ADM</a><a class="link-adm" href="${base}?modo=anuncios" target="_blank">📢 ANUNCIOS GLOBAL</a>`;}
function montarTabela(){let h="";for(let i=1;i<=10;i++) h+=`<tr><td>${i}º</td><td><input type="text" id="t${i}" onkeyup="proximoTiro(event,${i})" oninput="calcularParcial();this.classList.remove('erro')"></td></tr>`;document.getElementById('corpo-tabela').innerHTML=h;}
function proximoTiro(e,n){if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();if(n<10) document.getElementById('t'+(n+1)).focus();else document.getElementById('btnSalvar').focus();}}
function calcularParcial(){let t=0;for(let i=1;i<=10;i++){let el=document.getElementById('t'+i);if(el) t+=valorTiro(el.value);}document.getElementById('parcial').innerText=`TOTAL: ${t.toFixed(2)}`;}
function valorTiro(v){if(!v) return 0;v=v.toString().toUpperCase().trim();if(v==='X') return 12.01;let n=parseFloat(v.replace(',','.'));return isNaN(n)?0:n;}
function contarTiros(tiros){let c={x12_01:0,x10:0,x9:0,x8:0,x7:0,x6:0,x5:0,x4:0,x3:0,x2:0,x1:0,x0:0};tiros.forEach(t=>{let v=valorTiro(t);if(v===12.01) c.x12_01++;else c['x'+Math.floor(v)]++;});return c;}
function gerarID(){return 'serie_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);}
function lancarBase(){let nome=document.getElementById('nome').value.toUpperCase().trim();let prova=document.getElementById('prova').value.toUpperCase().trim();if(!nome||!prova) return alert("Preencha Nome e Prova");if(!validarTiros()) return;let tiros=[];let pts=0;for(let i=1;i<=10;i++){let v=document.getElementById('t'+i).value;tiros.push(v);pts+=valorTiro(v);}let cont=contarTiros(tiros);let id=editandoId?editandoId:gerarID();db.ref(NOME_BANCO+'/'+id).set({id,nome,prova,pontos:pts,tiros,contagem:cont,timestamp:Date.now()}).then(()=>{editandoId=null;novaSerie();});}
function atualizarListaAdmin(){
  let h="";if(historico.length==0){document.getElementById('lista-admin').innerHTML="<div style='color:#888;font-size:12px'>Nenhum</div>";return;}
  let crono=[...historico].sort((a,b)=>a.timestamp-b.timestamp);let mapaOrdem={};crono.forEach((a,i)=>{mapaOrdem[a.id]=i+1;});
  let lista=[...historico].sort((a,b)=>b.timestamp-a.timestamp);
  lista.forEach((a)=>{let cor=a.prova==='C'?'#00FF00':'#FFD700';let c=a.contagem;let num=mapaOrdem[a.id]||0;let linha2="";if(MODO_VISAO_LANCAMENTO==="TIROS"){linha2=`Tiros: ${(a.tiros||[]).join(' | ')}`;}else{linha2=`X:${c.x12_01||0} | 10:${c.x10||0} | 9:${c.x9||0} | 8:${c.x8||0} | 7:${c.x7||0} | 6:${c.x6||0} | 5:${c.x5||0} | 4:${c.x4||0} | 3:${c.x3||0} | 2:${c.x2||0} | 1:${c.x1||0} | 0:${c.x0||0}`;}
  h+=`<div class="item-admin"><div class="linha-principal"><span><b style="color:#FF8C00">${num}º</b> <b style="color:${cor};">${a.prova}</b> - ${a.nome} <b style="color:#FFD700;">${a.pontos.toFixed(2)}</b> <span style="font-size:9px;color:#bbb">${linha2}</span></span><span><button class="btn-mini btn-editar" onclick="editarSerie('${a.id}')">EDITAR</button><button class="btn-mini btn-excluir" onclick="excluirSerie('${a.id}')">EXCLUIR</button></span></div></div>`;});
  document.getElementById('lista-admin').innerHTML=h;
}
function editarSerie(id){let s=historico.find(x=>x.id===id);if(!s) return;editandoId=id;document.getElementById('nome').value=s.nome;document.getElementById('prova').value=s.prova;for(let i=0;i<10;i++){document.getElementById('t'+(i+1)).value=s.tiros[i]||'';}calcularParcial();document.getElementById('btnSalvar').innerText='ATUALIZAR';document.getElementById('btnSalvar').style.background='#FFD700';document.getElementById('btnSalvar').style.color='#000';document.getElementById('btnCancelar').style.display='inline-block';}
function cancelarEdicao(){editandoId=null;novaSerie();}
function novaSerie(){editandoId=null;document.getElementById('nome').value="";document.getElementById('prova').value="";for(let i=1;i<=10;i++){let el=document.getElementById('t'+i);if(el){el.value="";el.classList.remove('erro');}}document.getElementById('parcial').innerText="TOTAL: 0.00";document.getElementById('sugestoes').innerHTML='';document.getElementById('btnSalvar').innerText='SALVAR [F2]';document.getElementById('btnSalvar').style.background='#D2691E';document.getElementById('btnSalvar').style.color='#fff';document.getElementById('btnCancelar').style.display='none';document.getElementById('nome').focus();}
function excluirSerie(id){if(!confirm('Excluir?')) return;db.ref(NOME_BANCO+'/'+id).remove();}
function apagarPlacar(){if(!confirm('APAGAR PLACAR '+NOME_BANCO+'?')) return;db.ref(NOME_BANCO).remove().then(()=>{CONTADOR_ATLETAS={};localStorage.setItem('contador_atletas',JSON.stringify(CONTADOR_ATLETAS));alert('Apagado!');});}
function apagarListaAtletas(){if(!confirm('Apagar lista?')) return;localStorage.removeItem('lista_atletas');db.ref('LISTA_ATLETAS_GLOBAL').remove();LISTA_ATLETAS=[];atualizarInfoListaADM();alert('Apagada');}
function limparContadores(){if(confirm('Zerar C/R?')){CONTADOR_ATLETAS={};localStorage.setItem('contador_atletas',JSON.stringify(CONTADOR_ATLETAS));alert('Zerado!');}}
document.addEventListener('keydown',function(e){if(e.key==='F2'&&senhaOk){e.preventDefault();lancar();}if(e.key==='F3'&&senhaOk){e.preventDefault();novaSerie();}if(e.key==='F8'){e.preventDefault();mostrarInsercaoFull();}if(e.key==='Escape'){fecharErro();}});
function getRankingParaTV(lista){const ordenados=[...lista].sort((a,b)=>b.pontos-a.pontos);const topUnico=[];const vistos=new Set();for(let i=0;i<ordenados.length;i++){const item=ordenados[i];const chave=item.nome.trim().toUpperCase();if(!vistos.has(chave)){vistos.add(chave);topUnico.push({...item,originalPos:i+1,novaPos:topUnico.length+1,pulou:(i+1)-(topUnico.length+1)});}if(topUnico.length===5) break;}const idsTop=new Set(topUnico.map(t=>t.id));const resto=ordenados.filter(o=>!idsTop.has(o.id)).map(o=>({...o,originalPos:0,pulou:0}));return[...topUnico,...resto];}
function atualizarTela(){let html="";const rankingTV=getRankingParaTV(ranking);let max=(modo==='celular'?rankingTV.length:10);for(let i=0;i<max&&i<rankingTV.length;i++){let a=rankingTV[i];let tag="";if(a.originalPos&&a.pulou>0){tag=`<span class="reorg">↑ era ${a.originalPos}º → ${a.novaPos}º</span>`;}let todosTiros=(a.tiros||[]).join(' | ');let estiloTotal=i<3?'color:#000!important;font-weight:900':'color:#FFD700!important';let estiloDetalhe=i<3?'color:#000!important;font-weight:900':'color:#ccc!important';html+=`<div class="placar ${i==0?'p1':i==1?'p2':i==2?'p3':''}"><span class="pos">${i+1}º</span><span class="nome">${a.nome} ${tag}</span><span class="prova">P:${a.prova}</span><span class="total" style="${estiloTotal}">${a.pontos.toFixed(2)}</span><span class="detalhe" style="${estiloDetalhe}">${todosTiros}</span></div>`;}document.getElementById('lista').innerHTML=html||"<div class='placar'>AGUARDANDO</div>";}
let LISTA_ATLETAS=null;let CONTADOR_ATLETAS=JSON.parse(localStorage.getItem('contador_atletas')||'{}');
function atualizarInfoLista(){const el=document.getElementById('infoLista');if(el) el.innerHTML=LISTA_ATLETAS&&LISTA_ATLETAS.length?`✅ ${LISTA_ATLETAS.length} atletas`:'';}
function atualizarInfoListaADM(){const el=document.getElementById('infoListaADM');const prev=document.getElementById('previewLista');if(!el) return;if(LISTA_ATLETAS&&LISTA_ATLETAS.length){el.innerHTML=`✅ ${LISTA_ATLETAS.length}`;if(prev) prev.innerHTML=LISTA_ATLETAS.slice(0,80).join('<br>');}else{el.innerHTML='❌ Nenhuma';if(prev) prev.innerHTML='';}atualizarInfoLista();}
function obterProvaAuto(nome){nome=nome.toUpperCase().trim();let cont=CONTADOR_ATLETAS[nome]||0;if(cont===0) return "C";if(cont>=17) return "R17+";return "R"+cont;}
function iniciarListaAtletas(){let local=JSON.parse(localStorage.getItem('lista_atletas')||'null');if(local&&local.length>0){LISTA_ATLETAS=local;atualizarInfoLista();db.ref('LISTA_ATLETAS_GLOBAL').once('value',snap=>{if(snap.val()&&snap.val().length>0){let fb=snap.val();if(fb.length>LISTA_ATLETAS.length){LISTA_ATLETAS=fb;localStorage.setItem('lista_atletas',JSON.stringify(LISTA_ATLETAS));atualizarInfoLista();}}});}else{db.ref('LISTA_ATLETAS_GLOBAL').once('value',snap=>{if(snap.val()&&snap.val().length>0){LISTA_ATLETAS=snap.val();localStorage.setItem('lista_atletas',JSON.stringify(LISTA_ATLETAS));}else{LISTA_ATLETAS=LISTA_TESTE;localStorage.setItem('lista_atletas',JSON.stringify(LISTA_ATLETAS));}atualizarInfoLista();});}}
function iniciarListaAtletasADM(){let local=JSON.parse(localStorage.getItem('lista_atletas')||'null');if(local&&local.length>0) LISTA_ATLETAS=local;db.ref('LISTA_ATLETAS_GLOBAL').once('value',snap=>{if(snap.val()&&snap.val().length>0){LISTA_ATLETAS=snap.val();localStorage.setItem('lista_atletas',JSON.stringify(LISTA_ATLETAS));}if(!LISTA_ATLETAS) LISTA_ATLETAS=LISTA_TESTE;atualizarInfoListaADM();});}
function setupUpload(id){let el=document.getElementById(id);if(!el) return;el.addEventListener('change',function(e){const file=e.target.files[0];if(!file) return;const reader=new FileReader();reader.onload=function(ev){let lista=ev.target.result.split(/\r?\n/).map(l=>l.trim().toUpperCase()).filter(Boolean);lista=[...new Set(lista)];LISTA_ATLETAS=lista;localStorage.setItem('lista_atletas',JSON.stringify(LISTA_ATLETAS));db.ref('LISTA_ATLETAS_GLOBAL').set(LISTA_ATLETAS);atualizarInfoListaADM();atualizarInfoLista();alert(`✅ ${LISTA_ATLETAS.length} nomes`);};reader.readAsText(file,'UTF-8');});}setupUpload('carregarListaADM');
const inputNome=document.getElementById('nome');const divSugestoes=document.getElementById('sugestoes');if(inputNome){inputNome.addEventListener('input',function(){const termo=this.value.toUpperCase().trim();divSugestoes.innerHTML='';if(termo.length<2||!LISTA_ATLETAS) return;const filtrados=LISTA_ATLETAS.filter(n=>n.includes(termo)).slice(0,12);filtrados.forEach(nome=>{const cont=CONTADOR_ATLETAS[nome]||0;let label=cont==0?'C':(cont>=17?`R17+ (${cont})`:`R${cont}`);let cor=cont==0?'#00FF00':(cont>=3?'#FF4444':'#FFD700');const d=document.createElement('div');d.style.cssText='padding:6px 8px;cursor:pointer;border-bottom:1px solid #444;font-size:12px;color:#fff;display:flex;justify-content:space-between;';d.innerHTML=`<span>${nome}</span><span style="color:${cor};font-weight:bold">[${label}]</span>`;d.onclick=()=>{inputNome.value=nome;divSugestoes.innerHTML='';document.getElementById('prova').value=obterProvaAuto(nome);document.getElementById('t1').focus();};divSugestoes.appendChild(d);});});inputNome.addEventListener('blur',function(){setTimeout(()=>{let nome=this.value.toUpperCase().trim();if(nome.length>2&&!document.getElementById('prova').value){document.getElementById('prova').value=obterProvaAuto(nome);}},200);});document.addEventListener('click',(e)=>{if(!divSugestoes.contains(e.target)&&e.target!==inputNome) divSugestoes.innerHTML='';});}
function lancar(){let nomeEl=document.getElementById('nome');let provaEl=document.getElementById('prova');let nome=nomeEl.value.toUpperCase().trim();if(!nome) return alert("Preencha Nome");if(!provaEl.value.trim()) provaEl.value=obterProvaAuto(nome);let prova=provaEl.value.toUpperCase().trim();if(!prova) return alert("Preencha Prova");if(!validarTiros()) return;CONTADOR_ATLETAS[nome]=(CONTADOR_ATLETAS[nome]||0)+1;localStorage.setItem('contador_atletas',JSON.stringify(CONTADOR_ATLETAS));lancarBase();}
let ultimoInputFocado=null;
document.addEventListener('focusin',e=>{if(e.target.tagName==='INPUT' && e.target.type==='text') ultimoInputFocado=e.target;});
function inserirEmoji(emoji){if(ultimoInputFocado){let start=ultimoInputFocado.selectionStart;let end=ultimoInputFocado.selectionEnd;let txt=ultimoInputFocado.value;ultimoInputFocado.value=txt.substring(0,start)+emoji+txt.substring(end);ultimoInputFocado.selectionStart=ultimoInputFocado.selectionEnd=start+emoji.length;ultimoInputFocado.focus();}else{navigator.clipboard.writeText(emoji);}}
</script></body></html>
