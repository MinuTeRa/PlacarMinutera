<!DOCTYPE html><html><head><meta charset="UTF-8"><title>3x7 MinuT&Ra - FTERJ - V25 FIX</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#121212;color:#fff;font-family:Arial}
#topo{background:linear-gradient(90deg,#FF8C00,#FF6A00);padding:10px;display:flex;align-items:center;justify-content:space-between}
#topo h1{color:#000;font-weight:900;font-size:22px}
#logosTop{display:flex;gap:10px;align-items:center}
#logosTop img{height:40px;background:#fff;border-radius:6px;padding:2px 6px}
#main{display:flex;gap:10px;padding:10px}
#esq{width:32%;background:#1e1e1e;padding:12px;border-radius:8px}
#dir{flex:1;background:#1e1e1e;padding:12px;border-radius:8px;max-height:85vh;overflow:auto}
input,select{width:100%;padding:8px;background:#000;color:#fff;border:1px solid #444;border-radius:4px;margin-top:4px}
.linha-tiro{display:flex;gap:8px;align-items:center;margin-top:6px}
.linha-tiro b{width:30px}
.btn{padding:8px 12px;border:none;border-radius:6px;font-weight:900;cursor:pointer;margin-top:8px}
.btn-laranja{background:#FF8C00;color:#000}.btn-cinza{background:#444;color:#fff}
.item-lanc{display:flex;justify-content:space-between;align-items:center;background:#2a2a2a;padding:8px;border-radius:6px;margin-top:6px;border-left:3px solid #FF8C00}
.badge-prova{background:#FF8C00;color:#000;padding:2px 6px;border-radius:4px;font-weight:900;font-size:11px;margin-right:4px}
.btn-editar{background:#FFD700;color:#000;padding:4px 8px;border:none;border-radius:4px;font-weight:900;cursor:pointer;font-size:11px}
.btn-excluir{background:#ff4444;color:#fff;padding:4px 8px;border:none;border-radius:4px;font-weight:900;cursor:pointer;font-size:11px;margin-left:4px}
</style></head><body>
<div id="topo">
<h1>3x7 MinuT&Ra - FTERJ</h1>
<div id="logosTop">
<img id="logoMinuTop" src="" style="display:none">
<img id="logoClubeTop" src="" style="display:none">
<div><a href="adm.html" style="color:#000;font-weight:900;text-decoration:none">ADM</a> | <a href="tv.html" style="color:#000;font-weight:900;text-decoration:none">TV</a></div>
</div>
</div>

<div id="main">
<div id="esq">
<label>CLUBE: FTERJ | <span id="statusConexao">...</span></label>
<div style="display:flex;gap:6px">
<input id="nomeAtleta" list="listaNomes" placeholder="MAURI" autocomplete="off" style="text-transform:uppercase">
<datalist id="listaNomes"></datalist>
<select id="provaSelect" style="width:90px">
<option value="C">C</option>
<option value="R1">R1</option>
<option value="R2">R2</option>
<option value="R3">R3</option>
<option value="R4">R4</option>
<option value="R5">R5</option>
<option value="C/R">C/R</option>
</select>
</div>

<div style="display:flex;justify-content:space-between;margin-top:10px;font-weight:900;color:#FF8C00"><span>TIRO</span><span>VALOR</span></div>
<div id="tirosContainer"></div>
<div style="margin-top:10px;color:#00BFFF;font-weight:900">TOTAL: <span id="totalPontos">0.00</span></div>
<button class="btn btn-laranja" onclick="salvarLancamento()">SALVAR [F2]</button>
<button class="btn btn-cinza" onclick="novoLancamento()">NOVA [F3]</button>
</div>

<div id="dir">
<div id="listaLancamentos">Carregando...</div>
</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let editKey=null;

function toArr(o){ if(!o) return []; return Object.keys(o).map(k=>({key:k,...o[k]})); }

// 1. LOGOS - CORRIGIDO
db.ref("CONFIG_ANUNCIOS_FTERJ").on('value',s=>{
 let v=s.val()||{};
 if(v.logoMinu){ document.getElementById('logoMinuTop').src=v.logoMinu; document.getElementById('logoMinuTop').style.display='block'; }
 if(v.logoClube){ document.getElementById('logoClubeTop').src=v.logoClube; document.getElementById('logoClubeTop').style.display='block'; }
});

// 2. AUTOCOMPLETE - CORRIGIDO
let todosNomes = new Set();
db.ref("FTERJ").on('value',snap=>{
 let data=snap.val()||{};
 let lista=toArr(data).filter(x=>x.key.startsWith('serie_'));
 let datalist=document.getElementById('listaNomes');
 let nomesHtml="";
 lista.forEach(s=>{
   if(s.nome) todosNomes.add(s.nome.toUpperCase().trim());
 });
 datalist.innerHTML = Array.from(todosNomes).map(n=>`<option value="${n}">`).join('');
 document.getElementById('statusConexao').innerText = lista.length+" lançamentos";
 renderLista(lista);
});

// 3. TIROS
function criarCamposTiros(){
 let c=document.getElementById('tirosContainer'); c.innerHTML="";
 for(let i=1;i<=10;i++){
   c.innerHTML+=`<div class="linha-tiro"><b>${i}°</b><input id="t${i}" list="valoresTiro" placeholder="" oninput="calcTotal()" autocomplete="off"></div>`;
 }
 c.innerHTML+=`<datalist id="valoresTiro"><option value="X"><option value="10"><option value="9"><option value="8"><option value="7"><option value="6"><option value="5"><option value="4"><option value="3"><option value="2"><option value="1"><option value="0"></datalist>`;
}
criarCamposTiros();

function valorTiro(v){
 v=String(v).trim().toUpperCase();
 if(v=='X' || v=='10') return 10;
 if(v=='' ) return 0;
 let n=parseFloat(v); return isNaN(n)?0:n;
}
function calcTotal(){
 let tot=0;
 for(let i=1;i<=10;i++){ tot+=valorTiro(document.getElementById('t'+i).value); }
 document.getElementById('totalPontos').innerText=tot.toFixed(2);
 return tot;
}

// 4. SALVAR COM C/R - CORRIGIDO
function salvarLancamento(){
 let nome=document.getElementById('nomeAtleta').value.toUpperCase().trim();
 let prova=document.getElementById('provaSelect').value;
 if(!nome) return alert("Digite nome");
 let tiros=[];
 for(let i=1;i<=10;i++) tiros.push(document.getElementById('t'+i).value.toUpperCase().trim()||"0");
 let pontos=calcTotal();
 // Calcula X,10,9 para contagem
 let x=tiros.filter(t=>t=='X').length;
 let dez=tiros.filter(t=>t=='10').length;
 let nove=tiros.filter(t=>t=='9').length;

 let obj={nome, prova, tiros, pontos, contagem:{x10:x,"10":dez,"9":nove}, data:Date.now()};

 if(editKey){
   db.ref("FTERJ/"+editKey).update(obj).then(()=>{ alert("Atualizado!"); editKey=null; novoLancamento(); });
 } else {
   db.ref("FTERJ").push({["serie_"+Date.now()]:obj}).once('value').then(()=>{});
   // Compatível com seu banco antigo que usa serie_ direto
   db.ref("FTERJ/serie_"+Date.now()).set(obj);
   novoLancamento();
 }
}

function novoLancamento(){
 editKey=null;
 document.getElementById('nomeAtleta').value="";
 for(let i=1;i<=10;i++) document.getElementById('t'+i).value="";
 document.getElementById('totalPontos').innerText="0.00";
 document.getElementById('nomeAtleta').focus();
}

// 5. LISTA + BOTAO EXCLUIR CORRIGIDO + REGISTRO C/R CORRIGIDO
function renderLista(lista){
 lista.sort((a,b)=>(b.data||0)-(a.data||0));
 let html="";
 lista.forEach(item=>{
   // Seu banco tem objeto dentro de serie_
   let dados=item;
   if(item.key && item.key.startsWith('serie_') && Object.keys(item).length==1) { dados = item[Object.keys(item)[0]] || item; }
   // Se veio direto como serie_XXX
   let real = dados.nome? dados : (dados[Object.keys(dados).find(k=>k.nome)] || dados);
   // fallback: se item já é o objeto serie
   let nome = dados.nome || item.nome || "SEM NOME";
   let prova = dados.prova || item.prova || "R2";
   let pontos = parseFloat(dados.pontos || item.pontos || 0).toFixed(2);
   let tirosStr = (dados.tiros||item.tiros||[]).join(' | ');
   let key = item.key;

   // CORREÇÃO C/R - mostra badge correto
   let badgeClass = prova=="C/R"? "background:#00E5FF;color:#000" : "";
   html+=`<div class="item-lanc">
     <div><span class="badge-prova" style="${badgeClass}">${prova}</span><b>${nome}</b> <span style="color:#FFD700">${pontos}</span> <span style="font-size:10px;color:#aaa">${tirosStr}</span></div>
     <div><button class="btn-editar" onclick="editarLanc('${key}')">EDITAR</button><button class="btn-excluir" onclick="excluirLanc('${key}')">X</button></div>
   </div>`;
 });
 document.getElementById('listaLancamentos').innerHTML=html||"Nenhum lançamento";
}

function editarLanc(key){
 db.ref("FTERJ/"+key).once('value',s=>{
  let v=s.val(); if(!v) return;
  // Se v tem sub-chave
  if(v.nome==undefined){ let k=Object.keys(v)[0]; v=v[k]; }
  document.getElementById('nomeAtleta').value=v.nome||"";
  document.getElementById('provaSelect').value=v.prova||"R2";
  (v.tiros||[]).forEach((t,i)=>{ if(document.getElementById('t'+(i+1))) document.getElementById('t'+(i+1)).value=t; });
  calcTotal();
  editKey=key;
 });
}

// EXCLUIR - CORRIGIDO - AGORA FUNCIONA
function excluirLanc(key){
 if(!confirm("Excluir lançamento "+key+"?")) return;
 db.ref("FTERJ/"+key).remove().then(()=>{ alert("Excluído!"); }).catch(e=>alert("Erro: "+e.message));
}

// F2 SALVAR F3 NOVO
document.addEventListener('keydown',e=>{ if(e.key=='F2'){e.preventDefault(); salvarLancamento();} if(e.key=='F3'){e.preventDefault(); novoLancamento();} });

// AUTOCOMPLETE ao digitar nome -> preenche prova se já existir
document.getElementById('nomeAtleta').addEventListener('change',()=>{
 let nome=document.getElementById('nomeAtleta').value.toUpperCase().trim();
 db.ref("FTERJ").once('value',snap=>{
   let data=snap.val()||{};
   Object.values(data).forEach(serie=>{
     let s=serie;
     if(serie.nome==undefined && typeof serie=='object'){ let k=Object.keys(serie)[0]; if(serie[k] && serie[k].nome) s=serie[k]; }
     if(s.nome && s.nome.toUpperCase().trim()==nome){
       document.getElementById('provaSelect').value=s.prova||"R2";
     }
   });
 });
});
</script></body></html>
