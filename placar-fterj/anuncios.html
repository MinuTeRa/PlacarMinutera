<script src="./firebase-config.js?v=17.1"></script>
<script>
// LEITURA BLINDADA - lê FTERJ e GLOBAL
let RODAPES=[]; let FULL=[];
function paraArray(d){ if(!d) return []; if(Array.isArray(d)) return d; if(d.rodapes) return d.rodapes; return Object.values(d); }

db.ref("PATROCINADORES_RODAPE_FTERJ").on('value', s=>{
  let a=paraArray(s.val());
  if(a.length>0){ RODAPES=a; render(); console.log("Lido FTERJ",a); }
  else {
    db.ref("CONFIG_RODAPE_GLOBAL").once('value', sg=>{
      let b=paraArray(sg.val());
      if(b.length>0){ RODAPES=b; render(); 
        document.getElementById('status').innerText="↪️ Carregado do GLOBAL - clique SALVAR pra fixar";
      }
    });
  }
});
</script>
