<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ANUNCIOS - FTERJ V16.5</title>
<style>html,body{background:#111;color:#fff;font-family:Arial;margin:0}.tela-anuncios{background:#111;min-height:100vh;padding:20px;box-sizing:border-box;padding-bottom:120px}.card-adm{background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:20px;margin:15px auto;max-width:900px;text-align:left}.linha-config{display:flex;gap:15px;align-items:center;background:#222;padding:10px;border-radius:8px;margin:10px 0;flex-wrap:wrap}.linha-config input{width:70px;padding:8px;border-radius:6px;background:#000;color:#FFD700;border:1px solid #444;text-align:center;font-weight:bold}.box-anuncio{background:#1e1e1e;border:1px solid #444;border-radius:8px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.box-anuncio input[type=text]{padding:8px;border-radius:6px;background:#000;color:#fff;border:1px solid #444;flex:1;min-width:150px}.box-anuncio input.tempo{width:60px;flex:none}.preview-arte{width:120px;height:70px;background:#000;border:1px solid #555;object-fit:contain}button{padding:8px 12px;border-radius:6px;border:none;font-weight:bold;cursor:pointer}.btn-lancar{background:#D2691E;color:#fff}</style></head><body><div class="tela-anuncios"><h1 style="color:#FFD700;">📢 ANUNCIOS V16.5 - FTERJ</h1><div class="card-adm"><div class="linha-config"><label>Rodapé s: <input type="number" id="segRodape" value="5"></label><label>Full s: <input type="number" id="esperaFull" value="60"></label><label>Escala: <input type="range" id="escalaFull" min="0.6" max="1.4" step="0.05" value="1" oninput="document.getElementById('valEscala').innerText=Math.round(this.value*100)+'%'"><span id="valEscala">100%</span></label></div><div class="linha-config" style="border:2px solid #FFD700"><b>RODAPÉ:</b><label>PROP px: <input type="number" id="fonteProp" value="52" style="border:2px solid #FFD700;width:80px"></label><label>CONT px: <input type="number" id="fonteCont" value="36" style="border:2px solid #00FFFF;width:80px"></label><button class="btn-lancar" onclick="salvarTempos()" style="background:#2196F3">💾 SALVAR</button></div><div id="statusAnuncioSave" style="color:#81C784"></div></div><div class="card-adm"><h2>🟠 RODAPÉS</h2><div id="containerRodapes"></div><button class="btn-lancar" onclick="adicionarRodape()">+ RODAPÉ</button><button class="btn-lancar" onclick="salvarRodapes()" style="background:#00C853">SALVAR</button></div><div class="card-adm"><h2>🟡 FULL</h2><div id="containerFull"></div><button class="btn-lancar" onclick="adicionarFull()">+ FULL</button><button class="btn-lancar" onclick="salvarFulls()" style="background:#00C853">SALVAR</button></div></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script><script src="firebase-config.js"></script>
<script>firebase.initializeApp(firebaseConfig);const db=firebase.database();const storage=firebase.storage();let listaRodapeTemp=[],listaFullTemp=[];function carregarAnunciosTela(){db.ref(CHAVE_TEMPOS).once('value',s=>{if(s.val()){let t=s.val();document.getElementById('segRodape').value=t.segRodape||5;document.getElementById('esperaFull').value=t.esperaFull||60;document.getElementById('escalaFull').value=t.escalaFull||1;document.getElementById('valEscala').innerText=Math.round((t.escalaFull||1)*100)+'%';document.getElementById('fonteProp').value=t.fonteProp||52;document.getElementById('fonteCont').value=t.fonteCont||36;}});db.ref(CHAVE_RODAPE).once('value',s=>{listaRodapeTemp=s.val()||[];renderRodapes();});db.ref(CHAVE_FULL).once('value',s=>{listaFullTemp=s.val()||[];renderFulls();});}carregarAnunciosTela();function renderRodapes(){let c=document.getElementById('containerRodapes');c.innerHTML='';listaRodapeTemp.forEach((d,i)=>{c.innerHTML+=`<div class="box-anuncio"><b>#${i+1}</b><input type="text" id="rod_prop_${i}" value="${d.prop||''}"><input type="text" id="rod_cont_${i}" value="${d.contato||''}"><button onclick="listaRodapeTemp.splice(${i},1);renderRodapes();" style="background:#c00;color:#fff">X</button></div>`;});}function adicionarRodape(){listaRodapeTemp.push({prop:'',contato:''});renderRodapes();}function salvarRodapes(){let lista=[];listaRodapeTemp.forEach((_,i)=>{let p=document.getElementById('rod_prop_'+i)?.value||'';let co=document.getElementById('rod_cont_'+i)?.value||'';if(p||co) lista.push({prop:p,contato:co});});db.ref(CHAVE_RODAPE).set(lista).then(()=>{document.getElementById('statusAnuncioSave').innerText='✅ Rodapés salvos';});}function renderFulls(){let c=document.getElementById('containerFull');c.innerHTML='';listaFullTemp.forEach((d,i)=>{c.innerHTML+=`<div class="box-anuncio"><b>#${i+1}</b><input type="text" id="full_prop_${i}" value="${d.prop||''}"><input type="file" onchange="uploadArte(${i},this)"><img id="full_prev_${i}" class="preview-arte" src="${d.arte||''}"><input type="hidden" id="full_arte_${i}" value="${d.arte||''}"><input type="number" class="tempo" id="full_tempo_${i}" value="${d.tempo||7}"><button onclick="listaFullTemp.splice(${i},1);renderFulls();" style="background:#c00;color:#fff">X</button></div>`;});}function adicionarFull(){listaFullTemp.push({prop:'',arte:'',tempo:7});renderFulls();}function salvarFulls(){let lista=[];listaFullTemp.forEach((_,i)=>{let p=document.getElementById('full_prop_'+i)?.value||'';let a=document.getElementById('full_arte_'+i)?.value||'';let t=parseInt(document.getElementById('full_tempo_'+i)?.value)||7;if(p||a) lista.push({prop:p,arte:a,tempo:t});});db.ref(CHAVE_FULL).set(lista).then(()=>{document.getElementById('statusAnuncioSave').innerText='✅ Full salvos';});}async function uploadArte(idx,input){let file=input.files[0];if(!file) return;let ref=storage.ref(`anuncios/global/${Date.now()}_${file.name}`);let snap=await ref.put(file);let url=await snap.ref.getDownloadURL();document.getElementById('full_arte_'+idx).value=url;document.getElementById('full_prev_'+idx).src=url;listaFullTemp[idx].arte=url;}function salvarTempos(){let tempos={segRodape:parseInt(document.getElementById('segRodape').value)||5,esperaFull:parseInt(document.getElementById('esperaFull').value)||60,escalaFull:parseFloat(document.getElementById('escalaFull').value)||1,fonteProp:parseInt(document.getElementById('fonteProp').value)||52,fonteCont:parseInt(document.getElementById('fonteCont').value)||36};db.ref(CHAVE_TEMPOS).set(tempos).then(()=>{document.getElementById('statusAnuncioSave').innerText='✅ Tempos e fontes salvos';});}</script></body></html>
