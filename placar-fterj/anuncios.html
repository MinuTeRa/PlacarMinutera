<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ANUNCIOS V17.1 FIX - FTERJ</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>body{background:#111;color:#fff;font-family:Arial;padding:12px}.card{background:#222;padding:12px;border-radius:10px;margin-bottom:12px;border:1px solid #333} input{background:#111;border:1px solid #444;color:#ffcc00;padding:8px;border-radius:6px;width:120px;margin-right:6px} input.lg{width:260px} button{padding:8px 14px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}.btnO{background:#FF8C00;color:#000}.btnG{background:#4CAF50;color:#000}.btnB{background:#2196F3;color:#fff}.item{background:#111;padding:8px;border-radius:6px;margin:5px 0;display:flex;justify-content:space-between;border:1px solid #333}#log{background:#000;color:#0f0;padding:8px;border-radius:6px;font-size:11px;white-space:pre-wrap;max-height:150px;overflow:auto}</style>
</head><body>
<h2 style="color:#FFD700">📢 ANUNCIOS V17.1 FIX <a href="./index.html" style="color:#fff;font-size:13px">VOLTAR</a> <span id="status" style="color:#0f0;font-size:12px"></span></h2>
<div id="log">Iniciando...</div>
<div class="card">Rodapé s: <input id="tRodape" type="number" value="5"> Full s: <input id="tFull" type="number" value="60"> Escala: <input id="escala" type="range" min="50" max="150" value="100" oninput="valEsc.innerText=this.value+'%'"><span id="valEsc">100%</span><br><br>PROP px: <input id="propPx" type="number" value="52"> CONT px: <input id="contPx" type="number" value="36"><button class="btnB" onclick="salvarConfig()">💾 SALVAR</button></div>
<div class="card"><h3>🟠 RODAPÉS</h3><input id="propRodape" class="lg" placeholder="TAF Consultoria"><input id="contRodape" class="lg" placeholder="Contato"><button class="btnO" onclick="addRodape()">+ RODAPÉ</button><button class="btnG" onclick="salvarRodapes()">SALVAR</button><div id="listaRodape"></div></div>
<div class="card"><h3>🟡 FULL</h3><input id="nomeFull" placeholder="Nome"><input id="propFull" class="lg" placeholder="Texto"><input id="tempoFull" type="number" value="7" style="width:60px"><input id="fileFull" type="file" accept="image/*" style="width:180px"><button class="btnO" onclick="addFull()">+ FULL</button><button class="btnG" onclick="salvarFull()">SALVAR</button><div id="listaFull"></div></div>
<script>
const NOME_BANCO="FTERJ";
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera",storageBucket:"placar-minutera.firebasestorage.app",messagingSenderId:"689991648080",appId:"1:689991648080:web:9deeb958183eae23e255"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
function log(t){ document.getElementById('log').innerHTML+=t+"\n"; console.log(t); }
function toArr(d){ if(!d) return []; if(Array.isArray(d)) return d.filter(x=>x); if(typeof d==='object'){ let vals=Object.values(d); if(vals.length>0 && typeof vals[0]==='object') return vals.filter(x=>x); } return []; }
let RODAPES=[], FULL=[], CONFIG={rodapes:5,full:60,escala:100,propPx:52,contPx:36};
function aplicar(){ tRodape.value=CONFIG.rodapes; tFull.value=CONFIG.full; escala.value=CONFIG.escala; valEsc.innerText=CONFIG.escala+'%'; propPx.value=CONFIG.propPx; contPx.value=CONFIG.contPx; }
function renderRodape(){ listaRodape.innerHTML=""; RODAPES.forEach((r,i)=>{ let d=document.createElement('div'); d.className="item"; d.innerHTML=`<span><b>${r.prop||r.propaganda||r.nome||''}</b> - ${r.contato||r.cont||''}</span><button onclick="delRodape(${i})" style="background:#f44;color:#fff">X</button>`; listaRodape.appendChild(d); }); }
function renderFull(){ listaFull.innerHTML=""; FULL.forEach((f,i)=>{ let d=document.createElement('div'); d.className="item"; d.innerHTML=`<span><b>${f.nome||''}</b> - ${f.prop||f.texto||''} (${f.tempo||7}s) ${f.arte?'🖼️':''}</span><button onclick="delFull(${i})" style="background:#f44;color:#fff">X</button>`; listaFull.appendChild(d); }); }
log("Conectando FTERJ...");
db.ref("PATROCINADORES_RODAPE_FTERJ").once('value').then(s=>{ let a=toArr(s.val()); log("FTERJ RODAPE: "+a.length+" itens"); if(a.length>0){RODAPES=a; renderRodape(); status.innerText="✅ FTERJ "+a.length;} else { return db.ref("CONFIG_RODAPE_GLOBAL").once('value').then(sg=>{ let b=toArr(sg.val()); log("GLOBAL RODAPE: "+b.length+" itens -> "+JSON.stringify(b).substring(0,300)); if(b.length>0){RODAPES=b; renderRodape(); status.innerText="↪️ Veio do GLOBAL "+b.length+" clique SALVAR";}}); } });
db.ref("PATROCINADORES_FULL_FTERJ").once('value').then(s=>{ let a=toArr(s.val()); log("FTERJ FULL: "+a.length); if(a.length>0){FULL=a; renderFull();} else { db.ref("CONFIG_FULL_GLOBAL").once('value').then(sg=>{ let b=toArr(sg.val()); log("GLOBAL FULL: "+b.length); if(b.length>0){FULL=b; renderFull();}}); } });
db.ref("CONFIG_ANUNCIOS_FTERJ").once('value').then(s=>{ if(s.val()){CONFIG={...CONFIG,...s.val()}; aplicar(); log("Config FTERJ OK"); }});
function salvarConfig(){ CONFIG={rodapes:parseInt(tRodape.value),full:parseInt(tFull.value),escala:parseInt(escala.value),propPx:parseInt(propPx.value),contPx:parseInt(contPx.value)}; db.ref("CONFIG_ANUNCIOS_FTERJ").set(CONFIG).then(()=>{ status.innerText="✅ Config salva"; }); }
function addRodape(){ let p=propRodape.value.trim(); let c=contRodape.value.trim(); if(!p) return alert("Prop"); RODAPES.push({prop:p,contato:c}); propRodape.value=""; contRodape.value=""; renderRodape(); }
function delRodape(i){ RODAPES.splice(i,1); renderRodape(); }
function salvarRodapes(){ db.ref("PATROCINADORES_RODAPE_FTERJ").set(RODAPES).then(()=>db.ref("CONFIG_RODAPE_GLOBAL").set(RODAPES)).then(()=>{ alert("Salvo FTERJ+GLOBAL!"); }); }
function addFull(){ let n=nomeFull.value.trim(); let p=propFull.value.trim(); let t=parseInt(tempoFull.value)||7; let f=fileFull.files[0]; if(!n) return alert("Nome"); if(f){ let r=new FileReader(); r.onload=e=>{ FULL.push({nome:n,prop:p,tempo:t,arte:e.target.result,ativo:true}); renderFull(); }; r.readAsDataURL(f); } else { FULL.push({nome:n,prop:p,tempo:t,arte:"",ativo:true}); renderFull(); } }
function delFull(i){ FULL.splice(i,1); renderFull(); }
function salvarFull(){ db.ref("PATROCINADORES_FULL_FTERJ").set(FULL).then(()=>db.ref("CONFIG_FULL_GLOBAL").set(FULL)).then(()=>alert("Full salvo!")); }
</script></body></html>
