<!DOCTYPE html><html><head><meta charset="UTF-8"><title>TV FTERJ V17.4 - FINAL</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;overflow:hidden;height:100vh}
#topo{height:8vh;background:#111;display:flex;align-items:center;justify-content:space-between;padding:0 2vw;border-bottom:3px solid #FFD700}
#topo h1{color:#FFD700;font-size:3vh}
#placar{height:80vh;overflow-y:auto;padding:1vh 1vw;display:flex;flex-wrap:wrap;gap:1vw;align-content:flex-start;justify-content:center}
.card{background:linear-gradient(145deg,#1a1a1a,#222);border:2px solid #333;border-radius:12px;padding:10px;min-width:280px;max-width:400px;flex:1}
.card.destaque{border-color:#FFD700;box-shadow:0 0 15px rgba(255,215,0,0.3)}
.nome{font-size:2.2vh;font-weight:900;color:#FFD700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:1.6vh;opacity:0.7}
.tiros{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap}
.tiro{width:32px;height:32px;background:#000;border:1px solid #444;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.8vh}
.tiro.x10{background:#FFD700;color:#000;border-color:#FFD700}
.tiro.x9{background:#FF8C00;color:#000}
.pontos{font-size:4vh;font-weight:900;text-align:right;color:#0f0}
.prova{display:inline-block;background:#FFD700;color:#000;padding:2px 8px;border-radius:4px;font-weight:900;font-size:1.5vh}
#rodape{position:fixed;bottom:0;width:100%;height:12vh;background:linear-gradient(90deg,#FF8C00,#FFD700);color:#000;display:flex;align-items:center;overflow:hidden;white-space:nowrap;font-weight:bold;z-index:100}
#rodape span{padding-left:100%;animation:marquee 30s linear infinite;display:flex;align-items:center;gap:30px}
@keyframes marquee{0%{transform:translate(0,0)}100%{transform:translate(-100%,0)}}
#full{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:9999;flex-direction:column}
#full img{max-width:85%;max-height:75%;border:6px solid gold;border-radius:20px}
</style>
</head><body>
<div id="topo"><h1>🏆 FTERJ - TIRO ESPORTIVO</h1><div id="contador" style="font-size:2vh;opacity:0.8">Aguardando...</div></div>
<div id="placar">CARREGANDO SERIES FTERJ...</div>
<div id="rodape"><span id="textoRodape">Carregando patrocinadores FTERJ...</span></div>
<div id="full" onclick="this.style.display='none'"><img id="imgFull"><div id="txtFull" style="color:gold;margin-top:15px;font-size:3vh;font-weight:bold"></div><div style="color:#fff;margin-top:5px">Toque para fechar</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
function toArr(d){ if(!d) return []; if(Array.isArray(d)) return d.filter(x=>x); if(typeof d==='object') return Object.values(d).filter(x=>x&&typeof x==='object'); return []; }
let RODAPES=[], FULL=[], CFG={rodapes:5,full:60,propPx:52,contPx:36,escala:100}, idxR=0, idxF=0;

function renderRodape(){
 if(RODAPES.length==0){ textoRodape.innerHTML="FTERJ - SEM PATROCINADORES"; return; }
 let r=RODAPES[idxR%RODAPES.length];
 let pSize=Math.round((CFG.propPx||52)*(CFG.escala||100)/100);
 let cSize=Math.round((CFG.contPx||36)*(CFG.escala||100)/100);
 textoRodape.innerHTML=`<span style="font-size:${pSize}px">⭐ ${r.prop||r.propaganda||''}</span><span style="font-size:${cSize}px;opacity:0.85">📞 ${r.contato||''}</span><span style="margin:0 30px">|</span>`.repeat(6);
 idxR++;
}
db.ref("PATROCINADORES_RODAPE_FTERJ").on('value',s=>{ let a=toArr(s.val()); if(a.length>0){RODAPES=a; renderRodape();} });
db.ref("PATROCINADORES_FULL_FTERJ").on('value',s=>{ FULL=toArr(s.val()); });
db.ref("CONFIG_ANUNCIOS_FTERJ").on('value',s=>{ if(s.val()&&typeof s.val()==='object'&&!Array.isArray(s.val())){ CFG={...CFG,...s.val()}; renderRodape(); }});
db.ref("CONFIG_ANUNCIOS").on('value',s=>{ let v=s.val(); if(v&&typeof v==='object'&&!v.true&&!Array.isArray(v)){ CFG={...CFG,...v}; renderRodape(); }});

db.ref("FTERJ").on('value', snap=>{
  let data=snap.val(); if(!data){ placar.innerHTML="NENHUM LANCAMENTO EM FTERJ"; return; }
  let series=[];
  Object.keys(data).forEach(k=>{
    if(k.startsWith("serie_")){
      let s=data[k];
      series.push(s);
    }
  });
  series.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  contador.innerText=`${series.length} atiradores | ${new Date().toLocaleTimeString()}`;
  if(series.length==0){ placar.innerHTML=`<div style="padding:20px">FTERJ tem dados mas não é serie_: <pre style="font-size:10px">${JSON.stringify(data).substring(0,1000)}</pre></div>`; return; }
  let html="";
  series.forEach((s,i)=>{
    let tiros=s.tiros||[];
    let contagem=s.contagem||{};
    let xCount=contagem["x10"]||contagem["x10_"]||0;
    // calcula Xs
    let totalX = Object.values(contagem).reduce((a,b)=>a+b,0);
    html+=`<div class="card ${i==0?'destaque':''}">
      <div style="display:flex;justify-content:space-between"><span class="prova">${s.prova||'C'}</span><span style="font-size:1.5vh;opacity:0.6">#${(s.id||'').toString().substring(0,8)}</span></div>
      <div class="nome">${s.nome||'Atirador'}</div>
      <div class="meta">Tiros: ${tiros.length} | X: ${contagem["x10"]||0} | 10: ${contagem["x10"]||0}</div>
      <div class="tiros">${tiros.map(t=>`<div class="tiro ${t=='10'?'x10':t=='9'?'x9':''}">${t}</div>`).join('')}</div>
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:1.6vh;opacity:0.6">Contagem: ${JSON.stringify(contagem)}</span><span class="pontos">${s.pontos||0}</span></div>
    </div>`;
  });
  placar.innerHTML=html;
});

setInterval(renderRodape, (CFG.rodapes||5)*1000);
setInterval(()=>{ if(FULL.length>0){ let f=FULL[idxF%FULL.length]; if(f.arte){ imgFull.src=f.arte; txtFull.innerText=`${f.nome||''} - ${f.prop||''}`; full.style.display='flex'; setTimeout(()=>full.style.display='none',(f.tempo||7)*1000); idxF++; } } }, 60000);
setTimeout(renderRodape,800);
</script></body></html>
