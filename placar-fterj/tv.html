<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TV - FTERJ</title>
<style>
html,body{background:#000;color:#fff;font-family:'Arial Black',Arial;margin:0;text-align:center;height:100vh;overflow:hidden}
.topo{background:linear-gradient(90deg,#FF8C00,#FF4500);padding:5px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid #FFD700;height:115px}
.topo img{height:95px;width:95px;background:#fff;padding:6px;border-radius:10px}.topo h1{font-size:32px;margin:0;color:#000;flex:1}.logos-lado{display:flex;gap:10px}
.relogio{position:absolute;top:15px;right:20px;background:rgba(0,0,0,0.85);color:#FFD700;font-size:22px;padding:6px 16px;border-radius:20px;border:1px solid #FF8C00;z-index:90;font-family:monospace}
#tela-placar{position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;flex-direction:column}
#lista{flex:1;display:flex;flex-direction:column;justify-content:space-around;padding:8px}
.placar{display:flex;align-items:center;padding:18px 12px;background:#1a1a1a;border-left:6px solid #555;border-radius:8px;margin:5px 10px;min-height:55px;font-size:26px;font-weight:900}
.placar.p1{background:#FFD700;color:#000}.placar.p2{background:#C0C0C0;color:#000}.placar.p3{background:#CD7F32;color:#000}
.pos{width:8%}.nome{width:30%;text-align:left;padding-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prova{width:10%}.total{width:12%}.detalhe{width:40%;text-align:right;font-size:11px}
.rodape{background:linear-gradient(90deg,#FF8C00,#FF4500);border-top:4px solid #FFD700;padding:12px;width:100%;box-sizing:border-box;height:140px;display:flex;align-items:center;justify-content:center}
.rodape-conteudo{display:flex;justify-content:center;align-items:center;gap:20px;height:100%;flex-wrap:wrap;transition:opacity 0.3s}
.rodape-prop{color:#000;font-weight:900;font-size:52px}.rodape-contato{color:#fff;background:#000;padding:5px 12px;border-radius:20px;font-size:36px}
#insercao-full{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:9999;display:none;align-items:center;justify-content:center}
#prop-gigante img{width:100vw;height:100vh;object-fit:cover}
</style></head><body>
<div id="tela-placar"><div class="topo" id="topo-tv"><div class="relogio" id="relogio-tv"></div></div><div id="lista">AGUARDANDO...</div><div id="insercao-full"><div id="prop-gigante"></div></div><div class="rodape" id="rodape-tv"><div class="rodape-conteudo" id="rodape-conteudo"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="firebase-config.js"></script>
<script>
let ranking=[],PATROCINADORES_RODAPE=[],PATROCINADORES_FULL=[],indiceRodape=0,RODAPE_FONTE_PROP=52,RODAPE_FONTE_CONTATO=36,RODAPE_TEMPO_EXIBICAO_SEG=5;
function montarTopo(id){let e='<div class="logos-lado">',d='<div class="logos-lado">';if(QTD_LOGOS>=1) e+=`<img src="${LOGOS[0]}">`;if(QTD_LOGOS>=2) d+=`<img src="${LOGOS[1]}">`;e+='</div>';d+='</div>';document.getElementById(id).innerHTML=`${e}<h1>${NOME_CAMPEONATO} - ${NOME_CLUBE}</h1>${d}<div class="relogio" id="relogio-tv"></div>`;}montarTopo('topo-tv');
firebase.initializeApp(firebaseConfig);const db=firebase.database();
function rotacionarRodape(){const r=document.getElementById('rodape-conteudo');if(!r||!PATROCINADORES_RODAPE.length) return;r.style.opacity=0;setTimeout(()=>{let p=PATROCINADORES_RODAPE[indiceRodape];if(p){r.innerHTML=`<div class="rodape-prop" style="font-size:${RODAPE_FONTE_PROP}px!important;color:#000!important">${p.prop}</div><div class="rodape-contato" style="font-size:${RODAPE_FONTE_CONTATO}px!important">${p.contato}</div>`;}r.style.opacity=1;indiceRodape=(indiceRodape+1)%PATROCINADORES_RODAPE.length;},300);}
function aplicarFontesRodape(){document.documentElement.style.setProperty('--fonte-prop',RODAPE_FONTE_PROP+'px');document.documentElement.style.setProperty('--fonte-cont',RODAPE_FONTE_CONTATO+'px');}
function atualizarTela(){let html="";for(let i=0;i<10&&i<ranking.length;i++){let a=ranking[i];let todos=(a.tiros||[]).join(' | ');html+=`<div class="placar ${i==0?'p1':i==1?'p2':i==2?'p3':''}"><span class="pos">${i+1}º</span><span class="nome">${a.nome}</span><span class="prova">P:${a.prova}</span><span class="total">${a.pontos.toFixed(2)}</span><span class="detalhe">${todos}</span></div>`;}document.getElementById('lista').innerHTML=html||"<div class='placar'>AGUARDANDO</div>";}
db.ref(NOME_BANCO).on('value',snap=>{ranking=[];snap.forEach(c=>{let v=c.val();if(v) ranking.push(v);});ranking.sort((a,b)=>b.pontos-a.pontos);atualizarTela();});
db.ref(CHAVE_RODAPE).on('value',s=>{if(s.val()) PATROCINADORES_RODAPE=s.val();});
db.ref(CHAVE_TEMPOS).on('value',s=>{if(s.val()){let t=s.val();RODAPE_FONTE_PROP=t.fonteProp||52;RODAPE_FONTE_CONTATO=t.fonteCont||36;RODAPE_TEMPO_EXIBICAO_SEG=t.segRodape||5;}});
setInterval(rotacionarRodape,5000);setInterval(()=>{let el=document.getElementById('relogio-tv');if(el) el.innerText=new Date().toLocaleString('pt-BR');},1000);
</script></body></html>
