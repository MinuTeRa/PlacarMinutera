<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV FTERJ V19.5 - Logos + Controle Numerico</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
:root{
 --header-h:8vh; --linha-h:6.1vh; --rodape-h:5.5vh;
 --font-nome:2.3vh; --font-total:2.7vh;
 --logo-h:5.5vh;
 --prop-px:28px; --cont-px:20px;
 --escala:100%;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden;height:100vh;width:100vw;display:flex;flex-direction:column;zoom:var(--escala)}

#header{height:var(--header-h);background:linear-gradient(90deg,#000,#222);border-bottom:3px solid #FF8C00;display:flex;align-items:center;justify-content:space-between;padding:0 2vw;position:relative}
.logo{position:absolute;top:50%;transform:translateY(-50%);height:var(--logo-h);background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:80px;padding:0 5px}
.logo img{height:100%;width:auto;max-width:14vw;object-fit:contain;padding:3px 8px;display:block}
.logo span{font-weight:900;color:#000;font-size:calc(var(--logo-h) * 0.4);padding:0 10px;white-space:nowrap}
#logo-esq{left:1vw}
#logo-dir{right:1vw}
#titulo-central{width:100%;text-align:center;color:#FF8C00;font-weight:900;font-size:calc(var(--header-h) * 0.45);letter-spacing:1px}

#lista{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:0.5vh 1vw;gap:0.4vh}
.linha{background:rgba(255,255,255,0.07);border-left:4px solid #444;height:var(--linha-h);display:flex;align-items:center;justify-content:space-between;padding:0 1vw;border-radius:6px}
.linha.top1{border-left-color:#FFD700;background:rgba(255,215,0,0.15)}
.linha.top2{border-left-color:#C0C0C0}
.linha.top3{border-left-color:#CD7F32}
.pos{width:4vw;font-weight:900;color:#FF8C00;font-size:calc(var(--linha-h) * 0.5);text-align:center}
.nome{flex:1;font-size:var(--font-nome);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:1vw}
.total{width:12vw;text-align:right;font-size:var(--font-total);font-weight:900;color:#FFD700}

#rodape{height:var(--rodape-h);background:#FF8C00;display:flex;align-items:center;overflow:hidden;white-space:nowrap;position:relative}
#marquee{animation:scroll linear infinite;animation-duration:var(--velocidade,45s);display:flex;align-items:center;gap:5vw;padding-left:100%}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.item-prop{font-size:var(--prop-px);font-weight:900;color:#000;text-transform:uppercase}
.item-cont{font-size:var(--cont-px);font-weight:700;color:#222;text-transform:lowercase;margin-left:1vw}
</style>
</head>
<body>
<div id="header">
  <div id="logo-esq" class="logo"><span id="txt-esq">MinuT&Ra</span><img id="img-esq" src="logo-minha.png" style="display:none" onload="this.style.display='block';document.getElementById('txt-esq').style.display='none'" onerror="this.style.display='none'"></div>
  <div id="titulo-central">RANKING AO VIVO</div>
  <div id="logo-dir" class="logo"><span id="txt-dir">FTERJ</span><img id="img-dir" src="logo-clube.png" style="display:none" onload="this.style.display='block';document.getElementById('txt-dir').style.display='none'" onerror="this.style.display='none'"></div>
</div>

<div id="lista"></div>

<div id="rodape"><div id="marquee"></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let CFG={}, PROP=[];

function applyConfig(){
  if(!CFG) return;
  document.documentElement.style.setProperty('--header-h',(CFG.headerH||8)+'vh');
  document.documentElement.style.setProperty('--linha-h',(CFG.linhaH||6.1)+'vh');
  document.documentElement.style.setProperty('--rodape-h',(CFG.rodapeH||5.5)+'vh');
  document.documentElement.style.setProperty('--font-nome',(CFG.fontNome||2.3)+'vh');
  document.documentElement.style.setProperty('--font-total',(CFG.fontTotal||2.7)+'vh');
  document.documentElement.style.setProperty('--logo-h',(CFG.logoH||5.5)+'vh');
  document.documentElement.style.setProperty('--prop-px',(CFG.propPx||28)+'px');
  document.documentElement.style.setProperty('--cont-px',(CFG.contPx||20)+'px');
  document.documentElement.style.setProperty('--escala',(CFG.escala||100)+'%');
  document.documentElement.style.setProperty('--velocidade',(CFG.velocidade||45)+'s');
  document.getElementById('marquee').style.animationDuration=(CFG.velocidade||45)+'s';
}

db.ref("CONFIG_ANUNCIOS_FTERJ").on('value',s=>{
  CFG=s.val()||{};
  applyConfig(); renderPropaganda();
});

db.ref("PROPAGANDA_FTERJ").on('value',s=>{
  let v=s.val(); PROP=[];
  if(v){ Object.values(v).forEach(x=>{ if(x.ativo) PROP.push(x); }); }
  renderPropaganda();
});

function renderPropaganda(){
  let m=document.getElementById('marquee'); if(!m) return;
  if(PROP.length==0){ m.innerHTML='<span class="item-prop">PATROCINE AQUI - FALE COM A FTERJ</span>'; return; }
  let html=''; PROP.forEach(p=>{
    html+=`<span class="item-prop">${p.nome||''}</span><span class="item-cont">${p.contato||''}</span><span style="color:#000;font-weight:900;margin:0 2vw">•</span>`;
  });
  m.innerHTML=html+html; // duplica pra loop infinito
}

db.ref("ranking_fterj").on('value',s=>{
  let data=s.val(); let lista=document.getElementById('lista'); lista.innerHTML='';
  if(!data) return;
  let arr=Object.values(data).sort((a,b)=>(b.total||0)-(a.total||0));
  arr.slice(0,14).forEach((at,idx)=>{
    let div=document.createElement('div');
    let cls='linha'; if(idx==0) cls+=' top1'; else if(idx==1) cls+=' top2'; else if(idx==2) cls+=' top3';
    div.className=cls;
    div.innerHTML=`<div class="pos">${idx+1}º</div><div class="nome">${at.nome||'---'}</div><div class="total">${at.total||0}</div>`;
    lista.appendChild(div);
  });
});
</script>
</body>
</html>
