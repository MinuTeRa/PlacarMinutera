<!DOCTYPE html><html><head><meta charset="UTF-8"><title>TV FTERJ V19.6 FINAL - COM LOGOS + CONTROLE</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{ --header-h:8vh; --linha-h:6.1vh; --rodape-h:5.5vh; --font-nome:2.3vh; --font-total:2.7vh; --logo-h:5.5vh; --velocidade:45s; }
html,body{height:100vh;overflow:hidden}
body{background:#000;color:#fff;font-family:Arial;display:flex;flex-direction:column}
#header{height:var(--header-h);min-height:var(--header-h);background:linear-gradient(90deg,#FF8C00,#FF6A00);display:flex;align-items:center;justify-content:center;position:relative}
#header h1{font-size:3.2vh;color:#000;font-weight:900}
.logo{position:absolute;top:50%;transform:translateY(-50%);height:var(--logo-h);background:#fff;border-radius:6px;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{height:100%;width:auto;max-width:14vw;object-fit:contain;padding:3px 8px}
#logoEsq{left:0.8vw} #logoDir{right:0.8vw}
#ranking{flex:1;display:flex;flex-direction:column;gap:0.4vh;padding:0.4vh 0.6vw;overflow:hidden;justify-content:space-between}
.linha{display:flex;align-items:center;background:#1a1a1a;border-radius:8px;padding:0 0.8vw;height:var(--linha-h);min-height:var(--linha-h)}
.linha.ouro{background:#FFD700;color:#000} .linha.prata{background:#C0C0C0;color:#000} .linha.bronze{background:#CD7F32;color:#000}
.pos{width:3.5vw;font-weight:900;text-align:center;font-size:2.4vh} .nome{flex:1;font-size:var(--font-nome);font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prova{width:7vw;text-align:center;color:#00E5FF;font-size:2.1vh;font-weight:900} .linha.ouro .prova,.linha.prata .prova,.linha.bronze .prova{color:#000}
.total{width:9vw;text-align:center;color:#FFD700;font-size:var(--font-total);font-weight:900} .linha.ouro .total,.linha.prata .total,.linha.bronze .total{color:#000}
.detalhe{width:15vw;text-align:right;font-size:1.7vh}
#datahora{text-align:center;padding:0.2vh} #datahora span{border:1px solid #FF8C00;border-radius:20px;padding:2px 12px;color:#FFD700;font-size:1.6vh}
#rodape{height:var(--rodape-h);min-height:var(--rodape-h);background:#000;border-top:2px solid #FF8C00;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
#textoRodape{display:inline-block;padding-left:100%;animation:marquee var(--velocidade) linear infinite;color:#FFD700;font-weight:900}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#full{position:fixed;inset:0;background:rgba(0,0,0,0.97);display:none;align-items:center;justify-content:center;z-index:9999;flex-direction:column}
#full img{max-width:80%;max-height:65%;border:5px solid gold;border-radius:16px}
</style></head><body>
<div id="header">
<div id="logoEsq" class="logo"><img src="logo-minha.png" onerror="this.parentElement.innerHTML='MinuT&Ra';this.parentElement.style.padding='3px 10px';this.parentElement.style.fontWeight='900';this.parentElement.style.color='#000'"></div>
<h1>3x7 MinuT&Ra - FTERJ</h1>
<div id="logoDir" class="logo"><img src="logo-clube.png" onerror="this.parentElement.innerHTML='FTERJ';this.parentElement.style.padding='3px 10px';this.parentElement.style.fontWeight='900';this.parentElement.style.color='#000'"></div>
</div>
<div id="ranking">CARREGANDO...</div>
<div id="datahora"><span id="dh">--/--/---- | --:--:--</span></div>
<div id="rodape"><div id="textoRodape">Carregando...</div></div>
<div id="full"><img id="imgFull"><div id="txtFull" style="color:gold;margin-top:12px;font-size:2.8vh;font-weight:bold;text-align:center"></div><div id="fullCount" style="color:#fff;margin-top:8px"></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
function toArr(d){ if(!d) return []; if(Array.isArray(d)) return d.filter(x=>x); return Object.values(d).filter(x=>x); }
let RODAPES=[], FULL=[];
let CFG={propPx:28,contPx:20,escala:100,velocidade:45,headerH:8,linhaH:6.1,rodapeH:5.5,fontNome:2.3,fontTotal:2.7,logoH:5.5,intervaloFull:120,tempoFull:7};
function applyConfig(){
 let zoom=(CFG.escala||100)/100; document.body.style.zoom=zoom;
 document.documentElement.style.setProperty('--header-h',(CFG.headerH||8)+'vh');
 document.documentElement.style.setProperty('--linha-h',(CFG.linhaH||6.1)+'vh');
 document.documentElement.style.setProperty('--rodape-h',(CFG.rodapeH||5.5)+'vh');
 document.documentElement.style.setProperty('--font-nome',(CFG.fontNome||2.3)+'vh');
 document.documentElement.style.setProperty('--font-total',(CFG.fontTotal||2.7)+'vh');
 document.documentElement.style.setProperty('--logo-h',(CFG.logoH||5.5)+'vh');
 document.documentElement.style.setProperty('--velocidade',(CFG.velocidade||45)+'s');
 renderRodape();
}
function renderRodape(){
 if(RODAPES.length==0){ document.getElementById('textoRodape').innerText='🔥 ADIQUIRA JA SUA MinuT&Ra 🔥 Thiago (28) 99944-9010 | Ruam (22) 99834-3139'; return; }
 let txt=RODAPES.map(r=>`🔥 ${r.prop||r.propaganda||r.nome||''} | 📞 ${r.contato||''}`).join('   ★   ');
 let pSize=Math.round((CFG.propPx||28)*(CFG.escala||100)/100);
 document.getElementById('textoRodape').innerHTML=`<span style="font-size:${pSize}px">${txt}   ★   ${txt}</span>`;
}
db.ref("PATROCINADORES_RODAPE_FTERJ").on('value',s=>{ let a=toArr(s.val()); if(a.length>0){RODAPES=a; renderRodape();}});
db.ref("PATROCINADORES_FULL_FTERJ").on('value',s=>{ FULL=toArr(s.val()).map(i=>typeof i==='string'?{arte:i}:i).filter(f=>f.arte||f.url||f.imagem);});
db.ref("CONFIG_ANUNCIOS_FTERJ").on('value',s=>{ let v=s.val(); if(v && typeof v==='object' && !Array.isArray(v)){ CFG={...CFG,...v}; applyConfig(); }});
db.ref("FTERJ").on('value',snap=>{
 let data=snap.val(); if(!data) return; let lista=[];
 Object.keys(data).forEach(k=>{ if(k.startsWith("serie_")){ let s=data[k]; let c=s.contagem||{}; let tiros=s.tiros||[]; let x=c["x10"]||0; let dez=c["10"]||0; let nove=c["9"]||0; if(Object.keys(c).length<3){ x=tiros.filter(t=>String(t).toLowerCase()=='x').length; dez=tiros.filter(t=>String(t)=='10').length; nove=tiros.filter(t=>String(t)=='9').length; } lista.push({nome:s.nome||'TESTE',prova:s.prova||'R2',pontos:parseFloat(s.pontos||0),x,dez,nove}); }});
 lista.sort((a,b)=>b.pontos-a.pontos);
 let qtd=Math.min(lista.length,12);
 if(qtd>=10){ let disp=100 - (CFG.headerH||8) - (CFG.rodapeH||5.5) - 3; let novaL=(disp/qtd)-0.5; if(!CFG.linhaH || CFG.linhaH==6.1) document.documentElement.style.setProperty('--linha-h',novaL+'vh'); }
 let html=""; lista.slice(0,12).forEach((at,i)=>{ let cls=i==0?'ouro':i==1?'prata':i==2?'bronze':''; html+=`<div class="linha ${cls}"><div class="pos">${i+1}º</div><div class="nome">${at.nome}</div><div class="prova">P:${at.prova}</div><div class="total">${at.pontos.toFixed(2)}</div><div class="detalhe">X:${at.x} | 10:${at.dez} | 9:${at.nove}</div></div>`; }); document.getElementById('ranking').innerHTML=html;
});
setInterval(()=>{ document.getElementById('dh').innerText=new Date().toLocaleDateString('pt-BR')+" | "+new Date().toLocaleTimeString('pt-BR'); },1000);
let emBloco=false;
async function mostraBlocoFull(){
 if(FULL.length==0 || emBloco) return; emBloco=true;
 for(let i=0;i<FULL.length;i++){
  let f=FULL[i]; let url=f.arte||f.url||f.imagem||''; if(!url) continue;
  document.getElementById('imgFull').src=url;
  document.getElementById('txtFull').innerText=`${f.nome||''} ${f.prop||f.propaganda||''} ${f.contato||''}`.trim();
  document.getElementById('fullCount').innerText=`Anúncio ${i+1}/${FULL.length}`;
  document.getElementById('full').style.display='flex';
  await new Promise(r=>setTimeout(r,(f.tempo||CFG.tempoFull||7)*1000));
 }
 document.getElementById('full').style.display='none'; emBloco=false;
}
setInterval(mostraBlocoFull, (CFG.intervaloFull||120)*1000);
setTimeout(mostraBlocoFull, 15000);
applyConfig();
</script></body></html>
