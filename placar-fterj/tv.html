<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>TV - FTERJ V17.1</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;overflow:hidden}
#placar{height:88vh;display:flex;align-items:center;justify-content:center;font-size:8vh}
#rodape{position:fixed;bottom:0;width:100%;height:12vh;background:linear-gradient(90deg,#FF8C00,#FFD700);color:#000;display:flex;align-items:center;overflow:hidden;font-weight:bold;font-size:3.5vh;white-space:nowrap}
#rodape span{padding-left:100%;animation:marquee 20s linear infinite}
@keyframes marquee{0%{transform:translate(0,0)}100%{transform:translate(-100%,0)}}
#full{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:9999}
#full img{max-width:90%;max-height:90%;border:5px solid #FFD700;border-radius:20px}
</style>
</head><body>
<div id="placar">CARREGANDO PLACAR FTERJ...</div>
<div id="rodape"><span id="textoRodape">Carregando patrocinadores...</span></div>
<div id="full" onclick="this.style.display='none'"><div style="text-align:center"><img id="imgFull"><div id="txtFull" style="font-size:4vh;color:#FFD700;margin-top:20px"></div></div></div>
<script>
const NOME_BANCO="FTERJ";
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera",storageBucket:"placar-minutera.firebasestorage.app",messagingSenderId:"689991648080",appId:"1:689991648080:web:9deeb958183eae23e255"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
function toArr(d){ if(!d) return []; if(Array.isArray(d)) return d.filter(x=>x); if(typeof d==='object') return Object.values(d).filter(x=>x && typeof x==='object'); return []; }
let RODAPES=[], FULL=[], idxR=0, idxF=0, cfg={rodapes:5,full:60,propPx:52,contPx:36,escala:100};
function atualizaRodape(){
 if(RODAPES.length===0){ document.getElementById('textoRodape').innerText="SEM PATROCINADORES CADASTRADOS"; return; }
 let r=RODAPES[idxR % RODAPES.length];
 let txt=` ⭐ ${r.prop||r.propaganda||r.nome||''} - ${r.contato||r.cont||''} ⭐ `;
 document.getElementById('textoRodape').innerText=txt.repeat(5);
 idxR++;
}
function mostraFull(){
 if(FULL.length===0) return;
 let f=FULL[idxF % FULL.length];
 if(f.arte){ document.getElementById('imgFull').src=f.arte; } else { document.getElementById('imgFull').src=""; }
 document.getElementById('txtFull').innerText=(f.nome||"")+" - "+(f.prop||f.texto||"");
 document.getElementById('full').style.display='flex';
 setTimeout(()=>{ document.getElementById('full').style.display='none'; idxF++; }, (f.tempo||7)*1000);
}
// CARREGA COM FALLBACK TRIPLO
db.ref("PATROCINADORES_RODAPE_FTERJ").on('value', s=>{
 let a=toArr(s.val());
 if(a.length>0){ RODAPES=a; console.log("FTERJ RODAPE OK",a.length); }
 else { db.ref("CONFIG_RODAPE_GLOBAL").once('value', sg=>{ let b=toArr(sg.val()); if(b.length>0){ RODAPES=b; console.log("Fallback GLOBAL",b.length); } }); }
});
db.ref("PATROCINADORES_FULL_FTERJ").on('value', s=>{
 let a=toArr(s.val());
 if(a.length>0) FULL=a; else db.ref("CONFIG_FULL_GLOBAL").once('value', sg=>{ FULL=toArr(sg.val()); });
});
db.ref("CONFIG_ANUNCIOS_FTERJ").on('value', s=>{ if(s.val()) cfg={...cfg,...s.val()}; });
db.ref("PLACAR_"+NOME_BANCO).on('value', s=>{
 let d=s.val(); if(!d) return;
 let html=`<div style="text-align:center"><div style="font-size:4vh;color:#FFD700">FTERJ - ${d.fase||''} ${d.prova||''}</div><div style="display:flex;gap:40px;margin-top:20px">`;
 if(d.atiradores) Object.values(d.atiradores).forEach(at=>{ html+=`<div style="background:#111;padding:10px;border-radius:10px;border:2px solid #333"><b>${at.nome||''}</b><br>${at.total||0} pts</div>`; });
 html+=`</div></div>`;
 document.getElementById('placar').innerHTML=html;
});
// ROTINAS
setInterval(atualizaRodape, (cfg.rodapes||5)*1000);
setInterval(mostraFull, (cfg.full||60)*1000);
setTimeout(atualizaRodape,1000);
setTimeout(mostraFull,5000);
</script>
</body></html>
