<!DOCTYPE html><html><head><meta charset="UTF-8"><title>TV FTERJ V19.1 - FINAL COM CONTROLES</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
 --header-h:9vh; --linha-h:7.2vh; --rodape-h:7vh;
 --font-pos:2.8vh; --font-nome:2.6vh; --font-prova:2.4vh; --font-total:3vh; --font-detalhe:1.9vh;
 --velocidade:35s;
}
body{background:#000;color:#fff;font-family:Arial;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#header{height:var(--header-h);background:linear-gradient(90deg,#FF8C00,#FF6A00);display:flex;align-items:center;justify-content:center;position:relative}
#header h1{font-size:3.5vh;color:#000;font-weight:900}
.logo{position:absolute;top:50%;transform:translateY(-50%);height:6.5vh;background:#fff;border-radius:8px;padding:4px}
#logoEsq{left:1vw} #logoDir{right:1vw}
#ranking{flex:1;padding:0.5vh 0.8vw;display:flex;flex-direction:column;gap:0.5vh;overflow:hidden}
.linha{display:flex;align-items:center;background:#1a1a1a;border-radius:10px;padding:0 1vw;height:var(--linha-h);min-height:var(--linha-h)}
.linha.ouro{background:#FFD700;color:#000} .linha.prata{background:#C0C0C0;color:#000} .linha.bronze{background:#CD7F32;color:#000}
.pos{width:4vw;font-size:var(--font-pos);font-weight:900;text-align:center}
.nome{flex:1;font-size:var(--font-nome);font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prova{width:8vw;text-align:center;color:#00E5FF;font-size:var(--font-prova);font-weight:900}
.linha.ouro .prova,.linha.prata .prova,.linha.bronze .prova{color:#000}
.total{width:11vw;text-align:center;color:#FFD700;font-size:var(--font-total);font-weight:900}
.linha.ouro .total,.linha.prata .total,.linha.bronze .total{color:#000}
.detalhe{width:18vw;text-align:right;font-size:var(--font-detalhe);font-weight:700}
#datahora{text-align:center;padding:0.3vh}
#datahora span{border:1px solid #FF8C00;border-radius:20px;padding:3px 15px;color:#FFD700;font-size:1.8vh}
#rodape{height:var(--rodape-h);background:#000;border-top:3px solid #FF8C00;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
#textoRodape{display:inline-block;padding-left:100%;animation:marquee var(--velocidade) linear infinite;color:#FFD700;font-weight:900}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#full{position:fixed;inset:0;background:rgba(0,0,0,0.96);display:none;align-items:center;justify-content:center;z-index:9999;flex-direction:column}
#full img{max-width:85%;max-height:70%;border:6px solid gold;border-radius:20px}
</style>
</head><body>
<div id="header">
<div id="logoEsq" class="logo" style="display:flex;align-items:center;font-weight:900;color:#000;font-size:1.5vh">MinuT&Ra</div>
<h1>3x7 MinuT&Ra - FTERJ</h1>
<div id="logoDir" class="logo" style="display:flex;align-items:center;font-weight:900;color:#000;font-size:1.5vh">FTERJ</div>
</div>
<div id="ranking">CARREGANDO...</div>
<div id="datahora"><span id="dh">--/--/---- | --:--:--</span></div>
<div id="rodape"><div id="textoRodape">Carregando patrocinadores...</div></div>
<div id="full" onclick="this.style.display='none'"><img id="imgFull"><div id="txtFull" style="color:gold;margin-top:15px;font-size:3vh;font-weight:bold;text-align:center"></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
function toArr(d){ if(!d) return []; if(Array.isArray(d)) return d.filter(x=>x); return Object.values(d).filter(x=>x); }
let RODAPES=[], FULL=[], idxR=0, idxF=0;
let CFG={propPx:32,contPx:22,escala:100,velocidade:35,headerH:9,linhaH:7.2,rodapeH:7,fontNome:2.6,fontTotal:3};

function applyConfig(){
 document.documentElement.style.setProperty('--header-h', (CFG.headerH||9)+'vh');
 document.documentElement.style.setProperty('--linha-h', (CFG.linhaH||7.2)+'vh');
 document.documentElement.style.setProperty('--rodape-h', (CFG.rodapeH||7)+'vh');
 document.documentElement.style.setProperty('--font-nome', (CFG.fontNome||2.6)+'vh');
 document.documentElement.style.setProperty('--font-total', (CFG.fontTotal||3)+'vh');
 document.documentElement.style.setProperty('--velocidade', (CFG.velocidade||35)+'s');
 renderRodape();
}
function renderRodape(){
 if(RODAPES.length==0){ document.getElementById('textoRodape').innerText='🔥 ADIQUIRA JA A SUA MinuT&Ra 🔥 Thiago (28) 99944-9010 | Ruam (22) 99834-3139'; return; }
 let txt=RODAPES.map(r=>`🔥 ${r.prop||r.propaganda||r.nome||''} | 📞 ${r.contato||''}`).join('   ★   ');
 // repete para preencher
 let pSize=Math.round((CFG.propPx||32)*(CFG.escala||100)/100);
 document.getElementById('textoRodape').innerHTML=`<span style="font-size:${pSize}px">${txt}   ★   ${txt}</span>`;
}

db.ref("PATROCINADORES_RODAPE_FTERJ").on('value',s=>{ let a=toArr(s.val()); if(a.length>0){RODAPES=a; renderRodape();} });
db.ref("PATROCINADORES_FULL_FTERJ").on('value',snap=>{
 let data=snap.val(); let arr=toArr(data);
 // SE for array direto de URLs ou objetos mistos
 FULL=arr.map(item=>{
   if(typeof item==='string') return {arte:item,nome:'',prop:'',tempo:7};
   return item;
 }).filter(f=>f.arte||f.url||f.imagem);
 console.log("FULL carregados:",FULL.length, FULL);
});
db.ref("CONFIG_ANUNCIOS_FTERJ").on('value',s=>{
 let v=s.val(); if(v && typeof v==='object' && !Array.isArray(v)){ CFG={...CFG,...v}; applyConfig(); }
});

db.ref("FTERJ").on('value',snap=>{
 let data=snap.val(); if(!data) return;
 let lista=[];
 Object.keys(data).forEach(k=>{
  if(k.startsWith("serie_")){
   let s=data[k];
   let c=s.contagem||{}; let tiros=s.tiros||[];
   let x = c["x10"]||0; let dez = c["10"]||0; let nove = c["9"]||0;
   if(Object.keys(c).length<3){
     x = tiros.filter(t=>String(t).toLowerCase()=='x').length;
     dez = tiros.filter(t=>String(t)=='10').length;
     nove = tiros.filter(t=>String(t)=='9').length;
   }
   lista.push({nome:s.nome||'TESTE',prova:s.prova||'R2',pontos:parseFloat(s.pontos||0),x,dez,nove});
  }
 });
 lista.sort((a,b)=>b.pontos-a.pontos);
 let html="";
 lista.slice(0,12).forEach((at,i)=>{
  let cls=i==0?'ouro':i==1?'prata':i==2?'bronze':'';
  html+=`<div class="linha ${cls}"><div class="pos">${i+1}º</div><div class="nome">${at.nome}</div><div class="prova">P:${at.prova}</div><div class="total">${at.pontos.toFixed(2)}</div><div class="detalhe">X:${at.x} | 10:${at.dez} | 9:${at.nove}</div></div>`;
 });
 document.getElementById('ranking').innerHTML=html;
});

setInterval(()=>{ document.getElementById('dh').innerText=new Date().toLocaleDateString('pt-BR')+" | "+new Date().toLocaleTimeString('pt-BR'); },1000);
setInterval(renderRodape,6000);
// FULL rotativo - CORRIGIDO
setInterval(()=>{
 if(FULL.length>0){
  let f=FULL[idxF%FULL.length];
  let url=f.arte||f.url||f.imagem||'';
  if(url){
    document.getElementById('imgFull').src=url;
    document.getElementById('txtFull').innerText=`${f.nome||''} ${f.prop||f.propaganda||''} ${f.contato||''}`;
    document.getElementById('full').style.display='flex';
    setTimeout(()=>document.getElementById('full').style.display='none',(f.tempo||7)*1000);
    idxF++;
  }
 }
}, 15000);
applyConfig();
</script></body></html>
