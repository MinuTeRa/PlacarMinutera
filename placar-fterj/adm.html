<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ADM - FTERJ</title>
<style>html,body{background:#111;color:#fff;font-family:Arial;margin:0}.tela-adm{background:#111;min-height:100vh;padding:20px;box-sizing:border-box}.card-adm{background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:20px;margin:15px auto;max-width:900px;text-align:left}.link-adm{display:block;background:#222;color:#00FFFF;padding:10px;margin:6px 0;border-radius:8px;text-decoration:none;font-family:monospace;border:1px solid #444}.switch{position:relative;display:inline-block;width:44px;height:24px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#444;transition:.4s;border-radius:24px}.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;transition:.4s;border-radius:50%}input:checked+.slider{background:#00C853}input:checked+.slider:before{transform:translateX(20px)}button{padding:8px 12px;border-radius:6px;border:none;font-weight:bold;cursor:pointer}</style></head><body><div class="tela-adm"><h1 style="color:#FFD700;">⚙️ ADM - FTERJ</h1><div class="card-adm" style="border:2px solid #FFD700"><h2>📢 FULL</h2><label class="switch"><input type="checkbox" id="toggleAnuncio" checked onchange="alternarAnuncios()"><span class="slider"></span></label><span id="statusAnuncio" style="margin-left:10px;color:#00FF00;font-weight:bold">LIGADOS</span></div><div class="card-adm"><h2>🔑 SENHA</h2><input type="password" id="novaSenhaADM" placeholder="Nova senha" style="padding:8px;border-radius:6px;background:#222;color:#fff;border:1px solid #444"><button onclick="trocarSenhaADM()" style="background:#FFD700">SALVAR</button><div id="msgSenhaADM" style="color:#81C784"></div></div><div class="card-adm"><h2>🔗 LINKS</h2><div id="links-adm"></div></div><div class="card-adm"><h2>🔥 CONTROLE</h2><button onclick="if(confirm('Apagar placar?')) db.ref(NOME_BANCO).remove()" style="background:#b00;color:#fff">APAGAR PLACAR</button><div id="statusADM" style="margin-top:10px;color:#81C784"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script src="firebase-config.js"></script>
<script>firebase.initializeApp(firebaseConfig);const db=firebase.database();function montarLinksADM(){let base=window.location.href.replace('adm.html','');document.getElementById('links-adm').innerHTML=`<a class="link-adm" href="${base}tv.html" target="_blank">📺 TELÃO tv.html</a><a class="link-adm" href="${base}celular.html" target="_blank">📱 CELULAR</a><a class="link-adm" href="${base}index.html" target="_blank">🎯 LANÇAMENTO</a><a class="link-adm" href="${base}anuncios.html" target="_blank">📢 ANUNCIOS</a>`;}montarLinksADM();function trocarSenhaADM(){let ns=document.getElementById('novaSenhaADM').value.trim();if(ns.length<4) return;db.ref(CHAVE_SENHA_FIREBASE).set(ns).then(()=>{document.getElementById('msgSenhaADM').innerText='✅ Atualizada';});}function alternarAnuncios(){let t=document.getElementById('toggleAnuncio');db.ref('CONFIG_ANUNCIOS').set(t.checked);}db.ref('CONFIG_ANUNCIOS').on('value',s=>{let v=s.val();let tg=document.getElementById('toggleAnuncio');if(tg) tg.checked=v!==false;let st=document.getElementById('statusAnuncio');if(st){st.innerText=(v!==false)?'LIGADOS':'DESLIGADOS';st.style.color=(v!==false)?'#00FF00':'#f44';}});</script></body></html>
