<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM FTERJ - V22 - FINAL</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:10px}
h1{background:linear-gradient(90deg,#FF8C00,#FF6A00);color:#000;padding:12px;text-align:center;font-weight:900;border-radius:8px;font-size:16px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:12px;margin-top:12px}
.card h2{color:#FF8C00;font-size:13px;margin-bottom:8px;border-bottom:1px solid #333;padding-bottom:5px}
label{font-size:11px;color:#aaa;display:block;margin-top:8px}
input{width:100%;padding:7px;border-radius:5px;border:1px solid #444;background:#000;color:#fff;margin-top:3px;font-size:12px}
button{padding:7px 12px;border:none;border-radius:5px;font-weight:900;cursor:pointer;font-size:11px;margin-top:6px;margin-right:4px}
.btn-save{background:#FF8C00;color:#000}
.btn-on{background:#00c851;color:#fff}
.btn-off{background:#ff4444;color:#fff}
.btn-del{background:#222;color:#ff4444;border:1px solid #ff4444}
.item{display:flex;align-items:center;gap:8px;background:#000;padding:8px;border-radius:6px;margin-top:6px;border:1px solid #222}
.item img{width:70px;height:45px;object-fit:cover;border-radius:4px;background:#222}
.item-info{flex:1;font-size:10px;line-height:1.3}
.status{font-size:9px;padding:2px 5px;border-radius:3px;font-weight:900;display:inline-block;margin-top:2px}
.ativo{background:green;color:#fff}
.inativo{background:red;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>ADM FTERJ - V22 - CONTROLE FULL</h1>

<div class="grid">
<div class="card">
<h2>1 - LOGOS</h2>
<label>Logo Clube (FTERJ)</label>
<input id="logoClube" placeholder="https://...">
<label>Logo MinuT&Ra</label>
<input id="logoMinutera" placeholder="https://...">
<button class="btn-save" onclick="salvarLogos()">SALVAR LOGOS</button>
<div style="display:flex;gap:10px;margin-top:8px">
<img id="prevClube" style="height:35px;background:#fff;padding:2px;border-radius:4px">
<img id="prevMinutera" style="height:35px;background:#fff;padding:2px;border-radius:4px">
</div>
</div>

<div class="card">
<h2>2 - TEMPOS</h2>
<label>Intervalo entre blocos FULL (segundos)</label>
<input id="intervaloFull" type="number" value="120">
<label>Tempo de cada arte FULL (segundos)</label>
<input id="tempoFull" type="number" value="7">
<button class="btn-save" onclick="salvarTempos()">SALVAR TEMPOS</button>
</div>
</div>

<div class="card">
<h2>3 - ADICIONAR NOVO FULL</h2>
<div class="grid">
<div><label>Nome</label><input id="fullNome" placeholder="Ex: Loja Tática"></div>
<div><label>Tempo (s)</label><input id="fullTempo" type="number" placeholder="7"></div>
</div>
<label>URL da Arte (imagem)</label>
<input id="fullArte" placeholder="https://.../arte.jpg">
<button class="btn-save" onclick="addFull()">ADICIONAR FULL</button>
</div>

<div class="card">
<h2>4 - LISTA FULL - DESATIVAR CORRIGIDO</h2>
<div id="listaFull">CARREGANDO...</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

function toArrKeys(d){
 if(!d) return [];
 return Object.keys(d).map(k=>({key:k,...(typeof d[k]==='string'?{arte:d[k]}:d[k])}));
}

db.ref("CONFIG_ANUNCIOS_FTERJ").on('value',s=>{
 let v=s.val(); if(!v) return;
 document.getElementById('logoClube').value=v.logoClube||'';
 document.getElementById('logoMinutera').value=v.logoMinutera||'';
 document.getElementById('intervaloFull').value=v.intervaloFull||120;
 document.getElementById('tempoFull').value=v.tempoFull||7;
 if(v.logoClube) document.getElementById('prevClube').src=v.logoClube;
 if(v.logoMinutera) document.getElementById('prevMinutera').src=v.logoMinutera;
});

function salvarLogos(){
 db.ref("CONFIG_ANUNCIOS_FTERJ").update({
  logoClube: document.getElementById('logoClube').value.trim(),
  logoMinutera: document.getElementById('logoMinutera').value.trim()
 }).then(()=>alert("Logos salvos!"));
}
function salvarTempos(){
 db.ref("CONFIG_ANUNCIOS_FTERJ").update({
  intervaloFull: parseInt(document.getElementById('intervaloFull').value)||120,
  tempoFull: parseInt(document.getElementById('tempoFull').value)||7
 }).then(()=>alert("Tempos salvos!"));
}
function addFull(){
 let nome=document.getElementById('fullNome').value.trim();
 let arte=document.getElementById('fullArte').value.trim();
 let tempo=parseInt(document.getElementById('fullTempo').value)||7;
 if(!arte){ alert("Coloca a URL da arte"); return; }
 db.ref("PATROCINADORES_FULL_FTERJ").push({nome:nome||'Patrocinador', arte:arte, tempo:tempo, ativo:true, criado:Date.now()})
.then(()=>{ document.getElementById('fullNome').value=''; document.getElementById('fullArte').value=''; document.getElementById('fullTempo').value=''; alert("FULL adicionado e ATIVO"); });
}

db.ref("PATROCINADORES_FULL_FTERJ").on('value',snap=>{
 let data=snap.val();
 let div=document.getElementById('listaFull');
 if(!data){ div.innerHTML='NENHUM FULL CADASTRADO'; return; }
 let lista=toArrKeys(data);
 let html='';
 lista.forEach(it=>{
  let ativo = it.ativo!==false && it.ativo!=="false";
  html+=`<div class="item">
   <img src="${it.arte||''}" onerror="this.style.background='red'">
   <div class="item-info">
    <b style="color:#FFD700">${it.nome||'Sem nome'}</b><br>
    <span style="color:#aaa">${(it.arte||'').substring(0,38)}...</span><br>
    <span class="status ${ativo?'ativo':'inativo'}">${ativo?'ATIVO - APARECE':'DESATIVADO - NÃO APARECE'}</span> | ${it.tempo||7}s
   </div>
   <button class="${ativo?'btn-off':'btn-on'}" onclick="toggleFull('${it.key}',${ativo})">${ativo?'DESATIVAR':'ATIVAR'}</button>
   <button class="btn-del" onclick="delFull('${it.key}')">X</button>
  </div>`;
 });
 div.innerHTML=html;
});

// FUNÇÃO CORRIGIDA QUE QUEBRA O LOOP
function toggleFull(key, estaAtivo){
 let novo =!estaAtivo;
 console.log("Toggling "+key+" de "+estaAtivo+" para "+novo);
 db.ref("PATROCINADORES_FULL_FTERJ/"+key).update({ativo: novo})
.then(()=>console.log("OK - FULL "+key+" ativo="+novo))
.catch(e=>alert("Erro: "+e.message));
}

function delFull(key){
 if(!confirm("Apagar definitivo esse FULL?")) return;
 db.ref("PATROCINADORES_FULL_FTERJ/"+key).remove();
}
</script>
</body>
</html>
