<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN TV - Tamanhos</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
body{background:#111;color:#fff;font-family:Arial;padding:15px}
h2{color:#FF8C00;text-align:center;margin-bottom:15px}
.card{background:#1e1e1e;border:1px solid #333;border-radius:10px;padding:12px;margin-bottom:12px}
label{font-size:13px;color:#aaa;display:block;margin-bottom:4px}
input{width:100%;padding:10px;border-radius:6px;border:1px solid #444;background:#000;color:#FFD700;font-size:18px;font-weight:900;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;padding:14px;background:#FF8C00;color:#000;border:0;border-radius:8px;font-weight:900;font-size:18px;margin-top:10px}
#status{text-align:center;margin-top:10px;color:#0f0;font-weight:bold}
</style></head><body>
<h2>CONTROLE TV FTERJ - TAMANHOS</h2>

<div class="card"><label>ALTURA DA LOGO (vh) - padrão 5.5</label><input type="number" id="logoH" step="0.1"></div>

<div class="grid">
<div class="card"><label>ALTURA CABEÇALHO (vh)</label><input type="number" id="headerH" step="0.1"></div>
<div class="card"><label>ALTURA LINHAS (vh)</label><input type="number" id="linhaH" step="0.1"></div>
</div>

<div class="grid">
<div class="card"><label>LETRA NOME (vh)</label><input type="number" id="fontNome" step="0.1"></div>
<div class="card"><label>LETRA TOTAL (vh)</label><input type="number" id="fontTotal" step="0.1"></div>
</div>

<div class="grid">
<div class="card"><label>ALTURA RODAPÉ (vh)</label><input type="number" id="rodapeH" step="0.1"></div>
<div class="card"><label>VELOCIDADE RODAPÉ (seg)</label><input type="number" id="velocidade" step="1"></div>
</div>

<div class="grid">
<div class="card"><label>LETRA PROPAGANDA RODAPÉ (px)</label><input type="number" id="propPx" step="1"></div>
<div class="card"><label>LETRA CONTATO RODAPÉ (px)</label><input type="number" id="contPx" step="1"></div>
</div>

<div class="card"><label>ESCALA GERAL (%) 100 = normal</label><input type="number" id="escala" step="5"></div>

<button onclick="salvar()">💾 SALVAR NA TV</button>
<div id="status"></div>

<script>
const firebaseConfig={apiKey:"AIzaSyCTEXeRjxq0_3doBNyWm5AkQ0kmBXmjlSk",authDomain:"placar-minutera.firebaseapp.com",databaseURL:"https://placar-minutera-default-rtdb.firebaseio.com",projectId:"placar-minutera"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();

let CFG={};

db.ref("CONFIG_ANUNCIOS_FTERJ").on('value',s=>{
  let v=s.val(); if(!v) return; CFG=v;
  document.getElementById('logoH').value=v.logoH||5.5;
  document.getElementById('headerH').value=v.headerH||8;
  document.getElementById('linhaH').value=v.linhaH||6.1;
  document.getElementById('rodapeH').value=v.rodapeH||5.5;
  document.getElementById('fontNome').value=v.fontNome||2.3;
  document.getElementById('fontTotal').value=v.fontTotal||2.7;
  document.getElementById('propPx').value=v.propPx||28;
  document.getElementById('contPx').value=v.contPx||20;
  document.getElementById('velocidade').value=v.velocidade||45;
  document.getElementById('escala').value=v.escala||100;
});

function salvar(){
  let novo={
    logoH: parseFloat(document.getElementById('logoH').value),
    headerH: parseFloat(document.getElementById('headerH').value),
    linhaH: parseFloat(document.getElementById('linhaH').value),
    rodapeH: parseFloat(document.getElementById('rodapeH').value),
    fontNome: parseFloat(document.getElementById('fontNome').value),
    fontTotal: parseFloat(document.getElementById('fontTotal').value),
    propPx: parseInt(document.getElementById('propPx').value),
    contPx: parseInt(document.getElementById('contPx').value),
    velocidade: parseInt(document.getElementById('velocidade').value),
    escala: parseInt(document.getElementById('escala').value)
  };
  db.ref("CONFIG_ANUNCIOS_FTERJ").update(novo).then(()=>{
    document.getElementById('status').innerText="✅ SALVO! A TV já atualizou!";
    setTimeout(()=>document.getElementById('status').innerText="",3000);
  });
}
</script></body></html>
